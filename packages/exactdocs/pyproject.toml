[project]
name = "exactdocs"
dynamic = ["version", "dependencies"]
description = "Self-hosted, version-accurate documentation for AI coding agents (MCP server)."
readme = "README.md"
license = "Apache-2.0"
# A copy of the repository's LICENSE (PEP 639 allows no path outside the package), so the wheel
# and the sdist carry it; packages/exactdocs/tests/ci/test_licenses.py keeps
# the copies equal.
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Cyprian Gburek" }]
keywords = ["mcp", "documentation", "rag", "ai-agents", "fastmcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
# AI retrieval (docs/decisions/ai-retrieval.md): imported only once a model role is configured, so
# an install without it, or with it and nothing configured, stays a BM25 server (RUN-02). Exact
# pins: the harness 0.60.0 requires pydantic-ai-slim 2.60.0. The harness is taken without its
# `[codemode]` extra (that extra pulls a DuckDuckGo search client); Monty is listed directly.
# On a harness bump, re-check: the agentic loop detection (#99) relies on Code Mode sending the
# nested read calls through the parent's `root_capability` (`ToolManager.handle_call`), so our
# `wrap_tool_execute` sees them; `test_the_repeated_read_and_every_read_after_it_never_run` fails
# if it stops doing so.
ai = [
    "pydantic-ai-slim[openai,anthropic,google]==2.60.0",
    "pydantic-ai-harness==0.60.0",
    "pydantic-monty==1.6.0",
    "sqlite-vec==0.1.9",
    "pgvector==0.5.1",
    # Azure OpenAI and Claude on Azure AI Foundry with Entra ID (`auth = "entra"`): the sync token
    # provider only (`azure.identity.aio` would need aiohttp).
    "azure-identity==1.27.0",
]
# Local models (docs/decisions/ai-retrieval.md, *Local and offline models*): an embedding model and
# a cross-encoder in this process, on CPU, without torch. Imported only once a role names a
# `local` profile; models load from EXACTDOCS_MODELS_DIR, filled by `exactdocs models pull`.
local = [
    # 0.9.1 (2026-10-24, more than 14 days old when taken) allows Pillow 13, which fixes the
    # CRITICAL/HIGH CVEs of Pillow 12.3 that 0.9.0 (`pillow<13`) held the -local image to (#246).
    "fastembed==0.9.1",
    "onnxruntime==1.31.0",
]
# Qdrant as the vector backend (#355, EXACTDOCS_VECTOR_BACKEND=qdrant): imported only by
# `retrieval/adapters/driven/qdrant_index.py`, and only once an operator names the backend. Not in
# the image. Exact pin, tested against the `qdrant/qdrant` server of the same minor (CI service).
qdrant = ["qdrant-client==1.20.0"]
# External index backends (#354): imported only by their adapter module, and only when
# EXACTDOCS_SEARCH_BACKEND / EXACTDOCS_VECTOR_BACKEND names the backend. The 8.x client talks to
# Elasticsearch 8 and 9 (9 accepts its `compatible-with=8` requests; the 9.x client refuses 8)
# and goes through elastic-transport's httpx node; the OpenSearch adapter runs opensearch-py's
# synchronous (urllib3) client in worker threads. Neither extra adds aiohttp.
elasticsearch = ["elasticsearch==8.19.3"]
opensearch = ["opensearch-py==3.2.0"]
# LanceDB as the search and vector backend (#356, EXACTDOCS_SEARCH_BACKEND / EXACTDOCS_VECTOR_BACKEND
# = lancedb): embedded, a directory or an object-store URI, no server. Imported only by
# `retrieval/adapters/driven/lancedb_index.py`, and only once an operator names the backend. Not
# in any image (lancedb and pyarrow take about 350 MB installed, near the base image's whole
# budget): `pip install 'exactdocs[lancedb]'` or `uvx --from 'exactdocs[lancedb]' exactdocs`.
# Exact pin: 0.41.0 (2026-10-29) has manylinux_2_28 wheels for x86_64 and aarch64 (abi3; checked
# by tests/retrieval/test_lancedb_index.py), and the adapter relies on its FTS and RRF reranker.
lancedb = ["lancedb==0.41.0"]
# DuckDB as the search and vector backend (#357): EXACTDOCS_SEARCH_BACKEND / _VECTOR_BACKEND=duckdb.
# Imported only when a backend names it. The `fts` extension ships as a wheel (the signed binary
# DuckDB publishes, repackaged per DuckDB release) and is loaded from that file, never downloaded:
# DuckDB checks its signature at LOAD. Both pins move together: the extension's wheel requires the
# exact DuckDB release it was built for.
duckdb = ["duckdb==2.0.0", "duckdb-extension-fts==2.0.0"]
# Chroma as the vector backend (#361, EXACTDOCS_VECTOR_BACKEND=chroma): imported only by
# `retrieval/adapters/driven/chroma_index.py`, and only once an operator names the backend. Not in
# any image. `chroma` is the HTTP-only client (a Chroma server or Chroma Cloud: no onnxruntime, no
# tokenizers, no model download); `chroma-local` is the full package, for the embedded persistent
# client (`path = ...`), which also speaks HTTP. Both install the `chromadb` module, so they
# conflict ([tool.uv] conflicts in the workspace root). Exact pins, tested against the
# `chromadb/chroma` server of the same version (CI service). ExactDocs never uses Chroma's
# embedding functions: it passes its own vectors.
chroma = ["chromadb-client==1.5.9"]
chroma-local = ["chromadb==1.5.9"]
# Redis (Query Engine) as the search and vector backend (#364, EXACTDOCS_SEARCH_BACKEND /
# EXACTDOCS_VECTOR_BACKEND=redis): imported only by `retrieval/adapters/driven/redis_index.py`,
# and only once an operator names the backend. Not in the image. Exact pin, tested against the
# official `redis` 8 server image (CI service).
redis = ["redis==8.1.0"]
# Milvus as the vector backend (#360, EXACTDOCS_VECTOR_BACKEND=milvus): imported only by
# `retrieval/adapters/driven/milvus_index.py`, and only once an operator names the backend. Not in
# any image. `milvus` is the client alone (a Milvus server or Zilliz Cloud); `milvus-lite` adds
# Milvus Lite, the embedded engine on a local `.db` directory (pure Python with faiss-cpu: wheels
# for Linux x86_64 and ARM64, macOS). Exact pins (pymilvus 3.0.2 of 2026-09-18, milvus-lite 3.2.2
# of 2026-10-13, both more than 14 days old when taken), tested against the
# `milvusdb/milvus` standalone server in CI and Milvus Lite on a temporary directory.
milvus = ["pymilvus==3.0.2"]
milvus-lite = ["pymilvus==3.0.2", "milvus-lite==3.2.2"]
# MongoDB (Atlas Search and Atlas Vector Search, or MongoDB Community with `mongot`) as the search
# and vector backend (#363, EXACTDOCS_SEARCH_BACKEND / EXACTDOCS_VECTOR_BACKEND=mongodb): pymongo's
# own async API, imported only by `retrieval/adapters/driven/mongodb_index.py`, and only once an
# operator names the backend. Not in the image. Exact pin, tested against the
# `mongodb/mongodb-atlas-local` image (CI service).
mongodb = ["pymongo==4.20.0"]
# libSQL as the search and vector backend (#358, EXACTDOCS_SEARCH_BACKEND / EXACTDOCS_VECTOR_BACKEND
# = libsql): only a *local file* needs it (libSQL embedded in the process); a libSQL server is
# reached over its HTTP API with httpx2, so it works without this extra. Imported only by
# `retrieval/adapters/driven/libsql_index.py`. Not in the images. Exact pin: 0.1.11 (2025-09-02)
# is the latest release; for Python 3.14 it has a wheel for Linux x86_64 only (other platforms
# build it from source, which needs Rust).
libsql = ["libsql==0.1.11"]
# ExactDocs' own database on a libSQL server (#474, EXACTDOCS_DATABASE_URL=libsql://host): Turso's
# DB-API driver for SQL over HTTP, pure Python on the standard library (no dependency, so every
# platform), imported only by `bootstrap/libsql_database.py`, and only once the URL names libSQL.
# Not in the images. Exact pin: 0.1.0 (2026-07-27) is the first and latest release; tested against
# `ghcr.io/tursodatabase/libsql-server` (deploy/libsql-test-server.sh).
libsql-database = ["turso-serverless==0.1.0"]
# Pinecone as the vector index (#362, EXACTDOCS_VECTOR_BACKEND=pinecone): imported only when the
# operator names it. The 10.x SDK speaks HTTP (httpx, msgspec, orjson): no grpcio or protobuf.
pinecone = ["pinecone==10.3.0"]
# Azure AI Search as the search and vector backend (#353, EXACTDOCS_SEARCH_BACKEND /
# EXACTDOCS_VECTOR_BACKEND=azure_search): the SDK's async client, imported only by
# `retrieval/adapters/driven/azure_search_index.py`, and only once an operator names the backend.
# Not in the image. Requests go through azure-core's `AsyncioRequestsTransport` (requests, already
# an azure-core dependency), so no aiohttp; Entra ID through the sync `azure-identity`
# credentials (the same pin as the `ai` extra). Exact pins: 12.0.0 speaks the 2026-04-01 API.
azure-search = ["azure-search-documents==12.0.0", "azure-identity==1.27.0"]

[project.scripts]
exactdocs = "exactdocs.bootstrap.cli:main"

[project.urls]
Repository = "https://github.com/SirCypkowskyy/ExactDocs"
Issues = "https://github.com/SirCypkowskyy/ExactDocs/issues"

[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.11"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
# The kernel is released in lockstep with the app.
dependencies = [
    "exactdocs-kernel=={{ version }}",
    "aiosqlite>=0.21",
    "argon2-cffi>=25",
    # External sign-in (#105): PKCE and OIDC claim rules (Authlib), JWT and JWKS (joserfc,
    # Authlib's own JOSE library). Both came in through FastMCP already. joserfc 1.8.0 refuses
    # non-finite or boolean NumericDate claims and non-object payloads (#388).
    "authlib>=1.9.5",
    "croniter>=6",
    "cryptography>=46",
    "alembic>=1.16",
    "cyclopts>=4",
    "dbos>=3.3,<4",
    # reStructuredText (Sphinx) articles (#435): parsed, never built; no Sphinx, no network.
    # Exact pin: the converter maps its node classes and directive API.
    "docutils==0.23",
    "fastapi>=0.120",
    # MCP Apps (#115): view_article and view_search return Prefab UI. Exact pin: Prefab is pre-1.0
    # and its renderer and wire format change between minor versions (FastMCP says to pin it).
    "fastmcp[apps]>=4",
    "httpx2>=2",
    "joserfc>=1.8.0",
    "markdown-it-py>=4",
    "mcp>=2",
    # The OpenTelemetry SDK and OTLP/HTTP exporter for EXACTDOCS_TELEMETRY=otlp; imported only
    # when it is on.
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    # The Prometheus metric reader behind EXACTDOCS_METRICS (`/metrics`); imported only when it is
    # on. Its versions follow the SDK's (0.66bN with 1.45.N).
    "opentelemetry-exporter-prometheus>=0.66b1,<1",
    "opentelemetry-sdk>=1.45.1,<2",
    "platformdirs>=4",
    "prefab-ui==0.21.1",
    # PostgreSQL (EXACTDOCS_DATABASE_URL=postgresql://...): psycopg 3, async. DBOS needs it too,
    # so it adds nothing to the image.
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.38",
]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/exactdocs"]
# The web UI is built by `pnpm build` and copied here in CI/Docker; it is gitignored.
artifacts = ["src/exactdocs/_web/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/exactdocs/_web/**"]
