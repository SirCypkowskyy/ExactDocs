[project]
name = "exactdocs"
dynamic = ["version", "dependencies"]
description = "Self-hosted, version-accurate documentation for AI coding agents (MCP server)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Cyprian Gburek" }]
keywords = ["mcp", "documentation", "rag", "ai-agents", "fastmcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
# AI retrieval (docs/decisions/ai-retrieval.md): imported only once a model role is configured, so
# an install without it, or with it and nothing configured, stays a BM25 server (RUN-02). Exact
# pins: the harness 0.60.0 requires pydantic-ai-slim 2.60.0. The harness is taken without its
# `[codemode]` extra (that extra pulls a DuckDuckGo search client); Monty is listed directly.
# On a harness bump, re-check: the agentic loop detection (#99) relies on Code Mode sending the
# nested read calls through the parent's `root_capability` (`ToolManager.handle_call`), so our
# `wrap_tool_execute` sees them; `test_the_repeated_read_and_every_read_after_it_never_run` fails
# if it stops doing so.
ai = [
    "pydantic-ai-slim[openai,anthropic,google]==2.60.0",
    "pydantic-ai-harness==0.60.0",
    "pydantic-monty==1.6.0",
    "sqlite-vec==0.1.9",
    "pgvector==0.5.1",
    # Azure OpenAI and Claude on Azure AI Foundry with Entra ID (`auth = "entra"`): the sync token
    # provider only (`azure.identity.aio` would need aiohttp).
    "azure-identity==1.27.0",
]
# Local models (docs/decisions/ai-retrieval.md, *Local and offline models*): an embedding model and
# a cross-encoder in this process, on CPU, without torch. Imported only once a role names a
# `local` profile; models load from EXACTDOCS_MODELS_DIR, filled by `exactdocs models pull`.
local = [
    # 0.9.1 (2026-10-24, more than 14 days old when taken) allows Pillow 13, which fixes the
    # CRITICAL/HIGH CVEs of Pillow 12.3 that 0.9.0 (`pillow<13`) held the -local image to (#246).
    "fastembed==0.9.1",
    "onnxruntime==1.31.0",
]
# Azure AI Search as the search and vector backend (#353, EXACTDOCS_SEARCH_BACKEND /
# EXACTDOCS_VECTOR_BACKEND=azure_search): the SDK's async client, imported only by
# `retrieval/adapters/driven/azure_search_index.py`, and only once an operator names the backend.
# Not in the image. Requests go through azure-core's `AsyncioRequestsTransport` (requests, already
# an azure-core dependency), so no aiohttp; Entra ID through the sync `azure-identity`
# credentials (the same pin as the `ai` extra). Exact pins: 12.0.0 speaks the 2026-04-01 API.
azure-search = ["azure-search-documents==12.0.0", "azure-identity==1.27.0"]

[project.scripts]
exactdocs = "exactdocs.bootstrap.cli:main"

[project.urls]
Repository = "https://github.com/SirCypkowskyy/ExactDocs"
Issues = "https://github.com/SirCypkowskyy/ExactDocs/issues"

[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.11"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
# The kernel is released in lockstep with the app.
dependencies = [
    "exactdocs-kernel=={{ version }}",
    "aiosqlite>=0.21",
    "argon2-cffi>=25",
    # External sign-in (#105): PKCE and OIDC claim rules (Authlib), JWT and JWKS (joserfc,
    # Authlib's own JOSE library). Both came in through FastMCP already. joserfc 1.8.0 refuses
    # non-finite or boolean NumericDate claims and non-object payloads (#388).
    "authlib>=1.9.5",
    "croniter>=6",
    "cryptography>=46",
    "alembic>=1.16",
    "cyclopts>=4",
    "dbos>=3.3,<4",
    # reStructuredText (Sphinx) articles (#435): parsed, never built; no Sphinx, no network.
    # Exact pin: the converter maps its node classes and directive API.
    "docutils==0.23",
    "fastapi>=0.120",
    "fastmcp>=4",
    "httpx2>=2",
    "joserfc>=1.8.0",
    "markdown-it-py>=4",
    "mcp>=2",
    # The OpenTelemetry SDK and OTLP/HTTP exporter for EXACTDOCS_TELEMETRY=otlp; imported only
    # when it is on.
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    # The Prometheus metric reader behind EXACTDOCS_METRICS (`/metrics`); imported only when it is
    # on. Its versions follow the SDK's (0.66bN with 1.45.N).
    "opentelemetry-exporter-prometheus>=0.66b1,<1",
    "opentelemetry-sdk>=1.45.1,<2",
    "platformdirs>=4",
    # PostgreSQL (EXACTDOCS_DATABASE_URL=postgresql://...): psycopg 3, async. DBOS needs it too,
    # so it adds nothing to the image.
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.38",
]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/exactdocs"]
# The web UI is built by `pnpm build` and copied here in CI/Docker; it is gitignored.
artifacts = ["src/exactdocs/_web/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/exactdocs/_web/**"]
