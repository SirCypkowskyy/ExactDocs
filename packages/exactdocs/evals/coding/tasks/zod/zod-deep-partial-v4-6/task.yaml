prompt: |
  In `src/settings.ts`, export `SettingsPatch`: the shape of `Settings` with every field
  optional at every level of nesting (a patch may set only `editor.tabs.size`), still validating
  the type of every field it does set.
notes: |
  Zod 3 has the `.deepPartial()` method; Zod 4.0 removed it, and 4.5 brought the
  function `z.deepPartial(schema)` back.
