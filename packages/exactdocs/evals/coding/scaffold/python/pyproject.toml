[project]
name = "workspace"
version = "0"
requires-python = ">=3.12"
# The dependencies are pinned in requirements.txt (compiled with hashes from requirements.in)
# and already installed; nothing else can be installed.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Warnings, deprecation warnings included, are errors in this project.
filterwarnings = ["error"]
