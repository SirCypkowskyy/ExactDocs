# The retrieval eval dataset (Pydantic Evals format), read by retrieval_eval.dataset.
#
# Every case is a question pinned to one version of the fixture docs repository
# (packages/exactdocs/tests/fixtures/docs-repo) and the section that answers it:
#   kind: identifier  the fixture's expected-queries.yaml, one case per asserted version (a test
#                     keeps the two in step: change that file, then this one)
#   kind: question    a natural-language question, the way an agent asks
# expected_output.hits holds the expected section (version, article path, heading path from the
# H1); an empty list means the version has no answer, so any hit must still be of that version.
# See docs/evals/suite.md#the-dataset for how to add a case.
name: retrieval
cases:
- name: 'v1.3.0: snake_case'
  inputs: {query: snake_case, version: v1.3.0}
  metadata: {kind: identifier}
  expected_output:
    hits:
    - version: v1.3.0
      article: docs/reference/naming.md
      heading_path: [Naming conventions, snake_case]
- name: 'v1.4.0: snake_case'
