# The golden set's review (#490): the verdict on every case of a seeded, stratified sample.
#
# Drawn with `just golden-review sample` (three cases per kind and project) from the golden set as
# it was before any fix (`drawn_from`), and checked against the docs at each pinned commit by an
# independent agent with an adversarial brief: every fact stated by the expected sections, the
# reference right for that version, no other section of that version answering as well, the kind,
# unanswerable cases searched for in the whole docs tree, version-change cases against the
# neighbouring versions. `kind` is the stratum the case was drawn from (a fix may have changed it).
# `just golden-validate` checks this file; `just bench-pages` renders its summary on
# docs/benchmark/golden-set.md. Problem categories: docs/evals.md#reviewing-the-golden-set.
