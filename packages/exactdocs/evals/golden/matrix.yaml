# The retrieval grid (#494): `just retrieval-grid` runs every cell on the golden set.
# docs/evals/retrieval-grid.md explains each setting.
#
# An app cell (`app:`) is a retrieval-benchmark configuration that ExactDocs runs, scored by
# chunk ID. Every other cell is eval-only: the grid cuts, indexes and searches the pinned
# versions itself and scores the text it returns (#491). Nothing here changes what ExactDocs
# ships. Every cell is tested against the default of its budget, declared below: what ExactDocs
# ships today (docs/benchmark/defaults.md).

defaults:
  none: bm25@default
  local: bm25@default

cells:
  # ExactDocs itself, and the gaps of the #347 run. Its search groups the results by article
  # (#575); `group_by: chunk` is the search before it did, each app cell's control.
  - app: bm25
    against: bm25@default+by-chunk
  - app: hybrid:bge-small-en-v1.5
    against: hybrid:bge-small-en-v1.5@default+by-chunk
  - name: bm25@default+by-chunk
    app: bm25
    group_by: chunk
  - name: hybrid:bge-small-en-v1.5@default+by-chunk
    app: hybrid:bge-small-en-v1.5
    group_by: chunk
  - app: hybrid:bge-base-en-v1.5
  - app: bm25+ce
  - app: hybrid:bge-small-en-v1.5+ce
  - app: hybrid:hosted  # skipped without --allow-providers

  # Baselines: the floor
  - name: grep
    search: grep
  - name: rag:window-256+64/bge-small
    window: 256
    overlap: 64
    search: dense
    embedding: BAAI/bge-small-en-v1.5

  # The grid's own search at ExactDocs' chunking: how far it is from the app's
  - name: default/bm25
    search: bm25
  - name: default/hybrid:bge-small
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5

  # Fixed token windows with overlap, two sizes
  - name: window-256+64/bm25
    window: 256
    overlap: 64
    search: bm25
  - name: window-512+128/bm25
    window: 512
    overlap: 128
    search: bm25
  - name: window-256+64/hybrid:bge-small
    window: 256
    overlap: 64
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
  - name: window-512+128/hybrid:bge-small
    window: 512
    overlap: 128
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5

  # Title and heading path in front of the text: indexed, then embedded
  - name: default/bm25+context-indexed
    search: bm25
    prefix_indexed: true
    against: default/bm25
  - name: default/hybrid:bge-small+context-indexed
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    prefix_indexed: true
    against: default/hybrid:bge-small
  - name: default/hybrid:bge-small+context-embedded
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    prefix_embedded: true
    against: default/hybrid:bge-small
  - name: window-256+64/hybrid:bge-small+context-embedded
    window: 256
    overlap: 64
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    prefix_embedded: true

  # Small heading chunks widened to their parent section when read
  - name: h6/bm25+parent
    chunking: h6
    search: bm25
    expand: parent
    against: default/bm25
  - name: h6/hybrid:bge-small+parent
    chunking: h6
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    expand: parent
    against: default/hybrid:bge-small

  # A larger embedding model on the grid's own search
  - name: default/hybrid:bge-base
    search: hybrid
    embedding: BAAI/bge-base-en-v1.5

  # Rank 1 at no more context (#575): the answering section first, measured within a token
  # budget too. Each variant names its control (`against`) and is tested against it as well as
  # against the budget's default. ExactDocs' own hybrid index already embeds the title and
  # heading path (embedding input format 1): `+context-embedded` is the eval-only form of that.
  - name: default/bm25+parent
    search: bm25
    expand: parent
    against: default/bm25
  - name: default/bm25+article
    search: bm25
    expand: article
    against: default/bm25
  - name: default/bm25+article-hits  # the hits grouped by article, no neighbouring chunk
    search: bm25
    expand: article
    neighbours: 0
    against: default/bm25
  - name: default/bm25+context-indexed+article
    search: bm25
    prefix_indexed: true
    expand: article
    against: default/bm25+context-indexed
  - name: h6/bm25+article
    chunking: h6
    search: bm25
    expand: article
    against: default/bm25
  - name: default/hybrid:bge-small+context
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    prefix_indexed: true
    prefix_embedded: true
    against: default/hybrid:bge-small
  - name: default/hybrid:bge-small+parent
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    expand: parent
    against: default/hybrid:bge-small
  - name: default/hybrid:bge-small+article
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    expand: article
    against: default/hybrid:bge-small
  - name: default/hybrid:bge-small+article-hits
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    expand: article
    neighbours: 0
    against: default/hybrid:bge-small
  - name: default/hybrid:bge-small+context-embedded+article
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    prefix_embedded: true
    expand: article
    against: default/hybrid:bge-small+context-embedded
  - name: default/hybrid:bge-small+context-embedded+article-hits
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    prefix_embedded: true
    expand: article
    neighbours: 0
    against: default/hybrid:bge-small+context-embedded
  - name: h6/hybrid:bge-small+article
    chunking: h6
    search: hybrid
    embedding: BAAI/bge-small-en-v1.5
    expand: article
    against: default/hybrid:bge-small
