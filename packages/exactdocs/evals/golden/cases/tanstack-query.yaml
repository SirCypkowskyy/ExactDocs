# --- v5.0.0 ----------------------------------------------------------------------------------

- name: 'tanstack-query v5.0.0: How many times does a failing query retry by default, and is it different during SSR?'
  inputs:
    project: tanstack-query
    version: v5.0.0
    query: 'How many times does a failing query retry by default, and is it different during SSR?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v5.0.0, article: docs/react/reference/useQuery.md, heading_path: []}
    reference: >-
      `retry` defaults to `3` on the client and `0` on the server. `false` disables retries, `true`
      retries infinitely, and a function `(failureCount, error) => boolean` decides per failure.
    facts:
    - retry defaults to 3 on the client
    - retry defaults to 0 on the server

- name: 'tanstack-query v5.0.0: Which options can I not pass to useSuspenseQuery, and what is guaranteed about its data?'
  inputs:
    project: tanstack-query
    version: v5.0.0
    query: 'Which options can I not pass to useSuspenseQuery, and what is guaranteed about its data?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v5.0.0, article: docs/react/reference/useSuspenseQuery.md, heading_path: []}
    reference: >-
      useSuspenseQuery takes useQuery's options except `suspense`, `throwOnError`, `enabled` and
      `placeholderData`. Its `data` is guaranteed to be defined, `status` is always `success`, and
      `isPlaceholderData` is missing.
    facts:
    - suspense, throwOnError, enabled and placeholderData are not accepted
    - data is guaranteed to be defined
    - status is always success

- name: 'tanstack-query v5.0.0: Which useQueries option reduces all query results into a single value?'
  inputs:
    project: tanstack-query
    version: v5.0.0
    query: 'Which useQueries option reduces all query results into a single value?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v5.0.0, article: docs/react/reference/useQueries.md, heading_path: [Combine]}
    reference: >-
      The `combine: (results) => ...` option; its return value is what useQueries returns,
      structurally shared to stay as referentially stable as possible. Properties of the query
      results that it does not return are lost.
    facts:
    - the option is combine
    - it receives the array of query results
    - the combined result is structurally shared
    - other properties of the query results are lost

- name: 'tanstack-query v5.0.0: How do I start fetching data for a child that uses useSuspenseQuery without the parent suspending first?'
  inputs:
    project: tanstack-query
    version: v5.0.0
    query: 'How do I start fetching data for a child that uses useSuspenseQuery without the parent suspending first?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v5.0.0, article: docs/react/guides/prefetching.md, heading_path: [Prefetch in components]}
    reference: >-
      useSuspenseQueries would block rendering and useQuery would start too late, so add a small
      `usePrefetchQuery` function that calls `queryClient.ensureQueryData(...)` during render, above
      the Suspense boundary; the docs say the library might add it later. It never refetches stale
      data already in the cache.
    facts:
    - write a small usePrefetchQuery function yourself
    - it calls queryClient.ensureQueryData during render
    - useSuspenseQueries cannot be used because it would block rendering
    - it does not update existing stale data

- name: 'tanstack-query v5.0.0: How do I show a just-submitted todo greyed out in the list while the mutation runs, without touching the cache?'
  inputs:
    project: tanstack-query
    version: v5.0.0
    query: 'How do I show a just-submitted todo greyed out in the list while the mutation runs, without touching the cache?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v5.0.0, article: docs/react/guides/optimistic-updates.md, heading_path: [Via the UI]}
    reference: >-
      Render an extra list item from the mutation's `variables` while `isPending` is true, and return
      the `invalidateQueries` promise from `onSettled` so the mutation stays pending until the
      refetch finishes. `variables` are kept on error, so you can show a retry button.
    facts:
    - render the mutation variables while isPending is true
    - return the invalidateQueries promise from onSettled to stay pending until the refetch ends
    - variables are not cleared when the mutation errors

- name: 'tanstack-query v5.0.0: How do I extract query options into a function and still get typed getQueryData results?'
  inputs:
    project: tanstack-query
    version: v5.0.0
    query: 'How do I extract query options into a function and still get typed getQueryData results?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v5.0.0, article: docs/react/typescript.md, heading_path: [Typing Query Options]}
    reference: >-
      Wrap the options in the `queryOptions` helper and use the result in both `useQuery` and
      `prefetchQuery`. Its `queryKey` carries the queryFn's type, so
      `queryClient.getQueryData(groupOptions().queryKey)` is typed instead of `unknown`.
    facts:
    - wrap the options in queryOptions
    - extracted options without it lose type inference
    - getQueryData with the queryKey from queryOptions is typed

- name: 'tanstack-query v5.0.0: What is a request waterfall and why does it slow pages down?'
  inputs:
    project: tanstack-query
    version: v5.0.0
    query: 'What is a request waterfall and why does it slow pages down?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v5.0.0, article: docs/react/guides/request-waterfalls.md, heading_path: ['What is a Request Waterfall?']}
    reference: >-
      A request waterfall is when a request for a resource does not start until another request has
