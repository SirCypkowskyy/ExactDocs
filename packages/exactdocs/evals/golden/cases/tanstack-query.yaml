# Golden-set cases for TanStack Query (corpus.yaml: tanstack-query). Format and rules:
# docs/evals.md#the-golden-set. Check with `just golden-validate --projects tanstack-query`.
# Name the React page: the other frameworks' pages hold only code that replaces the React page's
# examples on the website (front matter `ref:`), not the prose.
name: tanstack-query
cases:
- name: 'tanstack-query v5.0.0: What happened to the cacheTime option?'
  inputs:
    project: tanstack-query
    version: v5.0.0
    query: 'What happened to the cacheTime option?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v5.0.0, article: docs/react/guides/migrating-to-v5.md, heading_path: [Breaking Changes, Rename cacheTime to gcTime]}
    reference: v5 renames `cacheTime` to `gcTime` ("garbage collect" time); it only applies once a
      query is unused, after which its data is garbage collected.
    facts:
    - cacheTime is renamed to gcTime
    - it only takes effect once a query is no longer used
    - after that time the unused data is garbage collected

- name: 'tanstack-query v4.36.1: What is the default cacheTime of useQuery?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'What is the default cacheTime of useQuery?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/reference/useQuery.md, heading_path: []}
    - {version: v4.36.1, article: docs/react/guides/important-defaults.md, heading_path: [], alternative: true}
    - {version: v4.36.1, article: docs/react/guides/caching.md, heading_path: [Basic Example], alternative: true}
    reference: '`cacheTime` defaults to 5 minutes (`5 * 60 * 1000`), or `Infinity` during SSR; it is
      how long unused or inactive cache data stays in memory.'
    facts:
    - cacheTime defaults to 5 minutes (5 * 60 * 1000 ms)
    - it is Infinity during SSR
    - Infinity disables garbage collection

- name: 'tanstack-query v5.90.3: How do I refresh the todos list after a mutation succeeds?'
  inputs:
    project: tanstack-query
    version: v5.90.3
    query: 'How do I refresh the todos list after a mutation succeeds?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v5.90.3, article: docs/framework/react/guides/invalidations-from-mutations.md, heading_path: []}
    reference: >-
      In `useMutation`'s `onSuccess`, call `queryClient.invalidateQueries({ queryKey: ['todos'] })`;
      returning its promise keeps the mutation pending until the data is updated.
    facts:
    - invalidate in the onSuccess option of useMutation
    - call queryClient.invalidateQueries with the todos query key
    - returning the promise from onSuccess keeps the mutation pending until it resolves

- name: 'tanstack-query v5.90.3: Why does my query refetch every time the window gets focus?'
  inputs:
    project: tanstack-query
    version: v5.90.3
    query: 'Why does my query refetch every time the window gets focus?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v5.90.3, article: docs/framework/react/guides/important-defaults.md, heading_path: []}
    - {version: v5.90.3, article: docs/framework/react/guides/window-focus-refetching.md, heading_path: [], alternative: true}
    - {version: v5.90.3, article: docs/framework/react/reference/useQuery.md, heading_path: [], alternative: true}
    reference: Cached data is stale by default, and stale queries refetch in the background when the
      window is refocused; set `staleTime` (or `refetchOnWindowFocus`) to change it.
    facts:
    - cached data is considered stale by default
    - stale queries are refetched when the window is refocused
    - a longer staleTime avoids the refetches

- name: 'tanstack-query v4.36.1: How do I limit how many pages an infinite query keeps with maxPages?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'How do I limit how many pages an infinite query keeps with maxPages?'
  metadata: {kind: unanswerable}
  expected_output:
    hits: []
    reference: The TanStack Query v4 documentation has no maxPages option.

# --- v4.36.1 ---------------------------------------------------------------------------------

- name: 'tanstack-query v4.36.1: What values does refetchOnMount take, and what does always do?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'What values does refetchOnMount take, and what does always do?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/reference/useQuery.md, heading_path: []}
    reference: >-
      `refetchOnMount` takes `true` (default: refetch on mount if the data is stale), `false` (never
      refetch on mount), `"always"` (always refetch on mount) or a function of the query that
      returns one of these.
    facts:
    - refetchOnMount defaults to true, which refetches on mount only if the data is stale
    - false means the query does not refetch on mount
    - '"always" refetches on every mount'
    - it can be a function that receives the query

- name: 'tanstack-query v4.36.1: Is there a QueryClient method that returns cached data if present and only fetches when the query is missing?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'Is there a QueryClient method that returns cached data if present and only fetches when the query is missing?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/reference/QueryClient.md, heading_path: [queryClient.ensureQueryData]}
    reference: >-
      `await queryClient.ensureQueryData({ queryKey, queryFn })` returns an existing query's cached
      data; if the query does not exist it calls `queryClient.fetchQuery` and returns its result. It
      takes fetchQuery's options, with `queryKey` required.
    facts:
    - the method is queryClient.ensureQueryData
    - it returns the cached data when the query exists
    - it calls fetchQuery when the query does not exist
    - queryKey is required

- name: 'tanstack-query v4.36.1: How can I register a default queryFn for every query under the posts key?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'How can I register a default queryFn for every query under the posts key?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/reference/QueryClient.md, heading_path: [queryClient.setQueryDefaults]}
    reference: >-
      `queryClient.setQueryDefaults(['posts'], { queryFn: fetchPosts })`; then `useQuery({ queryKey:
      ['posts'] })` uses it. In v4 `getQueryDefaults` returns the first matching registration, so
      register from the least generic key to the most generic one.
    facts:
    - queryClient.setQueryDefaults takes a query key and options
    - queries matching that key use the registered defaults
    - the first matching defaults are returned
    - register from the least generic key to the most generic one

- name: 'tanstack-query v4.36.1: In a paginated table, how do I keep the current page on screen while the next page loads?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'In a paginated table, how do I keep the current page on screen while the next page loads instead of flashing a loading state?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/guides/paginated-queries.md, heading_path: [Better Paginated Queries with keepPreviousData]}
    - {version: v4.36.1, article: docs/react/reference/useQuery.md, heading_path: [], alternative: true}
    reference: >-
      Put the page in the query key and set `keepPreviousData: true`: the data of the last
      successful fetch stays available while the new page is requested, is swapped when it
      arrives, and `isPreviousData` tells you the old page is still shown (e.g. to disable "Next").
    facts:
    - set keepPreviousData to true on useQuery
    - the last successful data stays available while the new key is fetched
    - isPreviousData tells whether the shown data is the previous data

- name: 'tanstack-query v4.36.1: How do I prefetch queries in getStaticProps or getServerSideProps and hand them to the client in Next.js?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'How do I prefetch queries in getStaticProps or getServerSideProps and hand them to the client in Next.js?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/guides/ssr.md, heading_path: [Using Next.js, Using Hydration]}
    reference: >-
      In `_app`, create the QueryClient once (in React state), wrap the app in `QueryClientProvider`
      and `<Hydrate state={pageProps.dehydratedState}>`. In the page's getStaticProps or
      getServerSideProps, create a new QueryClient per request, `await prefetchQuery(...)` and return
      `dehydratedState: dehydrate(queryClient)` in props.
    facts:
    - wrap the app in Hydrate with pageProps.dehydratedState
    - create a new QueryClient for each page request on the server
    - prefetch with prefetchQuery and pass dehydrate(queryClient) as the dehydratedState prop

- name: 'tanstack-query v4.36.1: How do I abort the underlying fetch call when a query is no longer needed?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'How do I abort the underlying fetch call when a query is no longer needed?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/guides/query-cancellation.md, heading_path: [Using fetch]}
    - {version: v4.36.1, article: docs/react/guides/query-cancellation.md, heading_path: []}
    reference: >-
      Every query function receives an `AbortSignal` as `signal` in its context; pass it to `fetch`
      (one or several calls). The signal is aborted when the query becomes out-of-date or inactive,
      which cancels the request.
    facts:
    - the query function receives an AbortSignal as signal
    - pass the signal to fetch
    - the signal is aborted when the query becomes out-of-date or inactive

- name: 'tanstack-query v4.36.1: My disabled query reports status loading but nothing is being fetched, how can both be true?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'My disabled query reports status loading but nothing is being fetched, how can both be true?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/guides/queries.md, heading_path: [Query Basics, 'Why two different states?']}
    - {version: v4.36.1, article: docs/react/guides/queries.md, heading_path: [Query Basics, FetchStatus]}
    reference: >-
      `status` tells whether there is data, `fetchStatus` whether the queryFn is running
      (`fetching`, `paused` or `idle`). They are independent, so a query without data is `loading`
      even while its fetchStatus is `idle`.
    facts:
    - status gives information about the data
    - fetchStatus gives information about whether the queryFn is running
    - a query can be in loading state without fetching

- name: 'tanstack-query v4.36.1: What does networkMode offlineFirst actually do compared to online?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'What does networkMode offlineFirst actually do compared to online?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/guides/network-mode.md, heading_path: ['Network Mode: offlineFirst']}
    reference: >-
      `offlineFirst` runs the queryFn once and then pauses retries. It suits a service worker or HTTP
      caching (Cache-Control) where the first fetch can come from a cache; on a cache miss the
      request fails and the query behaves like `online`, pausing retries.
    facts:
    - offlineFirst runs the queryFn once
    - retries are then paused
    - it suits service-worker or HTTP caching

- name: 'tanstack-query v4.36.1: What happens to cached todos after every component using that query unmounts?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'What happens to cached todos after every component using that query unmounts?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/guides/caching.md, heading_path: [Basic Example]}
    - {version: v4.36.1, article: docs/react/guides/important-defaults.md, heading_path: [], alternative: true}
    reference: >-
      With no active instances a cache timeout of `cacheTime` (5 minutes by default) starts. If the
      query mounts again before it ends, the cached data is returned at once while it refetches in
      the background; otherwise the data is deleted and garbage collected.
    facts:
    - a cache timeout of cacheTime starts once no instance uses the query
    - cacheTime defaults to 5 minutes
    - a new instance before the timeout gets the cached data immediately and refetches in the background
    - after the timeout the data is garbage collected

- name: 'tanstack-query v4.36.1: After upgrading, useQuery with a plain string key breaks, what changed about keys?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: "After upgrading, useQuery('todos', fetchTodos) breaks, what changed about keys?"
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/guides/migrating-to-react-query-4.md, heading_path: [Breaking Changes, Query Keys (and Mutation Keys) need to be an Array]}
    reference: >-
      Since v4, query and mutation keys must be arrays (v3 also accepted strings), so write
      `useQuery(['todos'], fetchTodos)`.
    facts:
    - in v4 query and mutation keys must be arrays
    - v3 also allowed string keys

- name: 'tanstack-query v4.36.1: What replaced the idle status for disabled queries in v4?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'What replaced the idle status for disabled queries in v4?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/guides/migrating-to-react-query-4.md, heading_path: [Breaking Changes, The idle state has been removed]}
    - {version: v4.36.1, article: docs/react/guides/migrating-to-react-query-4.md, heading_path: [Breaking Changes, The idle state has been removed, disabled queries]}
    reference: >-
      v4 removes the `idle` status: a disabled query without data is now `status: 'loading'` with
      `fetchStatus: 'idle'`. For a spinner, check `isInitialLoading` instead of `isLoading`.
    facts:
    - the idle status was removed in v4
    - disabled queries without data are in loading status with fetchStatus idle
    - use isInitialLoading instead of isLoading to show a spinner

- name: 'tanstack-query v4.36.1: Which npm package do I install for React Query v4, and where are the devtools now?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'Which npm package do I install for React Query v4, and where are the devtools now?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/guides/migrating-to-react-query-4.md, heading_path: [Breaking Changes, react-query is now @tanstack/react-query]}
    reference: >-
      v4 renames `react-query` to `@tanstack/react-query`; the devtools are a separate package,
      `@tanstack/react-query-devtools`. A codemod updates the imports, but installing the devtools
      package is manual.
    facts:
    - the package is now @tanstack/react-query
    - the devtools are the separate package @tanstack/react-query-devtools
    - the codemod only changes imports

- name: 'tanstack-query v4.36.1: How do I save the query cache to localStorage so it survives a reload, and what cacheTime does that need?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'How do I save the query cache to localStorage so it survives a reload, and what cacheTime does that need?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/plugins/createSyncStoragePersister.md, heading_path: [Usage]}
    - {version: v4.36.1, article: docs/react/plugins/persistQueryClient.md, heading_path: [How It Works]}
    reference: >-
      Create `createSyncStoragePersister({ storage: window.localStorage })` and pass it to
      `persistQueryClient` (or `PersistQueryClientProvider`). Give the QueryClient a `cacheTime` at
      least as long as `maxAge` (24 hours by default); otherwise the default 5 minutes discards the
      restored cache early.
    facts:
    - createSyncStoragePersister with window.localStorage creates the persister
    - the persister is passed to persistQueryClient
    - cacheTime should be the same as or higher than maxAge, which defaults to 24 hours
    - without it cacheTime defaults to 5 minutes and the stored cache is discarded

- name: 'tanstack-query v4.36.1: Without suspense, how do I send query errors to an error boundary and let the user retry?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'Without suspense, how do I send query errors to an error boundary and let the user retry?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/reference/useQuery.md, heading_path: []}
    - {version: v4.36.1, article: docs/react/reference/QueryErrorResetBoundary.md, heading_path: []}
    - {version: v4.36.1, article: docs/react/guides/suspense.md, heading_path: [Resetting Error Boundaries]}
    reference: >-
      Set `useErrorBoundary: true` (or a function of error and query) on the query so errors are
      thrown in render to the nearest error boundary. To retry, wrap the boundary in
      `QueryErrorResetBoundary` (or use `useQueryErrorResetBoundary`) and pass its `reset` to the
      boundary's `onReset`.
    facts:
    - useErrorBoundary true throws errors to the nearest error boundary
    - QueryErrorResetBoundary or useQueryErrorResetBoundary resets query errors
    - pass reset to the error boundary's onReset

- name: 'tanstack-query v4.36.1: How do I refetch only the first page of an infinite query from a QueryClient call?'
  inputs:
    project: tanstack-query
    version: v4.36.1
    query: 'How do I refetch only the first page of an infinite query from a QueryClient call?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: v4.36.1, article: docs/react/guides/infinite-queries.md, heading_path: ['What happens when an infinite query needs to be refetched?', refetchPage]}
    - {version: v4.36.1, article: docs/react/reference/QueryClient.md, heading_path: [queryClient.refetchQueries]}
    reference: >-
      Pass `refetchPage: (page, index, allPages) => index === 0` in the filters of
      `queryClient.refetchQueries` (also invalidateQueries and resetQueries) or to the `refetch` of
      useInfiniteQuery; only pages for which it returns true are refetched. It only applies to
      infinite queries.
    facts:
    - use the refetchPage function
    - only pages for which it returns true are refetched
    - refetchPage can be passed in the filters of queryClient.refetchQueries
    - it only applies to infinite queries

