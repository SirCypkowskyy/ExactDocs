    version: v30.0.0
    query: 'How do I call a main-process function from the renderer and await its result without exposing ipcRenderer?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/tutorial/ipc.md, heading_path: [Inter-Process Communication, 'Pattern 2: Renderer to main (two-way)', 1. Listen for events with ipcMain.handle]}
    - {version: v30.0.0, article: docs/tutorial/ipc.md, heading_path: [Inter-Process Communication, 'Pattern 2: Renderer to main (two-way)', 2. Expose ipcRenderer.invoke via preload]}
    - {version: v30.0.0, article: docs/api/context-bridge.md, heading_path: [contextBridge, Methods, 'contextBridge.exposeInMainWorld(apiKey, api)']}
    reference: >-
      Handle the channel in main with `ipcMain.handle`, whose return value goes back as a Promise. In
