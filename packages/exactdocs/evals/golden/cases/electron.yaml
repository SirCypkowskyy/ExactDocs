- name: 'electron v30.0.0: Did BrowserView.setAutoResize change behavior on macOS in Electron 30?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'Did BrowserView.setAutoResize change behavior on macOS in Electron 30?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/breaking-changes.md, heading_path: [Breaking Changes, Planned Breaking API Changes (30.0), 'Behavior Changed: BrowserView.setAutoResize behavior on macOS']}
    reference: >-
      Yes. BrowserView became a wrapper around WebContentsView, and autoresizing, previously macOS
      autoresizing versus a custom algorithm on Windows and Linux, is now the same on all platforms,
      so macOS-specific workarounds are no longer needed.
    facts:
