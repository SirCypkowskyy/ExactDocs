    - {version: v30.0.0, article: docs/api/browser-view.md, heading_path: [BrowserView]}
    - {version: v30.0.0, article: docs/api/web-contents-view.md, heading_path: [WebContentsView]}
    - {version: v30.0.0, article: docs/api/web-contents-view.md, heading_path: [WebContentsView, 'Class: WebContentsView extends View', 'new WebContentsView([options])']}
    reference: >-
      BrowserView is replaced by WebContentsView. Create one with `new WebContentsView()`
      (optionally with `webPreferences`), add it to a BaseWindow with
