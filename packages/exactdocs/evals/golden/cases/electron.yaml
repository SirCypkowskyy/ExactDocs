    reference: >-
      Add the CSS style `app-region: drag` to the custom title bar element so Electron knows which
      region drags the window.
    facts:
    - the app must tell Electron which regions are draggable
    - add the CSS app-region drag style to the custom title bar

- name: 'electron v45.3.2: How do I keep native .node files outside app.asar when packing?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'How do I keep native .node files outside app.asar when packing?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/tutorial/asar-archives.md, heading_path: [Adding Unpacked Files to ASAR archives]}
    reference: >-
      Pack with the `--unpack` option, for example `asar pack app app.asar --unpack *.node`,
      which puts those files in an `app.asar.unpacked` folder that must be shipped next to
      `app.asar`.
    facts:
    - use the --unpack option of asar pack
    - for example asar pack app app.asar --unpack *.node
    - the unpacked files go into an app.asar.unpacked folder shipped together with app.asar

- name: 'electron v30.0.0: How do I turn off the sandbox for just one window?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'How do I turn off the sandbox for just one window?'
  metadata: {kind: how-to}
  expected_output:
