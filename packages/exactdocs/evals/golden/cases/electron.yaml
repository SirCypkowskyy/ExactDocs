    - {version: v30.0.0, article: docs/tutorial/sandbox.md, heading_path: [Process Sandboxing, Configuring the sandbox, Disabling the sandbox for a single process]}
    - {version: v30.0.0, article: docs/breaking-changes.md, heading_path: [Breaking Changes, 'Planned Breaking API Changes (20.0)', 'Default Changed: renderers without nodeIntegration: true are sandboxed by default'], alternative: true}
    reference: >-
      Set `sandbox: false` in that BrowserWindow's `webPreferences`; enabling
      `nodeIntegration: true` also disables the sandbox for that renderer.
    facts:
    - set sandbox false in the window's webPreferences
    - enabling nodeIntegration also disables sandboxing for that renderer

- name: 'electron v30.0.0: Why does Electron split an app into several processes instead of one?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'Why does Electron split an app into several processes instead of one?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/tutorial/process-model.md, heading_path: [Process Model, 'Why not a single process?']}
    - {version: v30.0.0, article: docs/tutorial/process-model.md, heading_path: [Process Model, The multi-process model]}
    reference: >-
      It follows Chrome's design: in a single process one crashing or hanging page takes down the
      whole browser, so each page renders in its own process under one controlling process. In
      Electron that is the main process, with renderer processes for the web content.
    facts:
    - in a single-process design one crashing or hanging site affects the whole application
    - Chrome renders each tab in its own process to limit the harm of buggy or malicious pages
    - Electron apps have a main process and renderer processes, like Chrome's browser and renderer processes

- name: 'electron v30.0.0: Should I use child_process.fork or a utility process for CPU-heavy work, and why?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'Should I use child_process.fork or a utility process for CPU-heavy work, and why?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/tutorial/process-model.md, heading_path: [Process Model, The utility process]}
    reference: >-
      Prefer the UtilityProcess API. A utility process runs in a Node.js environment like a forked
      child, but unlike one it can open a channel to a renderer through MessagePorts; it suits
      untrusted services, CPU-intensive tasks and crash-prone components.
    facts:
    - a utility process is spawned from the main process and runs with full Node.js APIs
    - unlike child_process.fork it can talk to a renderer through MessagePorts
    - Electron apps can always prefer UtilityProcess over child_process.fork

- name: 'electron v30.0.0: My preload uses import statements and breaks once the window is sandboxed. Why?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'My preload uses import statements and breaks once the window is sandboxed. Why?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/tutorial/esm.md, heading_path: [ES Modules (ESM) in Electron, Preload scripts, Caveats, "Sandboxed preload scripts can't use ESM imports"]}
    - {version: v30.0.0, article: docs/tutorial/esm.md, heading_path: [ES Modules (ESM) in Electron, 'Summary: ESM support matrix']}
    reference: >-
      Sandboxed preload scripts run as plain JavaScript without an ESM context, so ESM imports are
      unsupported there; bundle the preload code instead and load Electron with `require('electron')`.
    facts:
    - sandboxed preload scripts run as plain JavaScript without an ESM context
    - use a bundler for external modules in a sandboxed preload
    - the electron API is still loaded with require('electron')

- name: 'electron v38.0.0: What exactly are Electron fuses and why can''t they be flipped back at runtime?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'What exactly are Electron fuses and why can''t they be flipped back at runtime?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/tutorial/fuses.md, heading_path: [Electron Fuses, 'What are fuses?']}
    reference: >-
      Fuses are "magic bits" in the Electron binary, flipped when packaging the app, that enable or
      disable features for the whole app without building Electron from source. They are flipped
      before code signing, so the OS's signature validation (Gatekeeper, App Locker) keeps them from
      being flipped back.
    facts:
    - fuses are bits in the Electron binary that turn features or restrictions on or off
    - they are flipped at package time
    - they are flipped before code signing, so OS code signing validation stops them being changed back

- name: 'electron v38.0.0: Why does child_process.spawn fail on a binary that lives inside app.asar?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'Why does child_process.spawn fail on a binary that lives inside app.asar?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/tutorial/asar-archives.md, heading_path: [Limitations of the Node API, Executing Binaries Inside ASAR archive]}
    reference: >-
      Only `child_process.execFile` can run binaries inside an ASAR archive. `exec` and `spawn`
      take a command run under a shell, and Electron cannot reliably tell whether a command uses a
      file in the archive or safely rewrite its path.
    facts:
    - only execFile is supported for executing binaries inside an ASAR archive
    - exec and spawn take a command that is executed under a shell
    - there is no reliable way to detect or rewrite archive paths inside a command

- name: 'electron v45.3.2: What is the difference between GPU accelerated and software offscreen rendering?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'What is the difference between GPU accelerated and software offscreen rendering?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/tutorial/offscreen-rendering.md, heading_path: [Offscreen Rendering, Overview, Rendering Modes, GPU accelerated]}
    - {version: v45.3.2, article: docs/tutorial/offscreen-rendering.md, heading_path: [Offscreen Rendering, Overview, Rendering Modes, Software output device]}
    reference: >-
      GPU accelerated mode composites on the GPU and supports WebGL and 3D CSS animations; with
      `offscreen.useSharedTexture: true` frames go to GPU shared textures, otherwise (the default)
      they are copied into a CPU bitmap. The software output device renders on the CPU, is faster
      than the shared-memory bitmap mode, and needs `app.disableHardwareAcceleration()`.
    facts:
    - GPU accelerated mode supports WebGL and 3D CSS animations
    - useSharedTexture true copies frames into GPU shared textures; false (the default) uses a CPU shared memory bitmap
    - the software output device renders on the CPU and is faster than the shared memory bitmap mode
    - software mode is enabled by calling app.disableHardwareAcceleration()

- name: 'electron v45.3.2: Should I embed a third-party site with an iframe, a webview tag or a WebContentsView?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'Should I embed a third-party site with an iframe, a webview tag or a WebContentsView?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/tutorial/web-embeds.md, heading_path: [Web Embeds, Overview]}
    - {version: v45.3.2, article: docs/tutorial/web-embeds.md, heading_path: [Web Embeds, Overview, WebViews]}
    - {version: v45.3.2, article: docs/tutorial/web-embeds.md, heading_path: [Web Embeds, Overview, WebContentsView]}
    reference: >-
      Iframes behave as in browsers (limit them with the `sandbox` attribute). WebViews are not
      recommended: they are out-of-process, IPC-driven, need `webviewTag: true` and may change or go
      away. WebContentsView gives the most control but lives outside the DOM, positioned by the main
      process, so aligning it with page content needs main/renderer coordination.
    facts:
    - iframes behave like in regular browsers and can be limited with the sandbox attribute
    - webview tags are not recommended and need webviewTag set to true
    - WebContentsView is created and positioned by the main process, outside the DOM
    - WebContentsView offers the greatest control over its contents

- name: 'electron v38.0.0: If I stay on an older Electron major, how long will it keep getting fixes?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'If I stay on an older Electron major, how long will it keep getting fixes?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/tutorial/electron-timelines.md, heading_path: [Electron Releases, Version support policy]}
    - {version: v38.0.0, article: docs/tutorial/electron-timelines.md, heading_path: [Electron Releases, Timeline], alternative: true}
    reference: >-
      Only the latest three stable majors are supported, and only the latest minor of each. The
      newest stable gets all fixes from main, the one before most of them, and the oldest supported
      line only security fixes; after that the line is end-of-life.
    facts:
    - the latest three stable major versions are supported
    - only the latest minor release of each supported series gets fixes
    - the oldest supported release line receives only security fixes

- name: 'electron v45.3.2: How does a renderer''s LanguageModel.prompt() call end up in my own local model?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'How does a renderer''s LanguageModel.prompt() call end up in my own local model?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/tutorial/local-ai-handler.md, heading_path: [Local AI Handler, How it works]}
    reference: >-
      Three processes take part: the main process registers a UtilityProcess as the session's
      handler with `ses.registerLocalAIHandler()`, the utility process supplies a
      `LanguageModelUtility` subclass through `localAIHandler.setPromptAPIHandler()`, and the
      renderer uses the Prompt API. Electron proxies the call through the main process to the
      utility process, which sends the result back to the renderer.
    facts:
    - the main process registers a utility process with ses.registerLocalAIHandler()
    - the utility process calls localAIHandler.setPromptAPIHandler() to supply a LanguageModelUtility subclass
    - requests are proxied through the main process to the utility process, which answers the renderer directly

- name: 'electron v45.3.2: Can my sandboxed preload still use Buffer and require(''events'')?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'Can my sandboxed preload still use Buffer and require(''events'')?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/breaking-changes.md, heading_path: [Breaking Changes, Breaking API Changes (45.0), 'Removed: Node.js module shims and Buffer, setImmediate, clearImmediate globals in sandboxed preload scripts']}
    - {version: v45.3.2, article: docs/tutorial/sandbox.md, heading_path: [Process Sandboxing, Sandbox behavior in Electron, Preload scripts]}
    reference: >-
      No. Since Electron 45 sandboxed preloads lost the events, timers and url shims and the Buffer,
      setImmediate and clearImmediate globals; require loads only electron (and electron/renderer,
      electron/common). Use EventTarget, URL, setTimeout/queueMicrotask, Uint8Array/TextEncoder or
      bundle a polyfill. Preloads with `sandbox: false` are unaffected.
    facts:
    - require in a sandboxed preload now only loads electron
    - Buffer, setImmediate and clearImmediate are no longer in scope
    - Web APIs such as EventTarget, URL and Uint8Array or a bundled polyfill replace them
    - preloads for renderers with sandbox false keep the full Node.js environment

- name: 'electron v45.3.2: clipboard is undefined in my renderer after upgrading. What should I use instead?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'clipboard is undefined in my renderer after upgrading. What should I use instead?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/breaking-changes.md, heading_path: [Breaking Changes, Breaking API Changes (44.0), 'Removed: clipboard module is no longer available in the renderer process']}
    reference: >-
      Electron 44 removed the `clipboard` module from renderer processes (deprecated in 40). Use the
      web `navigator.clipboard` API, or expose specific helpers from a preload script with
      `contextBridge` without handing the clipboard API to untrusted content.
    facts:
    - the clipboard module is no longer exposed to renderer processes since Electron 44
    - renderers should use navigator.clipboard
    - advanced needs can be met by exposing helpers from a preload with contextBridge

- name: 'electron v45.3.2: What replaced clipboard.writeHTML and readImage?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'What replaced clipboard.writeHTML and readImage?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/breaking-changes.md, heading_path: [Breaking Changes, Breaking API Changes (44.0), 'API Changed: clipboard module rearchitected to align with the W3C Clipboard API']}
    reference: >-
      Electron 44 removed the narrow helpers. Write HTML with `clipboard.write()` and a
      `ClipboardItem` keyed by `text/html`; read images with `clipboard.read()` and the `image/*`
      MIME type. `read()` resolves to `ClipboardItem[]` and `write()` returns `Promise<void>`.
    facts:
    - writeHTML, readImage and the other narrow helpers were removed in Electron 44
    - clipboard.write() with the text/html MIME type replaces writeHTML
    - clipboard.read() with an image MIME type replaces readImage
    - read and write now return Promises, matching navigator.clipboard

- name: 'electron v45.3.2: Our CI installs with npm --ignore-scripts. Does the Electron binary still get downloaded?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'Our CI installs with npm --ignore-scripts. Does the Electron binary still get downloaded?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/breaking-changes.md, heading_path: [Breaking Changes, Breaking API Changes (42.0), 'Behavior Changed: electron no longer downloads itself via postinstall script']}
    reference: >-
      Since Electron 42 the npm package has no postinstall download: the binary is fetched the first
      time its bin script runs (e.g. `npx electron`), so `--ignore-scripts` works. Run
      `npx install-electron` to download ahead of time; `ELECTRON_SKIP_BINARY_DOWNLOAD` is no longer
      supported.
    facts:
    - the electron package no longer downloads the binary in a postinstall script
    - the binary is downloaded the first time the electron bin script runs
    - npx install-electron downloads it on demand
    - ELECTRON_SKIP_BINARY_DOWNLOAD is no longer supported

- name: 'electron v45.3.2: My open dialog stopped remembering the last folder the user picked. Why?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'My open dialog stopped remembering the last folder the user picked. Why?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/breaking-changes.md, heading_path: [Breaking Changes, Breaking API Changes (43.0), 'Behavior Changed: Dialog methods default to Downloads directory']}
    reference: >-
      Since Electron 43, `showOpenDialog`, `showSaveDialog` and their sync variants default
      `defaultPath` to the user's Downloads folder (or home if it is missing), so the OS no longer
      restores the last-used directory. Track the last directory yourself and pass it as
      `defaultPath`.
    facts:
    - since Electron 43 dialogs without defaultPath open in the Downloads folder
    - the home directory is used when Downloads does not exist
    - the OS no longer tracks and restores the last-used directory
    - track the last-used directory yourself and pass it as defaultPath

- name: 'electron v38.0.0: Are webContents.goBack and canGoBack still the way to navigate history?'
