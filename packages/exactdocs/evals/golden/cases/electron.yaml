- name: 'electron v38.0.0: An unhandled promise rejection no longer kills my utility process. Is that intended?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'An unhandled promise rejection no longer kills my utility process. Is that intended?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/breaking-changes.md, heading_path: [Breaking Changes, Planned Breaking API Changes (37.0), Utility Process unhandled rejection behavior change]}
    reference: >-
      Yes. Since Electron 37 utility processes log an error on an unhandled rejection instead of
      crashing; add `process.on('unhandledRejection', () => process.exit(1))` to restore the old
      behavior.
    facts:
    - since Electron 37 an unhandled rejection only warns with an error message
    - previously the utility process crashed
    - an unhandledRejection handler that calls process.exit(1) restores the old behavior

