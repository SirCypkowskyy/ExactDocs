# Golden-set cases for Electron (corpus.yaml: electron). Format and rules: docs/evals.md#the-golden-set.
# Check with `just golden-validate --projects electron`.
name: electron
cases:
- name: 'electron v45.3.2: How do I send a one-way message from a renderer to the main process?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'How do I send a one-way message from a renderer to the main process?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/tutorial/ipc.md, heading_path: [Inter-Process Communication, 'Pattern 1: Renderer to main (one-way)']}
    reference: Expose `ipcRenderer.send` to the renderer through a preload script and listen for the
      channel in the main process with `ipcMain.on`.
    facts:
    - the renderer sends with ipcRenderer.send
    - the main process listens with ipcMain.on on the same channel
    - ipcRenderer.send is exposed to the renderer through a preload script

- name: 'electron v38.0.0: Which macOS versions does Electron 38 run on?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'Which macOS versions does Electron 38 run on?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/breaking-changes.md, heading_path: [Breaking Changes, Planned Breaking API Changes (38.0), 'Removed: macOS 11 support']}
    reference: Electron 38 drops macOS 11 (Big Sur); it needs macOS 12 (Monterey) or later.
    facts:
    - macOS 11 Big Sur is no longer supported
    - macOS 12 Monterey or later is required from v38.0.0

- name: 'electron v38.0.0: Which names can I pass to app.getPath?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'Which names can I pass to app.getPath?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/api/app.md, heading_path: [app, Methods, app.getPath(name)]}
    reference: Names include home, appData, userData, sessionData, temp, exe, desktop, documents,
      downloads, logs and crashDumps among others; it returns the path as a string and throws on
      failure.
    facts:
    - userData is the appData directory appended with the app's name
    - sessionData points to userData by default
    - it returns a string and throws an Error on failure

- name: 'electron v30.0.0: What is context isolation and is it enabled by default?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'What is context isolation and is it enabled by default?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/tutorial/context-isolation.md, heading_path: [Context Isolation, 'What is it?']}
    reference: Context isolation runs preload scripts and Electron's internals in a separate context
      from the loaded website, so the page cannot reach them; it has been on by default since
      Electron 12.
    facts:
    - preload scripts and Electron internals run in a context separate from the website
    - the website cannot access the preload's window object
    - it has been enabled by default since Electron 12

- name: 'electron v30.0.0: How do I show an image in a BaseWindow with ImageView?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'How do I show an image in a BaseWindow with ImageView?'
  metadata: {kind: unanswerable}
  expected_output:
    hits: []
    reference: The Electron v30.0.0 documentation has no ImageView.

- name: 'electron v30.0.0: Inside a sandboxed preload script, what can require() actually load?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'Inside a sandboxed preload script, what can require() actually load?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/tutorial/sandbox.md, heading_path: [Process Sandboxing, Sandbox behavior in Electron, Preload scripts]}
    - {version: v30.0.0, article: docs/tutorial/tutorial-3-preload.md, heading_path: [Augmenting the renderer with a preload script], alternative: true}
    reference: >-
      A polyfilled require that loads only the electron module (contextBridge, crashReporter,
      ipcRenderer, nativeImage, webFrame, webUtils) and the events, timers and url built-ins (also as
      node imports); Buffer, process, setImmediate and clearImmediate are polyfilled as globals.
    facts:
    - require can load electron's renderer modules such as contextBridge and ipcRenderer
    - only the events, timers and url Node.js built-ins can be required
    - Buffer, process, setImmediate and clearImmediate are available as polyfilled globals
    - the preload cannot be split into CommonJS modules, so a bundler is needed

- name: 'electron v38.0.0: How do I copy one webContents'' back/forward history into a new window?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'How do I copy one webContents'' back/forward history into a new window?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/api/navigation-history.md, heading_path: ['Class: NavigationHistory', Instance Methods, navigationHistory.restore(options)]}
    - {version: v38.0.0, article: docs/tutorial/navigation-history.md, heading_path: [Navigation History, Restoring history]}
    reference: >-
      Read the entries with `navigationHistory.getAllEntries()` (and the position with
      `getActiveIndex()`), then call `navigationHistory.restore({ entries, index })` on the new
      window's webContents, ideally before any `loadURL()` or `loadFile()`; it returns a Promise.
    facts:
    - restore takes entries from a prior getAllEntries() call and an optional index
    - without an index the last (newest) entry is loaded
    - it should be called before loadURL() or loadFile()
    - it returns a Promise that resolves when the selected entry has finished loading

- name: 'electron v45.3.2: How do I wipe the saved bounds of a window that uses state persistence?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'How do I wipe the saved bounds of a window that uses state persistence?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/api/base-window.md, heading_path: [BaseWindow, 'Class: BaseWindow', Static Methods, BaseWindow.clearPersistedState(name)]}
    - {version: v45.3.2, article: docs/tutorial/window-state-persistence.md, heading_path: [Window State Persistence, Usage, Clearing persisted state]}
    reference: >-
      Call the static `BaseWindow.clearPersistedState(name)` (also on `BrowserWindow`)
      with the window's `name`; it removes the saved bounds, display mode and work area, and logs a
      warning if the name is empty or no state exists.
    facts:
    - the method is the static BaseWindow.clearPersistedState(name)
    - it takes the window name given in the constructor options
    - it removes persisted bounds, display mode and work area information
    - it logs a warning when the name is empty or no saved state exists

- name: 'electron v38.0.0: What stdio settings and process name options does utilityProcess.fork take?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'What stdio settings and process name options does utilityProcess.fork take?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/api/utility-process.md, heading_path: [utilityProcess, Methods, 'utilityProcess.fork(modulePath[, args][, options])']}
    reference: '`stdio` configures stdout and stderr as `pipe`, `ignore` or `inherit` (default
      `inherit`); stdin can only be `ignore`. `serviceName` names the process in `app.getAppMetrics`
      and `child-process-gone` (default `Node Utility Process`). fork can only be called after the
      app is ready.'
    facts:
    - stdio defaults to inherit and accepts pipe, ignore or inherit for stdout and stderr
    - configuring stdin to anything other than ignore is an error
    - serviceName defaults to Node Utility Process
    - utilityProcess.fork can only be called after the app ready event

- name: 'electron v38.0.0: What value makes -electron-corner-smoothing match the operating system?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'What value makes -electron-corner-smoothing match the operating system?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/api/corner-smoothing-css.md, heading_path: ['CSS Rule: -electron-corner-smoothing', Matching the system UI]}
    reference: >-
      Use the `system-ui` keyword; it resolves to 60% smoothing on macOS and 0% on Windows
      and Linux.
    facts:
    - the system-ui keyword matches the OS design language
    - system-ui is 60% on macOS
    - system-ui is 0% on Windows and Linux

- name: 'electron v45.3.2: Can autoUpdater on macOS download a binary patch instead of the whole ZIP?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'Can autoUpdater on macOS download a binary patch instead of the whole ZIP?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/api/auto-updater.md, heading_path: [autoUpdater, Platform Notices, macOS]}
    reference: >-
      Yes. An update entry may carry `delta` with `from_version`, `url`, `sha256` and
      `size`; when `from_version` equals the running app's `CFBundleVersion` the patch is downloaded
      and applied instead of the ZIP, falling back to the ZIP on any failure. Patches are made with
      Sparkle's `BinaryDelta create`.
    facts:
    - an update entry can carry a delta object with from_version, url, sha256 and size
    - the patch is used only when from_version equals the running app's CFBundleVersion
    - on any failure the full ZIP is downloaded in the same check
    - patches are created with Sparkle's BinaryDelta create

- name: 'electron v38.0.0: Are cookies encrypted on disk by default, and which fuse changes that?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'Are cookies encrypted on disk by default, and which fuse changes that?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/tutorial/fuses.md, heading_path: [Electron Fuses, Current Fuses, cookieEncryption]}
    reference: >-
      No. The `cookieEncryption` fuse (`FuseV1Options.EnableCookieEncryption`) is disabled
      by default, so Chromium's cookie database stores values in plaintext; enabling it encrypts them
      with OS-level keys, and it is a one-way transition.
    facts:
    - the cookieEncryption fuse is disabled by default
    - its @electron/fuses option is FuseV1Options.EnableCookieEncryption
    - enabling it is one-way; disabling it again leaves the cookie store corrupt

- name: 'electron v30.0.0: What does requestSingleInstanceLock return and what should my app do with it?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'What does requestSingleInstanceLock return and what should my app do with it?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/api/app.md, heading_path: [app, Methods, 'app.requestSingleInstanceLock([additionalData])']}
    reference: >-
      It returns a boolean, `true` when this process is the primary instance and should keep
      loading, `false` when another instance holds the lock and this one should quit at once. It can
      pass `additionalData` to the first instance.
    facts:
    - it returns true when this process obtained the lock and is the primary instance
    - it returns false when another instance holds the lock, and the app should quit immediately
    - an optional additionalData object is sent to the first instance

- name: 'electron v45.3.2: What does safeStorage.decryptStringAsync resolve with?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'What does safeStorage.decryptStringAsync resolve with?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/api/safe-storage.md, heading_path: [safeStorage, Methods, safeStorage.decryptStringAsync(encrypted)]}
    reference: >-
      It takes the encrypted Buffer and resolves with an object holding `result`, the
      decrypted string, and `shouldReEncrypt`, which says whether the data should be re-encrypted
      because the key was rotated or a new key is available.
    facts:
    - it takes the encrypted data as a Buffer
    - it resolves with an object whose result field is the decrypted string
    - shouldReEncrypt says whether the data should be re-encrypted after key rotation

- name: 'electron v45.3.2: How do I make my main window reopen with the same size and position after a restart?'
  inputs:
    project: electron
    version: v45.3.2
    query: 'How do I make my main window reopen with the same size and position after a restart?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v45.3.2, article: docs/tutorial/window-state-persistence.md, heading_path: [Window State Persistence, Usage, Basic usage]}
    - {version: v45.3.2, article: docs/tutorial/window-state-persistence.md, heading_path: [Window State Persistence, Usage, Selective persistence]}
    reference: >-
      Give the window a unique `name` and set `windowStatePersistence: true` in its constructor
      options; Electron then restores position, size and display mode on creation and saves them on
      every change. Pass `{ bounds, displayMode }` to persist only part of it.
    facts:
    - set windowStatePersistence to true in the window constructor options
    - the window needs a unique name, which identifies the saved state
    - position, size and display mode are restored on creation and saved when they change
    - an object with bounds and displayMode chooses what is persisted

- name: 'electron v38.0.0: How do I wire up back and forward buttons for a BrowserWindow?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'How do I wire up back and forward buttons for a BrowserWindow?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/tutorial/navigation-history.md, heading_path: [Navigation History, Navigating through history]}
    - {version: v38.0.0, article: docs/tutorial/navigation-history.md, heading_path: [Navigation History, Accessing NavigationHistory]}
    reference: >-
      Take `navigationHistory` from the window's `webContents` and call `goBack()` or
      `goForward()` after checking `canGoBack()` or `canGoForward()`.
    facts:
    - navigation history is reached through webContents.navigationHistory
    - check canGoBack() before calling goBack()
    - check canGoForward() before calling goForward()

- name: 'electron v30.0.0: Links with target=_blank open a new Electron window; how do I send them to the default browser?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'Links with target=_blank open a new Electron window; how do I send them to the default browser?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/tutorial/security.md, heading_path: [Security, 'Checklist: Security recommendations', 14. Disable or limit creation of new windows, 'How?']}
    reference: >-
      Register a window open handler with `contents.setWindowOpenHandler` (for example in
      `app.on('web-contents-created')`), call `shell.openExternal(url)` for URLs you trust, and return
      `{ action: 'deny' }` so no Electron window is created.
    facts:
    - webContents delegates new windows to a handler set with setWindowOpenHandler
    - the handler calls shell.openExternal for URLs considered safe
    - the handler returns action deny so no new window is created

- name: 'electron v30.0.0: How can the user force dark or light mode from my app''s settings regardless of the OS?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'How can the user force dark or light mode from my app''s settings regardless of the OS?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/tutorial/dark-mode.md, heading_path: [Dark Mode, Overview, Manually update your own interfaces]}
    reference: >-
      Set `nativeTheme.themeSource` to the desired mode; the value propagates to the
      renderer and CSS rules using `prefers-color-scheme` update accordingly.
    facts:
    - set the themeSource property of the nativeTheme module
    - the value is propagated to the renderer process
    - CSS prefers-color-scheme rules update accordingly

- name: 'electron v30.0.0: How do I write my main process as an ES module?'
  inputs:
    project: electron
    version: v30.0.0
    query: 'How do I write my main process as an ES module?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v30.0.0, article: docs/tutorial/esm.md, heading_path: [ES Modules (ESM) in Electron, Main process]}
    - {version: v30.0.0, article: docs/tutorial/esm.md, heading_path: [ES Modules (ESM) in Electron, Main process, Caveats, "You must use await generously before the app's ready event"]}
    reference: >-
      Give the file a `.mjs` extension or set `"type": "module"` in the nearest
      package.json; the main process uses Node's ESM loader. Because ESM loads asynchronously,
      `await` anything that must run before the app's `ready` event (such as `app.setPath`).
    facts:
    - the file must end in .mjs or the nearest package.json must set type module
    - the main process uses the Node.js ESM loader
    - ES modules load asynchronously, so await promises that must finish before ready

- name: 'electron v38.0.0: I set titleBarStyle hidden and lost the minimize and close buttons on Windows. How do I get them back?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'I set titleBarStyle hidden and lost the minimize and close buttons on Windows. How do I get them back?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/tutorial/custom-title-bar.md, heading_path: [Custom Title Bar, Basic tutorial, Add native window controls Windows Linux]}
    reference: >-
      On Windows and Linux, set `titleBarOverlay` in the BrowserWindow constructor
      (`titleBarOverlay: true` is the simplest); macOS keeps its traffic lights with
      `titleBarStyle: 'hidden'`.
    facts:
    - on Windows and Linux the window controls are added back with the titleBarOverlay option
    - titleBarOverlay true is the simplest way
    - on macOS a hidden title bar keeps the traffic light controls

- name: 'electron v38.0.0: After removing the title bar the window cannot be moved. How do I make my HTML header draggable?'
  inputs:
