    - {version: v38.0.0, article: docs/breaking-changes.md, heading_path: [Breaking Changes, Planned Breaking API Changes (35.0), 'Deprecated: setPreloads, getPreloads on Session']}
    - {version: v38.0.0, article: docs/api/session.md, heading_path: [session, 'Class: Session', Instance Methods, ses.registerPreloadScript(script)]}
    - {version: v38.0.0, article: docs/api/structures/preload-script-registration.md, heading_path: [PreloadScriptRegistration Object]}
    reference: >-
      Use `ses.registerPreloadScript({ type: 'frame', id, filePath })`, which adds a script without
      replacing others and returns its ID; `filePath` must be absolute, `type` can be `frame` or
