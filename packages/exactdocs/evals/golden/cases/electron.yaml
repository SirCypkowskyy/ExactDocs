    - errors thrown in handle reach the renderer with only their message property

- name: 'electron v38.0.0: How do I stop people from running my packaged app as plain Node with ELECTRON_RUN_AS_NODE?'
  inputs:
    project: electron
    version: v38.0.0
    query: 'How do I stop people from running my packaged app as plain Node with ELECTRON_RUN_AS_NODE?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: v38.0.0, article: docs/tutorial/fuses.md, heading_path: [Electron Fuses, Current Fuses, runAsNode]}
    - {version: v38.0.0, article: docs/tutorial/fuses.md, heading_path: [Electron Fuses, 'How do I flip the fuses?', The easy way]}
    - {version: v38.0.0, article: docs/tutorial/security.md, heading_path: [Security, 'Checklist: Security recommendations', 19. Check which fuses you can change, 'Why?']}
    reference: >-
      Disable the `runAsNode` fuse (enabled by default) with `@electron/fuses`: `flipFuses(...,
      { version: FuseVersion.V1, [FuseV1Options.RunAsNode]: false })`, and check it with `npx
      @electron/fuses read`. The security checklist warns that runAsNode and nodeCliInspect let
      command-line environment variables or arguments make the app run commands. With the fuse off,
      `process.fork` in main stops working, so use utility processes.
    facts:
    - the runAsNode fuse decides whether ELECTRON_RUN_AS_NODE is respected and is enabled by default
    - flip it off with flipFuses from @electron/fuses and FuseV1Options.RunAsNode set to false
    - runAsNode and nodeCliInspect can be used to execute commands through the application
    - with the fuse disabled process.fork in the main process does not work, so utility processes are recommended

