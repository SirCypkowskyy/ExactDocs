    - {version: v38.0.0, article: docs/api/web-utils.md, heading_path: [webUtils, Methods, webUtils.getPathForFile(file)]}
    reference: >-
      The nonstandard `File.path` was removed in Electron 32. Call `webUtils.getPathForFile(file)`
      (from a preload, exposed through contextBridge); it returns the path, an empty string for a
      File built in JS, and throws if the argument is not a File.
    facts:
    - File.path was removed in Electron 32
    - webUtils.getPathForFile(file) returns the file system path
    - it returns an empty string for a File not backed by a file on disk
    - the breaking-changes example calls it in a preload exposed with contextBridge

- name: 'electron v38.0.0: session.setPreloads is deprecated. How do I register a preload for every frame in a session now?'
  inputs:
