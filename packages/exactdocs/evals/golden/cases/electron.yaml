    - a WebContentsView is added with win.contentView.addChildView()
    - setBounds positions the view inside the window
    - content is loaded through view.webContents, for example loadURL

- name: 'electron v38.0.0: file.path is undefined on files from an input element. How do I get the real path on disk?'
  inputs:
