    - {version: v45.3.2, article: docs/api/safe-storage.md, heading_path: [safeStorage, Methods, safeStorage.isAsyncEncryptionAvailable()]}
    - {version: v45.3.2, article: docs/api/safe-storage.md, heading_path: [safeStorage, Methods, safeStorage.decryptStringAsync(encrypted)]}
    reference: >-
      The sync methods are deprecated and go away in Electron 46. Use `await
      safeStorage.isAsyncEncryptionAvailable()`, `await encryptStringAsync()` and `await
