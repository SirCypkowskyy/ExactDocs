    - the registration takes type (frame or service-worker), an optional id and an absolute filePath
    - it returns the ID of the registered script
    - frame preloads registered on the session run before the WebContents' own preload

- name: 'electron v45.3.2: How do I move my safeStorage code off the deprecated synchronous calls?'
  inputs:
