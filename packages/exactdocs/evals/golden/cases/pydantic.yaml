- name: 'pydantic v2.14.3: How do I set up a tagged union of models, and why is it faster than a plain union?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'How do I set up a tagged union of models, and why is it faster than a plain union?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/concepts/unions.md, heading_path: ['Discriminated unions', 'Discriminated unions with string discriminators']}
    - {version: v2.14.3, article: docs/concepts/unions.md, heading_path: ['Discriminated unions']}
    - {version: v2.14.3, article: docs/concepts/fields.md, heading_path: ['Discriminator']}
    - {version: v2.14.3, article: docs/concepts/performance.md, heading_path: ['Performance tips', 'Use tagged union, not union']}
    reference: >-
      Give every model a common field typed with `Literal` values and declare the union with
