    - {version: v2.5.3, article: docs/migration.md, heading_path: ['Migration guide', 'Changes to Handling of Standard Types', 'Patterns / regex on strings']}
    - {version: v2.5.3, article: docs/migration.md, heading_path: ['Migration guide', 'Changes to pydantic.Field']}
    reference: >-
