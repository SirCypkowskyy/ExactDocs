    - {version: v2.5.3, article: docs/blog/pydantic-v2.md, heading_path: ['Pydantic V2 Plan', 'Headlines', 'Model Namespace Cleanup :thumbsup:'], alternative: true}
    reference: >-
      V2 renames the `BaseModel` methods to `model_*`: `dict()` becomes `model_dump()` and `parse_obj()`
