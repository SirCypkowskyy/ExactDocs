# Golden-set cases for Pydantic (corpus.yaml: pydantic). Format and rules: docs/evals/golden-set.md.
# Check with `just golden-validate --projects pydantic`.
name: pydantic
cases:
- name: 'pydantic v2.5.3: What is orm_mode called in Pydantic V2?'
  inputs:
    project: pydantic
    version: v2.5.3
    query: 'What is orm_mode called in Pydantic V2?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: v2.5.3, article: docs/migration.md, heading_path: [Migration guide, Changes to config]}
    reference: '`orm_mode` is renamed to `from_attributes`, and config is now set as a
      `model_config` dict instead of a nested `class Config`.'
    facts:
    - orm_mode is renamed to from_attributes
    - config is set with a model_config dict; class Config is deprecated

- name: 'pydantic v1.10.22: How do I create a model from an ORM object?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'How do I create a model from an ORM object?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v1.10.22, article: docs/usage/models.md, heading_path: [ORM Mode (aka Arbitrary Class Instances)]}
    reference: Set `orm_mode = True` in the model's `Config` and build the instance with
      `Model.from_orm(obj)`.
    facts:
    - the Config property orm_mode must be set to True
    - the from_orm constructor creates the instance

- name: 'pydantic v2.14.3: How do I add a check that runs after Pydantic has validated a field?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'How do I add a check that runs after Pydantic has validated a field?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/concepts/validators.md, heading_path: [Field validators]}
    reference: Use an after validator, either `Annotated[int, AfterValidator(func)]` or a
      `@field_validator('field', mode='after')` class method; it returns the validated value and
      raises `ValueError` to reject it.
    facts:
    - after validators run after Pydantic's internal validation
    - they are declared with AfterValidator in Annotated or with @field_validator(mode='after')
    - the validator must return the validated value

- name: 'pydantic v2.14.3: What is the difference between strict mode and lax mode?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'What is the difference between strict mode and lax mode?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/concepts/strict_mode.md, heading_path: []}
    reference: By default (lax mode) Pydantic coerces values, such as the string '123' to the int
      123; strict mode errors instead when the data is not of the right type, though JSON input
      may get looser rules.
    facts:
    - lax mode is the default and coerces values when possible
    - strict mode raises a validation error instead of coercing
    - strict mode may allow looser rules for JSON input, such as strings for dates

- name: 'pydantic v1.10.22: How do I include a property in serialization with @computed_field?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'How do I include a property in serialization with @computed_field?'
  metadata: {kind: unanswerable}
  expected_output:
    hits: []
    reference: The Pydantic v1.10 documentation has no computed_field.

# ---------------------------------------------------------------- identifier-lookup

- name: 'pydantic v1.10.22: Which Config setting makes a model reject unknown keys instead of dropping them?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'Which Config setting makes a model reject unknown keys instead of dropping them?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v1.10.22, article: docs/usage/model_config.md, heading_path: ['Options']}
    reference: >-
      Set `extra = 'forbid'` (or `Extra.forbid`) in the model's `Config`; the default is
      `Extra.ignore`, which silently ignores extra attributes, and `'allow'` assigns them to the model.
    facts:
    - the Config option is extra
    - extra set to forbid makes validation fail when extra attributes are passed
    - the default is Extra.ignore, which silently ignores them

- name: 'pydantic v1.10.22: What validator argument applies it to every element of a List instead of the whole list?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'What validator argument applies it to every element of a List instead of the whole list?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v1.10.22, article: docs/usage/validators.md, heading_path: ['Pre and per-item validators']}
    reference: >-
      Pass `each_item=True` to `@validator`; the validator is then applied to the individual values
      of a `List`, `Dict`, `Set` and so on rather than to the whole object.
    facts:
    - the keyword argument is each_item=True
    - it applies the validator to individual values of containers such as List, Dict or Set

- name: 'pydantic v1.10.22: Which method builds a model from already-trusted data while skipping validation?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'Which method builds a model from already-trusted data while skipping validation?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v1.10.22, article: docs/usage/models.md, heading_path: ['Helper Functions', 'Creating models without validation']}
    reference: >-
      `Model.construct()` creates a model without any validation (around 30x faster), so it should only
      be used with data that is already validated or trusted; its optional `_fields_set` argument says
      which fields were originally set.
    facts:
    - the method is construct()
    - construct() performs no validation and can create invalid models
    - it is generally around 30x faster than full validation
    - the optional _fields_set argument sets which fields count as set

- name: 'pydantic v2.5.3: Which error type do I get when I pass 0.5 to an int field?'
  inputs:
    project: pydantic
    version: v2.5.3
    query: 'Which error type do I get when I pass 0.5 to an int field?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v2.5.3, article: docs/errors/validation_errors.md, heading_path: ['int_from_float']}
    reference: >-
      The error type is `int_from_float`, raised when a `float` value is provided for an `int` field.
    facts:
    - the error type is int_from_float
    - it is raised when a float is given for an int field

- name: 'pydantic v2.5.3: How do I map a field to the first element of a nested list in the input?'
  inputs:
    project: pydantic
    version: v2.5.3
    query: 'How do I map a field to the first element of a nested list in the input?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v2.5.3, article: docs/concepts/fields.md, heading_path: ['Field aliases', 'AliasPath and AliasChoices']}
    reference: >-
      Use `AliasPath` as the field's `validation_alias`, e.g.
      `Field(validation_alias=AliasPath('names', 0))`; `AliasChoices` instead lists alternative aliases.
    facts:
    - AliasPath specifies a path of keys and indexes to the value
    - it is passed as validation_alias in Field
    - AliasChoices gives a choice of several aliases

- name: 'pydantic v2.5.3: What is the error code when a model defines both class Config and model_config?'
  inputs:
    project: pydantic
    version: v2.5.3
    query: 'What is the error code when a model defines both class Config and model_config?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v2.5.3, article: docs/errors/usage_errors.md, heading_path: ['Config and model_config both defined {#config-both}']}
    reference: >-
      Defining both raises a `PydanticUserError` with the code `config-both`, at class definition.
    facts:
    - a PydanticUserError is raised
    - its code is config-both

- name: 'pydantic v2.14.3: Which config keys decide whether input may use the field name, the alias, or both?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'Which config keys decide whether input may use the field name, the alias, or both?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/concepts/alias.md, heading_path: ['Alias Configuration', 'ConfigDict Settings', 'Validation']}
    - {version: v2.14.3, article: docs/concepts/alias.md, heading_path: ['Alias Configuration', 'Runtime Settings', 'Validation']}
    reference: >-
      `validate_by_alias` (default `True`) and `validate_by_name` (default `False`) in `ConfigDict`;
      set both to `True` to accept either. Per call, `model_validate()` and the `TypeAdapter`
      methods take `by_alias` and `by_name`.
    facts:
    - validate_by_alias is True by default
    - validate_by_name is False by default
    - by_alias and by_name can be passed per call to the validation methods

- name: 'pydantic v2.14.3: What annotation drops invalid items from a list instead of failing the whole list?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'What annotation drops invalid items from a list instead of failing the whole list?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/concepts/types.md, heading_path: ['Utility types', 'OnErrorOmit']}
    reference: >-
      `OnErrorOmit` (added in v2.6), e.g. `list[OnErrorOmit[int]]`: items that fail validation are
      silently omitted and the valid ones kept, instead of a `ValidationError` for the whole collection.
    facts:
    - the annotation is OnErrorOmit
    - items failing validation are silently omitted and valid ones kept
    - it was added in v2.6

- name: 'pydantic v2.14.3: Which mypy plugin setting removes the **kwargs from the generated __init__ signature?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'Which mypy plugin setting removes the **kwargs from the generated __init__ signature?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/integrations/mypy.md, heading_path: ['Configuring the Plugin', 'init_forbid_extra']}
    reference: >-
      `init_forbid_extra` (default `False`). Without it the plugin adds `**kwargs: Any` to the
      synthesized `__init__`, unless the model's `extra` config is `'forbid'`.
    facts:
    - the setting is init_forbid_extra
    - it defaults to False
    - otherwise the plugin adds **kwargs Any unless extra is set to forbid

# ---------------------------------------------------------------- how-to

- name: 'pydantic v1.10.22: How do I load settings from a .env file, and does a real environment variable win over it?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'How do I load settings from a .env file, and does a real environment variable win over it?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v1.10.22, article: docs/usage/settings.md, heading_path: ['Dotenv (.env) support']}
    - {version: v1.10.22, article: docs/usage/settings.md, heading_path: ['Field value priority']}
    reference: >-
      Install python-dotenv, then set `env_file` (and optionally `env_file_encoding`) on the
      `BaseSettings` `Config`, or pass `_env_file=` when instantiating. Environment variables always take
      priority over values loaded from the dotenv file.
    facts:
    - dotenv parsing requires python-dotenv (pip install pydantic[dotenv])
    - set env_file on Config or pass _env_file when instantiating
    - environment variables take priority over the dotenv file

- name: 'pydantic v1.10.22: My validator does not run when the field is omitted; how do I make it run anyway?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'My validator does not run when the field is omitted; how do I make it run anyway?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v1.10.22, article: docs/usage/validators.md, heading_path: ['Validate Always']}
    reference: >-
      Validators are skipped when no value is supplied, for performance. Pass `always=True` to
      `@validator`, usually together with `pre=True`, since otherwise the default `None` would be
      validated and fail.
    facts:
    - by default validators are not called when a value is not supplied
    - always=True makes the validator always run
    - it is often combined with pre=True

- name: 'pydantic v1.10.22: How do I install pydantic without the compiled binaries to keep the environment small?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'How do I install pydantic without the compiled binaries to keep the environment small?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v1.10.22, article: docs/install.md, heading_path: ['Compiled with Cython', 'Performance vs package size trade-off']}
    reference: >-
      Install with `pip --no-binary pydantic` and keep Cython out of the environment or set
      `SKIP_CYTHON=1`, e.g. `SKIP_CYTHON=1 pip install --no-binary pydantic pydantic<2`.
    facts:
    - use the pip --no-binary pydantic option
    - set the SKIP_CYTHON environment variable or keep Cython out of the environment

- name: 'pydantic v2.5.3: How do I keep unknown keys passed to a model and read them back?'
  inputs:
    project: pydantic
    version: v2.5.3
    query: 'How do I keep unknown keys passed to a model and read them back?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v2.5.3, article: docs/concepts/models.md, heading_path: ['Extra fields']}
    reference: >-
      Set `model_config = ConfigDict(extra='allow')`; the extra data is stored in
      `__pydantic_extra__`, and annotating `__pydantic_extra__` gives the extra values a type to be
      validated against.
    facts:
    - set extra='allow' in model_config
    - the extra fields are stored in __pydantic_extra__
    - annotating __pydantic_extra__ makes the extra values validated

- name: 'pydantic v2.5.3: How do I validate a list of TypedDicts without defining a BaseModel?'
  inputs:
    project: pydantic
    version: v2.5.3
    query: 'How do I validate a list of TypedDicts without defining a BaseModel?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v2.5.3, article: docs/concepts/type_adapter.md, heading_path: []}
    reference: >-
      Wrap the type in a `TypeAdapter`, e.g. `TypeAdapter(List[User])`, and call
      `validate_python(data)`; it also offers serialization and JSON schema generation.
    facts:
    - TypeAdapter validates arbitrary types without a BaseModel
    - validation is done with validate_python
    - TypeAdapter also serializes and generates JSON schema

- name: 'pydantic v2.14.3: How do I make validation of a big list stop at the first bad item?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'How do I make validation of a big list stop at the first bad item?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/concepts/types.md, heading_path: ['Utility types', 'FailFast']}
    - {version: v2.14.3, article: docs/concepts/performance.md, heading_path: ['Performance tips', 'Failing early with FailFast']}
    reference: >-
      Annotate the collection with `FailFast()`, e.g. `Annotated[list[int], FailFast()]` (v2.8+);
      validation stops at the first failing item, which is faster but reports fewer errors.
    facts:
    - apply the FailFast annotation to the collection type
    - validation stops as soon as an item fails
    - you trade error information for performance
    - FailFast is available since v2.8

- name: 'pydantic v2.14.3: How can I validate a truncated JSON string while an LLM is still streaming it?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'How can I validate a truncated JSON string while an LLM is still streaming it?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/concepts/experimental.md, heading_path: ['Experimental Features', 'Partial Validation']}
    - {version: v2.14.3, article: docs/concepts/experimental.md, heading_path: ['Experimental Features', 'Partial Validation', 'Limitations of Partial Validation', 'TypeAdapter only']}
    reference: >-
      Use experimental partial validation (v2.10): pass `experimental_allow_partial` (`True`/`'on'`, or
      `'trailing-strings'` to keep an incomplete trailing string) to `TypeAdapter.validate_json()`,
      `validate_python()` or `validate_strings()`. It only works on `TypeAdapter`, not `BaseModel`.
    facts:
    - pass experimental_allow_partial to the TypeAdapter validation methods
    - the trailing-strings mode keeps an incomplete string at the end
    - it is only supported on TypeAdapter, not on BaseModel
    - partial validation is experimental

- name: 'pydantic v2.14.3: How do I mark a field as deprecated so reading it warns and the JSON schema says so?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'How do I mark a field as deprecated so reading it warns and the JSON schema says so?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/concepts/fields.md, heading_path: ['Deprecated fields']}
    - {version: v2.14.3, article: docs/concepts/fields.md, heading_path: ['Deprecated fields', 'deprecated as a string']}
    reference: >-
      Pass `deprecated` to `Field()` (v2.7+): a string (used as the message), a `warnings.deprecated`
      instance or `True`. Accessing the field emits a runtime deprecation warning and the JSON schema
      gets `deprecated: true`.
    facts:
    - use the deprecated parameter of Field
    - it accepts a message string, a warnings.deprecated instance or a boolean
    - accessing the field emits a runtime deprecation warning
    - the generated JSON schema sets the deprecated keyword

- name: 'pydantic v2.14.3: My Lambda fails with no module named pydantic_core._pydantic_core; how should I package pydantic?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'My Lambda fails with no module named pydantic_core._pydantic_core; how should I package pydantic?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/integrations/aws_lambda.md, heading_path: ['Troubleshooting', 'Missing pydantic_core module']}
    - {version: v2.14.3, article: docs/integrations/aws_lambda.md, heading_path: ['Installing pydantic for AWS Lambda functions']}
    reference: >-
      The error means pydantic was installed for the wrong platform. Install wheels built for the
      Lambda runtime: `pip install --platform manylinux2014_x86_64 --target=<dir> --implementation cp
      --python-version <runtime> --only-binary=:all: --upgrade pydantic`, and check that the compiled
      library's suffix matches the Lambda Python version.
    facts:
    - the error indicates pydantic was installed incorrectly for the platform
    - install with pip --platform matching the Lambda runtime and only pre-built binary wheels
    - the Python version must match the Lambda runtime

- name: 'pydantic v2.14.3: How do I give a TypedDict its own pydantic config without type checker errors?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'How do I give a TypedDict its own pydantic config without type checker errors?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: v2.14.3, article: docs/concepts/config.md, heading_path: ['Configuration on other supported types']}
    reference: >-
      Decorate it with `@with_config(ConfigDict(...))`, which avoids static type checking errors with
      `TypedDict`; the alternative is a `__pydantic_config__` class attribute.
    facts:
    - use the @with_config decorator
    - with_config avoids type checker errors with TypedDict
    - the alternative is the __pydantic_config__ class attribute

# ---------------------------------------------------------------- conceptual

- name: 'pydantic v1.10.22: Is a field annotated Optional[int] required, and how do I make it required but nullable?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'Is a field annotated Optional[int] required, and how do I make it required but nullable?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v1.10.22, article: docs/usage/models.md, heading_path: ['Required fields', 'Required Optional fields']}
    reference: >-
      In v1 an annotation-only `Optional[...]` field is not required. To require a value that may still
      be `None`, give the `Optional` field `...` as its default; since v1.2 the two forms no longer mean
      the same thing.
    facts:
    - an annotation-only Optional field is optional
    - Optional with an ellipsis default is required but accepts None
    - since v1.2 the two forms are no longer equivalent

- name: 'pydantic v1.10.22: Why did my Union[int, str] field turn "1" into an int, and how do I stop that?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'Why did my Union[int, str] field turn "1" into an int, and how do I stop that?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v1.10.22, article: docs/usage/model_config.md, heading_path: ['Smart Union']}
    reference: >-
      v1 validates a `Union` in order and coerces when it can, so the first member that accepts the
      value wins. Enabling `Config.smart_union` checks all allowed types before coercing; it is slower
      and does not support compound types such as `List[int]` vs `List[str]`.
    facts:
    - by default the Union members are tried in order and coercion applies
    - Config.smart_union checks all types before trying to coerce
    - smart_union is slower and does not support compound types yet

- name: 'pydantic v1.10.22: When does __post_init__ run compared to __post_init_post_parse__ on a pydantic dataclass?'
  inputs:
    project: pydantic
    version: v1.10.22
    query: 'When does __post_init__ run compared to __post_init_post_parse__ on a pydantic dataclass?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v1.10.22, article: docs/usage/dataclasses.md, heading_path: ['Initialize hooks']}
    reference: >-
      `__post_init__` runs before validation and `__post_init_post_parse__` after it. For stdlib
      dataclasses, `Config.post_init_call = 'after_validation'` makes `__post_init__` run after
      validation; `InitVar` fields are passed to both hooks.
    facts:
    - __post_init__ executes before validation
    - __post_init_post_parse__ executes after validation
    - InitVar fields are passed to both hooks

- name: 'pydantic v2.5.3: How does v2 pick the Union member when the input could match several of them?'
  inputs:
    project: pydantic
    version: v2.5.3
    query: 'How does v2 pick the Union member when the input could match several of them?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v2.5.3, article: docs/concepts/unions.md, heading_path: ['Union Modes', 'Smart Mode']}
    reference: >-
      The default `union_mode='smart'` tries members left to right and scores matches: an exact type
      match is returned at once, otherwise the leftmost strict-mode match, otherwise the leftmost lax
      match; if all fail, all errors are returned.
    facts:
    - smart mode is the default union mode in v2
    - an exact type match wins immediately
    - otherwise the leftmost strict match is preferred over a lax match
    - if every member fails, all the errors are returned

- name: 'pydantic v2.5.3: What is the difference between before, after, wrap and plain validators?'
  inputs:
    project: pydantic
    version: v2.5.3
    query: 'What is the difference between before, after, wrap and plain validators?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v2.5.3, article: docs/concepts/validators.md, heading_path: ['Annotated Validators', 'Before, After, Wrap and Plain validators']}
    reference: >-
      After validators run after Pydantic's parsing and are type safe; before validators run first on
      the raw input; plain validators are like before validators but end validation, so no inner
      validation runs; wrap validators can run code before and after the inner validation or stop it.
      Only one plain validator can be used.
    facts:
    - after validators run after Pydantic's internal parsing
    - before validators run before it and receive the raw input
    - plain validators terminate validation so Pydantic's own validation does not run
    - wrap validators can run code before and after the inner validation

- name: 'pydantic v2.5.3: Why is model_validate_json faster than calling json.loads and then model_validate?'
  inputs:
    project: pydantic
    version: v2.5.3
    query: 'Why is model_validate_json faster than calling json.loads and then model_validate?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: v2.5.3, article: docs/concepts/performance.md, heading_path: ['Performance tips', 'Use model_validate_json() not model_validate(json.loads(...))']}
    - {version: v2.5.3, article: docs/concepts/json.md, heading_path: ['JSON', 'Json Parsing']}
    reference: >-
      With `json.loads` the JSON is parsed in Python into a dict and then validated; `model_validate_json()`
      parses and validates internally with Pydantic's built-in JSON parser.
    facts:
    - json.loads parses the JSON in Python into a dict before validation
    - model_validate_json performs parsing and validation internally

- name: 'pydantic v2.14.3: Does str_to_lower set on a parent model also apply to a nested model field?'
  inputs:
    project: pydantic
    version: v2.14.3
    query: 'Does str_to_lower set on a parent model also apply to a nested model field?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
