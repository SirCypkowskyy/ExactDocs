# ---- 0.52.1 ----

- name: 'starlette 0.52.1: Does TrustedHostMiddleware send example.com visitors to www.example.com, and can I turn that off?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'Does TrustedHostMiddleware send example.com visitors to www.example.com, and can I turn that off?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/middleware.md, heading_path: [TrustedHostMiddleware]}
    reference: >-
      Yes, through `www_redirect`: when true, requests to non-www versions of the allowed hosts are
      redirected to their www counterparts. It defaults to `True`; pass `www_redirect=False` to
      disable it.
    facts:
    - the option is www_redirect
    - it redirects non-www allowed hosts to their www counterparts
    - it defaults to True

- name: 'starlette 0.52.1: What caps the size of a single non-file field when parsing multipart forms, and what is the default?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'What caps the size of a single non-file field when parsing multipart forms, and what is the default?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/requests.md, heading_path: [Request, Request Files]}
    reference: >-
      The `max_part_size` parameter of `request.form()`, which defaults to `1024*1024` (1 MiB). The
      signature is `request.form(max_files=1000, max_fields=1000, max_part_size=1024*1024)`.
    facts:
    - the parameter is max_part_size of request.form()
    - it defaults to 1024*1024
    - max_files and max_fields default to 1000

- name: 'starlette 0.52.1: How do I load a .env file that is not UTF-8?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'How do I load a .env file that is not UTF-8?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/config.md, heading_path: [Custom encoding for environment files]}
    reference: >-
      Pass `encoding` to `Config`, e.g. `Config(".env", encoding="latin-1")`. Environment files are
      read as UTF-8 by default.
    facts:
    - Config takes an encoding argument
    - environment files are read as UTF-8 by default

- name: 'starlette 0.52.1: My sync def endpoints queue up under load. How do I let more of them run in parallel threads?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'My sync def endpoints queue up under load. How do I let more of them run in parallel threads?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/threadpool.md, heading_path: [Thread Pool, Concurrency Limitations]}
    reference: >-
      The default thread pool has only 40 tokens. Raise it through AnyIO:
      `anyio.to_thread.current_default_thread_limiter().total_tokens = 100`. More threads cost
      memory and performance, and the limit is shared with other libraries.
    facts:
    - the default thread pool size is 40 tokens
    - set total_tokens on anyio.to_thread.current_default_thread_limiter()
    - the limit is shared with other libraries such as FastAPI

- name: 'starlette 0.52.1: How do I make TestClient pretend the request comes from localhost:8000?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'How do I make TestClient pretend the request comes from localhost:8000?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/testclient.md, heading_path: [Change client address]}
    reference: >-
      Pass the `client` argument: `TestClient(app, client=('localhost', 8000))`. By default the
      client port is `50000`.
    facts:
    - TestClient takes a client argument with a host and port tuple
    - the default client port is 50000

- name: 'starlette 0.52.1: I have /users/{username} and /users/me routes, but /users/me never gets hit. Why?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'I have /users/{username} and /users/me routes, but /users/me never gets hit. Why?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/routing.md, heading_path: [Route priority]}
    reference: >-
      Routes are matched in order, so `/users/{username}` matches `/users/me` first. List the more
      specific `/users/me` route before the general one.
    facts:
    - incoming paths are matched against the routes in order
    - more specific routes must be listed before general ones

- name: 'starlette 0.52.1: In what order does Starlette run its built-in middleware relative to mine?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'In what order does Starlette run its built-in middleware relative to mine?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/middleware.md, heading_path: [Using middleware]}
    reference: >-
      Middleware runs top to bottom. `ServerErrorMiddleware` is always the outermost layer, then your
      middleware in list order, then `ExceptionMiddleware`, then routing and the endpoint.
    facts:
    - middleware is evaluated from top to bottom
    - ServerErrorMiddleware is always the outermost layer
    - ExceptionMiddleware runs after the user middleware, before routing

- name: 'starlette 0.52.1: What happens when a public site preflights a request to my server on a private network?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'What happens when a public site preflights a request to my server on a private network?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/middleware.md, heading_path: [CORSMiddleware, Private Network Access (PNA)]}
    reference: >-
      The browser sends `Access-Control-Request-Private-Network: true` in the preflight. With
      `allow_private_network=True`, `CORSMiddleware` answers with
      `Access-Control-Allow-Private-Network: true`; otherwise (the default, `False`) it returns 400
      and the request is blocked.
    facts:
    - the preflight carries Access-Control-Request-Private-Network true
    - allow_private_network=True adds Access-Control-Allow-Private-Network true
    - with False the middleware returns a 400 response

- name: 'starlette 0.52.1: Do I still put request inside the context dict when calling TemplateResponse?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'Do I still put request inside the context dict when calling TemplateResponse?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/templates.md, heading_path: []}
    - {version: '0.52.1', article: docs/release-notes.md, heading_path: ['0.29.0 (July 13, 2023)', Added]}
    reference: >-
      No. 0.29.0 added a `request` argument to `TemplateResponse`, and the docs now call
      `templates.TemplateResponse(request, 'index.html')` instead of passing `{'request': request}`
      in the context.
    facts:
    - 0.29.0 added a request argument to TemplateResponse
    - the request is passed first, as TemplateResponse(request, name)

- name: 'starlette 0.52.1: Can I attach middleware to one Route without wrapping it in a Mount?'
  inputs:
    project: starlette
