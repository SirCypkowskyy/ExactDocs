    query: 'Unhandled exceptions return a 500 without Access-Control-Allow-Origin, so the browser hides the error. How do I fix that?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: '1.10.0', article: docs/middleware.md, heading_path: [CORSMiddleware, CORSMiddleware Global Enforcement]}
    reference: >-
      The error response comes from `ServerErrorMiddleware`, outside the inner middleware. Wrap the
      whole application instead: `app = CORSMiddleware(app=app, allow_origins=[...])`, so even error
      responses get the CORS headers.
    facts:
    - errors caught by ServerErrorMiddleware bypass inner CORSMiddleware
    - wrap the entire Starlette app with CORSMiddleware
    - then error responses also carry Access-Control-Allow-Origin

