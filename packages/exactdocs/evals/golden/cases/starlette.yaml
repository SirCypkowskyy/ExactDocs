- name: 'starlette 0.52.1: How do I refuse a websocket handshake with a 401 instead of the default 403?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'How do I refuse a websocket handshake with a 401 instead of the default 403?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/websockets.md, heading_path: [Send Denial Response]}
    - {version: '0.52.1', article: docs/exceptions.md, heading_path: [HTTPException]}
    reference: >-
      Closing before `accept()` sends a 403. To send another response, call
      `await websocket.send_denial_response(response)` (the server must support the WebSocket Denial
      Response extension) or raise `HTTPException(status_code=401)` before `websocket.accept()`, so
      the connection is not upgraded and the HTTP response is returned.
    facts:
    - closing before accept sends an HTTP 403
    - send_denial_response sends a custom response and needs server support
    - raising HTTPException before accept returns that HTTP response instead of upgrading

