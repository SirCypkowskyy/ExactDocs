    - {version: '0.52.1', article: docs/release-notes.md, heading_path: ['0.39.0 (September 23, 2024)', Added]}
    reference: >-
      Yes, since 0.39.0. It sends `Accept-Ranges: bytes` when the file exists, answers a valid
