# Golden-set cases for Starlette (corpus.yaml: starlette). Format and rules: docs/evals.md#the-golden-set.
# Check with `just golden-validate --projects starlette`.
name: starlette
cases:
- name: 'starlette 1.10.0: How do I run code when the application starts up and when it shuts down?'
  inputs:
    project: starlette
    version: '1.10.0'
    query: 'How do I run code when the application starts up and when it shuts down?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: '1.10.0', article: docs/lifespan.md, heading_path: []}
    reference: Pass an async context manager as `lifespan=` to `Starlette(...)`; the code before its
      `yield` runs at startup and the code after it at shutdown.
    facts:
    - an async context manager is passed as the lifespan argument of Starlette
    - code before the yield runs at startup, code after it at shutdown
    - no request is served until the lifespan has run

- name: 'starlette 1.10.0: Can I still register startup handlers with on_startup or @app.on_event?'
  inputs:
    project: starlette
    version: '1.10.0'
    query: 'Can I still register startup handlers with on_startup or @app.on_event?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: '1.10.0', article: docs/release-notes.md, heading_path: ['1.0.0rc1 (February 23, 2026)', Removed]}
    reference: No. 1.0.0rc1 removed the `on_startup` and `on_shutdown` parameters, the `on_event()`
      decorator and `add_event_handler()`; use the `lifespan` parameter instead.
    facts:
    - on_startup and on_shutdown were removed in 1.0.0rc1
    - the on_event() decorator was removed too
    - the lifespan parameter replaces them

- name: 'starlette 0.52.1: What is the default max_age of SessionMiddleware?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'What is the default max_age of SessionMiddleware?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/middleware.md, heading_path: [SessionMiddleware]}
    reference: '`max_age` is the session expiry in seconds and defaults to 2 weeks; `None` keeps the
      cookie for the browser session.'
    facts:
    - max_age is the session expiry time in seconds
    - it defaults to 2 weeks
    - None makes the cookie last as long as the browser session

- name: 'starlette 0.52.1: Since when can lifespan state be read as request.state["key"]?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'Since when can lifespan state be read as request.state["key"]?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/lifespan.md, heading_path: [Accessing State]}
    reference: Dictionary-style access to the state was introduced in Starlette 0.52.0 (January
      2026), with `Request` generic over the state type for type safety.
    facts:
    - dictionary-style state access was introduced in 0.52.0
    - Request is generic over the state type, so the access is typed

- name: 'starlette 0.52.1: How do I create an HTTP client once at startup and use it in my request handlers?'
  inputs:
    project: starlette
    version: '0.52.1'
    query: 'How do I create an HTTP client once at startup and use it in my request handlers?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: '0.52.1', article: docs/lifespan.md, heading_path: [Lifespan State]}
    - {version: '0.52.1', article: docs/requests.md, heading_path: [Request, Other state]}
    reference: Create the client in the lifespan and yield it in a state dict; handlers read it from
      `request.state`, which receives a shallow copy of that state.
    facts:
    - the lifespan yields a dictionary of state
    - handlers read the state from request.state
    - the request gets a shallow copy of the lifespan state

- name: 'starlette 0.27.0: How do I send a 103 Early Hints response?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'How do I send a 103 Early Hints response?'
  metadata: {kind: unanswerable}
  expected_output:
    hits: []
    reference: The Starlette 0.27.0 documentation does not cover Early Hints.

# ---- 0.27.0 ----

- name: 'starlette 0.27.0: How do I get the IP address of the client that made the request?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'How do I get the IP address of the client that made the request?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/requests.md, heading_path: [Request, Client Address]}
    reference: >-
      Read `request.client`, a named two-tuple: `request.client.host` is the hostname or IP
      address and `request.client.port` the client port. Either item may be `None`.
    facts:
    - request.client is a named two-tuple
    - request.client.host holds the hostname or IP address
    - request.client.port holds the port
    - either item may be None

- name: 'starlette 0.27.0: Which status code does RedirectResponse send if I do not set one?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'Which status code does RedirectResponse send if I do not set one?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/responses.md, heading_path: [RedirectResponse]}
    reference: >-
      `RedirectResponse` returns an HTTP redirect with status 307 by default.
    facts:
    - RedirectResponse uses status code 307 by default

- name: 'starlette 0.27.0: In a class-based websocket handler, what hooks can I override and what does the disconnect hook receive?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'In a class-based websocket handler, what hooks can I override and what does the disconnect hook receive?'
  metadata: {kind: identifier-lookup}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/endpoints.md, heading_path: [WebSocketEndpoint]}
    reference: >-
      `WebSocketEndpoint` has three overridable methods: `on_connect(websocket, **kwargs)`,
      `on_receive(websocket, data)` and `on_disconnect(websocket, close_code)`. An optional
      `encoding` attribute (`'json'`, `'bytes'` or `'text'`) validates the data passed to
      `on_receive`.
    facts:
    - the overridable methods are on_connect, on_receive and on_disconnect
    - on_disconnect receives the websocket and the close_code
    - the encoding attribute can be json, bytes or text

- name: 'starlette 0.27.0: How can a route accept an ISO datetime in the URL and give my handler a datetime object?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'How can a route accept an ISO datetime in the URL and give my handler a datetime object?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/routing.md, heading_path: [Path Parameters]}
    reference: >-
      Write a custom convertor: subclass `starlette.convertors.Convertor`, set a `regex`, implement
      `convert()` (string to datetime) and `to_string()`, register it with
      `register_url_convertor("datetime", DateTimeConvertor())`, then use `{date:datetime}` in the
      route path.
    facts:
    - subclass Convertor with a regex, convert() and to_string()
    - register it with register_url_convertor
    - use it in the path as {name:datetime}

- name: 'starlette 0.27.0: My test needs to check the body of a 500 error page, but TestClient keeps raising the exception. How do I stop that?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'My test needs to check the body of a 500 error page, but TestClient keeps raising the exception. How do I stop that?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/testclient.md, heading_path: []}
    reference: >-
      By default `TestClient` raises any exception from the application. Create it with
      `TestClient(app, raise_server_exceptions=False)` to get the 500 response instead.
    facts:
    - TestClient raises application exceptions by default
    - pass raise_server_exceptions=False to get the 500 response

- name: 'starlette 0.27.0: How do I restrict an endpoint to admins and hide it with a 404 from everyone else?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'How do I restrict an endpoint to admins and hide it with a 404 from everyone else?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/authentication.md, heading_path: [Permissions]}
    reference: >-
      Decorate the endpoint with `@requires(['authenticated', 'admin'], status_code=404)`. Without
      `status_code`, a request missing the scopes gets a 403.
    facts:
    - the requires decorator takes one or several required scopes
    - status_code=404 replaces the default 403 response
    - by default 403 is returned when permissions are not granted

- name: 'starlette 0.27.0: How do I serve the static assets that ship inside an installed Python package?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'How do I serve the static assets that ship inside an installed Python package?'
  metadata: {kind: how-to}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/staticfiles.md, heading_path: [StaticFiles]}
    reference: >-
      Pass `packages=` to `StaticFiles`, e.g. `StaticFiles(directory='static',
      packages=['bootstrap4'])`, and mount it. It looks for a `statics` directory in each package;
      give a tuple such as `('bootstrap4', 'static')` to use another directory.
    facts:
    - StaticFiles takes a packages argument listing Python packages
    - by default it looks for a statics directory in each package
    - a tuple of package and directory name changes that directory

- name: 'starlette 0.27.0: Why does a ContextVar I set in my endpoint have the old value when my BaseHTTPMiddleware reads it?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'Why does a ContextVar I set in my endpoint have the old value when my BaseHTTPMiddleware reads it?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/middleware.md, heading_path: [BaseHTTPMiddleware, Limitations]}
    reference: >-
      It is a known limitation: `BaseHTTPMiddleware` prevents changes to context variables from
      propagating upwards, so a value set in the endpoint is not seen by the middleware. Use pure
      ASGI middleware instead.
    facts:
    - BaseHTTPMiddleware prevents ContextVar changes from propagating upwards
    - a value set in the endpoint is not visible in the middleware
    - pure ASGI middleware avoids the limitation

- name: 'starlette 0.27.0: What is the difference between raising HTTPException and an unexpected error in Starlette?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'What is the difference between raising HTTPException and an unexpected error in Starlette?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/exceptions.md, heading_path: [Errors and handled exceptions]}
    reference: >-
      `HTTPException` is a handled exception: it is turned into a normal HTTP response that goes back
      through the middleware stack. Any other exception is an error that should bubble up through the
      whole stack to the server; the 500 / `Exception` handler deals with it.
    facts:
    - handled exceptions are coerced into HTTP responses sent through the middleware stack
    - other exceptions are errors that bubble through the entire middleware stack
    - errors are handled by the 500 or Exception handler

- name: 'starlette 0.27.0: Can I keep request-specific flags as attributes on my ASGI middleware object?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'Can I keep request-specific flags as attributes on my ASGI middleware object?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/middleware.md, heading_path: [Pure ASGI Middleware, Gotchas, ASGI middleware should be stateless]}
    reference: >-
      No. ASGI handles requests concurrently, so connection-specific state must be scoped to the
      `__call__` implementation; storing it on the instance leads to conflicting reads and writes
      across requests.
    facts:
    - ASGI middleware should be stateless
    - connection-specific state belongs inside __call__
    - instance state conflicts across concurrent requests

- name: 'starlette 0.27.0: Why wrap my SECRET_KEY setting in Secret, and how do I get the real value back?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'Why wrap my SECRET_KEY setting in Secret, and how do I get the real value back?'
  metadata: {kind: conceptual}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/config.md, heading_path: [Secrets]}
    reference: >-
      `Secret` hides the value (its repr is `Secret('**********')`) so it is less likely to leak
      into tracebacks or introspection. Cast it with `str()` to get the value, only where it is used.
    facts:
    - Secret helps keep the value out of tracebacks and introspection
    - its repr masks the value
    - str() returns the real value

- name: 'starlette 0.27.0: Are on_startup and on_shutdown still the recommended way to run setup code?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'Are on_startup and on_shutdown still the recommended way to run setup code?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/release-notes.md, heading_path: ['0.26.0', Deprecated]}
    - {version: '0.27.0', article: docs/lifespan.md, heading_path: []}
    reference: >-
      No. 0.26.0 deprecated the `on_startup` and `on_shutdown` events; the lifespan handler (an
      async context manager passed as `lifespan=`) replaces them.
    facts:
    - on_startup and on_shutdown were deprecated in 0.26.0
    - the lifespan handler is the replacement

- name: 'starlette 0.27.0: What security problem does upgrading to 0.27.0 fix?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'What security problem does upgrading to 0.27.0 fix?'
  metadata: {kind: version-change}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/release-notes.md, heading_path: ['0.27.0']}
    - {version: '0.27.0', article: docs/release-notes.md, heading_path: ['0.27.0', Fixed]}
    reference: >-
      0.27.0 fixes a path traversal vulnerability in `StaticFiles` (advisory GHSA-v5gw-mw7f-84px),
      by replacing `commonprefix` with `commonpath`.
    facts:
    - 0.27.0 fixes a path traversal vulnerability
    - the vulnerability is in StaticFiles
    - commonprefix was replaced by commonpath

- name: 'starlette 0.27.0: In a Jinja template, how do I link to a CSS file served by a mounted StaticFiles app?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'In a Jinja template, how do I link to a CSS file served by a mounted StaticFiles app?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/templates.md, heading_path: []}
    - {version: '0.27.0', article: docs/routing.md, heading_path: [Reverse URL lookups]}
    reference: >-
      Mount `StaticFiles` with a name, e.g. `Mount("/static", app=StaticFiles(directory="static"),
      name="static")`. The template context includes `url_for`, so the template writes
      `{{ url_for('static', path='/css/base.css') }}`.
    facts:
    - the StaticFiles mount needs a name
    - the Jinja2 template context includes url_for automatically
    - mounted apps take a path argument in url_for

- name: 'starlette 0.27.0: How do I require an auth scope on a websocket route, and what status does a denied client get?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'How do I require an auth scope on a websocket route, and what status does a denied client get?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/authentication.md, heading_path: [Permissions]}
    - {version: '0.27.0', article: docs/routing.md, heading_path: [WebSocket Routing]}
    reference: >-
      Decorate the websocket endpoint with `@requires(...)` and register it with `WebSocketRoute`.
      `status_code` is not supported for websockets: a denied client always gets 403.
    facts:
    - websocket endpoints are registered with WebSocketRoute
    - the requires decorator enforces the scopes
    - status_code is not supported for websockets, 403 is always used

- name: 'starlette 0.27.0: Where do I connect and disconnect the databases package so queries work in my endpoints?'
  inputs:
    project: starlette
    version: '0.27.0'
    query: 'Where do I connect and disconnect the databases package so queries work in my endpoints?'
  metadata: {kind: cross-page}
  expected_output:
    hits:
    - {version: '0.27.0', article: docs/database.md, heading_path: []}
    - {version: '0.27.0', article: docs/lifespan.md, heading_path: []}
    reference: >-
      In the lifespan: `await database.connect()` before `yield` and `await database.disconnect()`
      after it, passed as `Starlette(lifespan=lifespan)`. Starlette serves no request until the
      lifespan has started.
    facts:
    - database.connect() runs in the lifespan before the yield
    - database.disconnect() runs after the yield
    - no request is served until the lifespan has run

