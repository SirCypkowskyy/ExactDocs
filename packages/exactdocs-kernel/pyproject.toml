[project]
name = "exactdocs-kernel"
dynamic = ["version"]
description = "Shared kernel for ExactDocs domains: framework-free building blocks every domain may import."
readme = "README.md"
license = "Apache-2.0"
# A copy of the repository's LICENSE (PEP 639 allows no path outside the package), so the wheel
# and the sdist carry it; packages/exactdocs/tests/ci/test_licenses.py keeps
# the copies equal.
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Cyprian Gburek" }]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/SirCypkowskyy/ExactDocs"

[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.11"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/exactdocs_kernel"]
