name: Grounded Docs benchmark

# Manual only, never on a push or a pull request: Grounded Docs (arabold/docs-mcp-server, a pinned
# npm release) indexes the golden corpus and answers the golden set, scored with the text scorer
# next to ExactDocs' BM25 (docs/evals/grounded-docs.md, `just grounded-bench`). It downloads the
# package from npm, the corpus from GitHub and the embedding model from Hugging Face, calls no
# hosted model and needs no secret. About half an hour on 4 CPUs, most of it embedding the corpus
# for the vector configuration; `--configs full-text` takes a few minutes.

on:
  workflow_dispatch:
    inputs:
      args:
        description: Extra arguments (e.g. --configs full-text, --projects starlette)
        required: false
        default: ""

concurrency:
  group: grounded-bench
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

# Runner: GitHub-hosted amd64, the platform of the recorded run (docs/releasing/runners.md "CI/CD and
# runners").
jobs:
  bench:
    name: Grounded Docs on the golden set
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXACTDOCS_MODELS_DIR: ${{ github.workspace }}/.models
      EXTRA_ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: grounded-bench-models-${{ hashFiles('packages/exactdocs/evals/retrieval_eval/grounded_docs.py') }}
      - name: Pull the embedding model (skipped when the cache has it)
        run: uv run exactdocs models pull BAAI/bge-small-en-v1.5
      - name: Grounded Docs benchmark (just grounded-bench)
        run: |
          # shellcheck disable=SC2086 # EXTRA_ARGS is a list of arguments
          uv run python packages/exactdocs/evals/run_grounded_bench.py \
            --home "$RUNNER_TEMP/grounded-docs" --out reports/evals $EXTRA_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: grounded-bench
          path: reports/evals/
          retention-days: 30
