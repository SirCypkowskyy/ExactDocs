name: Eval

# The full retrieval eval that used to run on every release, started by hand: the model-free
# gates (also in release.yml), the eval suite end to end (pytest -m eval), the ingestion and
# retrieval benchmarks against the recorded runs, and hybrid and rerank on the default local
# models (report-only). Run it before a release that touches retrieval or chunking:
#   gh workflow run eval.yml --ref develop

on:
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: Retrieval eval
    runs-on: [self-hosted, linux, ARM64, exactdocs, gcp]
    # On the self-hosted runner in both modes: the heaviest job, and nothing in it needs x86. The
    # gating steps take about 10 minutes on a 2-4 core runner, the report-only local models most
    # of the rest.
    timeout-minutes: 75
    services:
      postgres:
        image: paradedb/paradedb:0.26.3-pg17@sha256:950f68abebc78e28fd2ecfc8ed915aa29d07b5dd8cba25b2f513ca4e211dda70
        env:
          POSTGRES_USER: exactdocs
          POSTGRES_PASSWORD: exactdocs-release
          POSTGRES_DB: exactdocs
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U exactdocs -d exactdocs"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Retrieval eval (BM25 gating, hybrid on term-hash)
        run: >-
          uv run python packages/exactdocs/evals/run_retrieval_eval.py
          --offline-embedding --ratchet --report reports/evals/retrieval.json
      # A database of its own with the extension, so the app chooses pg_search at start as a
      # ParadeDB deployment does; --expect-engine fails the step if it fell back to PostgreSQL
      # full-text search instead.
      - name: Retrieval eval on pg_search (BM25, gating)
        env:
          ADMIN_URL: postgresql://exactdocs:exactdocs-release@127.0.0.1:${{ job.services.postgres.ports['5432'] }}
          EXACTDOCS_SECRET_KEY: eval-only-secret-key-0123456789abcdefgh
        run: |
          uv run python - <<'PY'
          import os
          import psycopg
          admin = os.environ["ADMIN_URL"]
          with psycopg.connect(f"{admin}/exactdocs", autocommit=True) as connection:
              connection.execute("CREATE DATABASE exactdocs_eval")
          with psycopg.connect(f"{admin}/exactdocs_eval", autocommit=True) as connection:
              connection.execute("CREATE EXTENSION IF NOT EXISTS pg_search CASCADE")
          PY
          EXACTDOCS_DATABASE_URL="${ADMIN_URL/postgresql:/postgresql+psycopg:}/exactdocs_eval" \
            uv run python packages/exactdocs/evals/run_retrieval_eval.py \
            --expect-engine pg_search --report reports/evals/retrieval-pg-search.json
      - name: The suite end to end (pytest -m eval)
        run: uv run pytest -m eval packages/exactdocs/tests/evals --junitxml=reports/pytest-eval.xml
      # Fetches the golden corpus (each pinned commit, --depth 1, about 65 MB), imports it with
      # every chunking configuration and fails when one measures worse than the recorded run in
      # packages/exactdocs/evals/results/ (docs/evals/ingestion.md). No model.
      - name: Ingestion benchmark (model-free, against the recorded run)
        run: >-
          uv run python packages/exactdocs/evals/run_ingestion_bench.py --check
          --out reports/evals
      # BM25 on the golden set at the default chunking, through the retrieval benchmark: fails on
      # a wrong version or when recall@5 or nDCG@10 drops more than 2 points below the recorded
      # run (docs/evals/retrieval-benchmark.md). No model; about a minute.
      - name: Retrieval benchmark (BM25, model-free, against the recorded run)
        run: >-
          uv run python packages/exactdocs/evals/run_retrieval_bench.py --configs bm25
          --chunkings default --check --out reports/evals/retrieval-bench
      # Report-only from here (continue-on-error): a failed pull or a model's numbers never stop
      # the release; a wrong version (rate above 0) still shows as a failed step. The models are
      # cached between releases under a key named after the pinned revisions, so a new pin gets a
      # new cache and a warm run contacts no Hub. A mode becomes a default only when it beats
      # BM25's recall@5 by 5 points with no wrong version (`default-eligible` in the summary).
      - name: Use the default local models from here on
        run: |
          {
            echo "EXACTDOCS_MODELS_DIR=$GITHUB_WORKSPACE/.models"
            echo "EXACTDOCS_TEST_MODELS_DIR=$GITHUB_WORKSPACE/.models"
            echo "EXACTDOCS_AI__PROVIDERS__LOCAL__KIND=local"
            echo "EXACTDOCS_AI__EMBEDDING__MODEL=local:BAAI/bge-small-en-v1.5"
          } >> "$GITHUB_ENV"
      - name: Name the models cache after the pinned revisions
        id: models-key
        run: >-
          uv run python -c "from exactdocs.bootstrap.constants import PINNED_MODEL_REVISIONS as p;
          print('key=local-models-' + '-'.join(m.replace('/', '_') + '@' + r[:12] for m, r in
          sorted(p.items())))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: ${{ steps.models-key.outputs.key }}
      - name: Pull the default models (skipped when the cache has them)
        continue-on-error: true
        run: uv run exactdocs models pull
      - name: The default models embed and rerank with sockets blocked
        continue-on-error: true
        run: uv run pytest --integration -p no:cacheprovider packages/exactdocs/tests/bootstrap/test_local_models_real.py
      - name: Retrieval eval, hybrid on bge-small (local embedding, report-only)
        continue-on-error: true
        run: >-
          uv run python packages/exactdocs/evals/run_retrieval_eval.py
          --configured-models --local-roles embedding --modes bm25,hybrid
          --report reports/evals/local-hybrid.json
      # On a runner's CPU 32 long candidates can take more than the 2 s default, so the timeout is
      # raised: a reranker that timed out would not be measured (`rerank_fallbacks` must be 0).
      - name: Retrieval eval, reranked by MiniLM (local reranker, report-only)
        continue-on-error: true
        env:
          EXACTDOCS_AI__RERANKER__MODEL: local:Xenova/ms-marco-MiniLM-L-6-v2
          EXACTDOCS_AI__RERANKER__TIMEOUT: "30"
        run: >-
          uv run python packages/exactdocs/evals/run_retrieval_eval.py
          --configured-models --local-roles embedding,reranker --modes bm25,hybrid
          --report reports/evals/local-rerank.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: retrieval-eval
          path: reports/
          retention-days: 30
