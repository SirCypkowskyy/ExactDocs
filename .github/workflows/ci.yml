name: CI

# Pull requests and pushes run the fast checks only (#507), as parallel jobs with no service
# container and no image build: lint and types, the pytest suite in shards, the behave scenarios
# that need no service, and the web client. "Python (ruff, ty, pytest, behave)" waits for the
# Python jobs and fails if one did, so branch protection keeps its required check.
#
# The integration and end-to-end jobs (service containers, Docker images, uvx and the browser
# test) are in integration.yml. They run on a pull request labelled `run integration`, on a manual
# run of this workflow with the input `integration`, and in every release (docs/releasing.md).
#
# Runners (docs/releasing.md "CI/CD and runners"), switched by the repository variable RUNNER_MODE
# (Settings -> Secrets and variables -> Actions -> Variables):
#   hybrid (default, also when unset): every job on GitHub-hosted ubuntu-24.04 (amd64).
#   self-hosted (when the GitHub-hosted minutes ran out): every job on the self-hosted ARM64
#     runner [self-hosted, linux, ARM64, exactdocs], with fewer shards (pytest two instead of six,
#     behave one instead of three): there are two runners.
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      integration:
        description: Also run the integration jobs (service containers, Docker images, uvx and the browser test)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint (ruff, ty, hadolint)
    runs-on: ${{ vars.RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","exactdocs"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ty
        run: uv run ty check --output-format=github
      # Lints the Dockerfile; no image is built.
      - name: hadolint
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" \
            hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e \
            < deploy/Dockerfile

  # The suite without the integration tests (deselected by default: tests/fixtures/integration.py),
  # split by pytest-split into groups of about the same time, from the durations recorded in
  # .test_durations (refresh it: docs/releasing.md "Fast and integration tests"). Each shard writes
  # its coverage data; the `python` job combines them.
  pytest:
    name: pytest (${{ matrix.group }}/${{ strategy.job-total }})
    runs-on: ${{ vars.RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","exactdocs"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(vars.RUNNER_MODE == 'self-hosted' && '[1, 2]' || '[1, 2, 3, 4, 5, 6]') }}
    # Every service variable names a port where nothing listens: a test that needs a service but
    # lacks the `integration` marker fails here, at once, instead of passing by skipping.
    env:
      EXACTDOCS_TEST_POSTGRES_URL: postgresql://exactdocs:unused@127.0.0.1:9/exactdocs
      EXACTDOCS_TEST_PG_SEARCH: "1"
      EXACTDOCS_TEST_PGBOUNCER_URL: postgresql://exactdocs:unused@127.0.0.1:9/exactdocs
      EXACTDOCS_TEST_SUPABASE_URL: postgresql://postgres:unused@127.0.0.1:9/postgres
      EXACTDOCS_TEST_LIBSQL_DATABASE_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_LIBSQL_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_QDRANT_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_ELASTICSEARCH_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_OPENSEARCH_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_CHROMA_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_REDIS_URL: redis://127.0.0.1:9
      EXACTDOCS_TEST_MILVUS_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_MONGODB_URL: mongodb://127.0.0.1:9/?directConnection=true
      EXACTDOCS_TEST_PINECONE_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_AZURE_SEARCH_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_MODELS_DIR: /nonexistent/models
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: pytest (unit, architecture, adapters on SQLite and the embedded backends)
        env:
          COVERAGE_FILE: reports/coverage/.coverage.${{ matrix.group }}
        run: >-
          uv run pytest --splits ${{ strategy.job-total }} --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --cov=exactdocs --cov=exactdocs_kernel --cov-report=
          --junitxml=reports/pytest-${{ matrix.group }}.xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pytest-${{ matrix.group }}
          path: reports/
          include-hidden-files: true # the coverage data file
          retention-days: 3

  # The scenarios that need no service (the @integration ones are left out: features/environment.py),
  # the feature files in groups of about the same time (deploy/behave_shards.py, by the times in
  # .behave_durations; refresh them with `just bdd-durations`).
  behave:
    name: behave (${{ matrix.group }}/${{ strategy.job-total }})
    runs-on: ${{ vars.RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","exactdocs"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(vars.RUNNER_MODE == 'self-hosted' && '[1]' || '[1, 2, 3]') }}
    env:
      EXACTDOCS_TEST_POSTGRES_URL: postgresql://exactdocs:unused@127.0.0.1:9/exactdocs
      EXACTDOCS_TEST_PG_SEARCH: "1"
      EXACTDOCS_TEST_PGBOUNCER_URL: postgresql://exactdocs:unused@127.0.0.1:9/exactdocs
      EXACTDOCS_TEST_SUPABASE_URL: postgresql://postgres:unused@127.0.0.1:9/postgres
      EXACTDOCS_TEST_LIBSQL_DATABASE_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_LIBSQL_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_QDRANT_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_ELASTICSEARCH_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_OPENSEARCH_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_CHROMA_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_REDIS_URL: redis://127.0.0.1:9
      EXACTDOCS_TEST_MILVUS_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_MONGODB_URL: mongodb://127.0.0.1:9/?directConnection=true
      EXACTDOCS_TEST_PINECONE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: behave (acceptance)
        run: |
          mapfile -t features < <(python3 deploy/behave_shards.py --splits ${{ strategy.job-total }} --group ${{ matrix.group }})
          [ "${#features[@]}" -gt 0 ] || { echo "::error::no feature file in this group"; exit 1; }
          echo "${#features[@]} feature files"
          uv run behave --format=progress --junit --junit-directory=reports/behave "${features[@]}"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: behave-${{ matrix.group }}
          path: reports/
          retention-days: 3

  # The required check (branch protection): waits for the Python jobs, fails unless every one
  # passed, and combines the shards' coverage into one report.
  python:
    name: Python (ruff, ty, pytest, behave)
    needs: [lint, pytest, behave]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","exactdocs"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # the sources the coverage report names
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
      - uses: actions/download-artifact@v8
        with:
          pattern: pytest-*
          path: reports
          merge-multiple: true
      # coverage at the version uv.lock pins, on the project's Python (it parses the sources),
      # without installing the project.
      - name: Coverage, all shards combined
        if: ${{ needs.pytest.result == 'success' }}
        env:
          COVERAGE_FILE: reports/coverage/.coverage
        run: |
          version=$(uv export --frozen --all-groups --no-hashes | sed -n 's/^coverage==\([^ ;]*\).*/\1/p')
          coverage=(uvx --python "$(cat .python-version)" "coverage==$version")
          "${coverage[@]}" combine --keep reports/coverage
          "${coverage[@]}" report --show-missing --skip-covered
          "${coverage[@]}" report --format=total | xargs printf 'Total coverage: %s%%\n' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: python-reports
          path: reports/
          include-hidden-files: true
          retention-days: 14
      - name: Every Python job passed
        if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null \
            || { echo "::error::a Python job did not pass (above)"; exit 1; }

  web:
    name: Web (biome, fallow, react-doctor, vitest, build)
    runs-on: ${{ vars.RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","exactdocs"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date with web/openapi.json
        run: |
          pnpm gen:api
          git diff --exit-code -- src/shared/lib/api-schema.d.ts \
            || { echo "::error::run 'just api' and commit web/openapi.json and the types"; exit 1; }
      - name: Biome (CI mode, GitHub annotations)
        run: pnpm exec biome ci .
      - run: pnpm lint:arch
      - run: pnpm lint:dead
      - run: pnpm lint:react
      - run: pnpm test
      - run: pnpm build

  # A manual run with the input `integration`: the integration and end-to-end jobs too.
  integration:
    name: Integration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.integration }}
    uses: ./.github/workflows/integration.yml
