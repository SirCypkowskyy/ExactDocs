name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  python:
    name: Python (ruff, ty, pytest, behave)
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ty
        run: uv run ty check --output-format=github
      - name: pytest (unit, integration, architecture)
        run: uv run pytest --cov=exactdocs --cov=exactdocs_kernel --cov-report=term-missing --junitxml=reports/pytest.xml
      - name: behave (acceptance)
        run: uv run behave --format=progress --junit --junit-directory=reports/behave
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: python-reports
          path: reports/
          retention-days: 14

  web:
    name: Web (biome, fallow, react-doctor, vitest, build)
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date with web/openapi.json
        run: |
          pnpm gen:api
          git diff --exit-code -- src/shared/lib/api-schema.d.ts \
            || { echo "::error::run 'just api' and commit web/openapi.json and the types"; exit 1; }
      - name: Biome (CI mode, GitHub annotations)
        run: pnpm exec biome ci .
      - run: pnpm lint:arch
      - run: pnpm lint:dead
      - run: pnpm lint:react
      - run: pnpm test
      - run: pnpm build

  image:
    name: Docker image (native build + smoke test)
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: exactdocs:ci
          build-args: VERSION=0.0.0.dev0
          cache-from: type=gha,scope=exactdocs
          cache-to: type=gha,scope=exactdocs,mode=max
      - name: Smoke test
        run: |
          docker run -d --rm --name exactdocs-ci -p 127.0.0.1::3000 exactdocs:ci
          trap 'docker logs exactdocs-ci; docker stop exactdocs-ci' EXIT
          port=$(docker port exactdocs-ci 3000/tcp | head -n1 | cut -d: -f2)
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:${port}/api/health" && break; sleep 1; done
          # a fresh instance offers only the setup: everything else is refused until it is done
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/api/v1/libraries")" = 403
          curl -fsS -H 'content-type: application/json' -d '{"username":"ci","password":"ci smoke test password"}' "http://127.0.0.1:${port}/api/v1/setup"
          curl -fsS "http://127.0.0.1:${port}/api/v1/libraries"
          curl -fsS "http://127.0.0.1:${port}/" | grep -qi '<div id="root"'
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          mcp=(-H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$init")
          test "$(curl -s -o /dev/null -w '%{http_code}' "${mcp[@]}" "http://127.0.0.1:${port}/mcp")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "${mcp[@]}" "http://127.0.0.1:${port}/mcp/")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' "${mcp[@]}" "http://127.0.0.1:${port}/mcp")" = 400
