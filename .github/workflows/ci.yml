name: CI

# Pull requests and pushes run the fast checks only (#507), as parallel jobs with no service
# container and no image build: lint and types, the pytest suite in shards, the behave scenarios
# that need no service, the coding tasks' reference check, and the web client. "Python (ruff, ty,
# pytest, behave)" waits for the Python jobs and fails if one did, so branch protection keeps its
# required check.
#
# The integration and end-to-end jobs (service containers, Docker images, uvx and the browser
# test) are in integration.yml. No pull request or push runs them (#554): only a manual run of
# this workflow with the input `integration` (job `integration`), a manual run of Integration
# itself, or a release dry run with `integration` (docs/releasing/tests.md "Fast and integration tests").
#
# Runners (docs/releasing/runners.md "CI/CD and runners"), switched by the repository variable RUNNER_MODE
# (Settings -> Secrets and variables -> Actions -> Variables):
#   hybrid (default, also when unset): every job on GitHub-hosted ubuntu-24.04 (amd64).
#   self-hosted (the current setting: docs/decisions/ci-runners.md): every job on our GCP
#     self-hosted ARM64 runners [self-hosted, linux, ARM64, exactdocs, gcp], with fewer shards
#     (pytest three instead of six, behave two instead of three): there are eight 2-vCPU runners.
#   A pull request from a fork always runs on GitHub-hosted runners, whatever RUNNER_MODE says: a
#   fork's code never reaches the self-hosted machines through these jobs. (A fork can still edit
#   runs-on in its own copy, so approval for outside contributors stays on in the settings.)
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      integration:
        description: Also run the integration jobs (service containers, Docker images, uvx and the browser test)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint (ruff, ty, hadolint)
    runs-on: ${{ (vars.RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ty
        run: uv run ty check --output-format=github
      # Lints the Dockerfile; no image is built.
      - name: hadolint
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" \
            hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e \
            < deploy/Dockerfile

  # The suite without the integration tests (deselected by default: tests/fixtures/integration.py),
  # split by pytest-split into groups of about the same time, from the durations recorded in
  # .test_durations (refresh it: docs/releasing/tests.md "Fast and integration tests"). Each shard writes
  # its coverage data; the `python` job combines them.
  pytest:
    name: pytest (${{ matrix.group }}/${{ strategy.job-total }})
    runs-on: ${{ (vars.RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    # About 6 minutes each of six on GitHub-hosted runners; about 20 each of three on the 2-vCPU GCP runners.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON((vars.RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && '[1, 2, 3]' || '[1, 2, 3, 4, 5, 6]') }}
    # Every service variable names a port where nothing listens: a test that needs a service but
    # lacks the `integration` marker fails here, at once, instead of passing by skipping.
    env:
      EXACTDOCS_TEST_POSTGRES_URL: postgresql://exactdocs:unused@127.0.0.1:9/exactdocs
      EXACTDOCS_TEST_PG_SEARCH: "1"
      EXACTDOCS_TEST_PGBOUNCER_URL: postgresql://exactdocs:unused@127.0.0.1:9/exactdocs
      EXACTDOCS_TEST_SUPABASE_URL: postgresql://postgres:unused@127.0.0.1:9/postgres
      EXACTDOCS_TEST_LIBSQL_DATABASE_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_LIBSQL_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_QDRANT_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_ELASTICSEARCH_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_OPENSEARCH_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_CHROMA_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_REDIS_URL: redis://127.0.0.1:9
      EXACTDOCS_TEST_MILVUS_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_MONGODB_URL: mongodb://127.0.0.1:9/?directConnection=true
      EXACTDOCS_TEST_PINECONE_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_AZURE_SEARCH_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_MODELS_DIR: /nonexistent/models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: pytest (unit, architecture, adapters on SQLite and the embedded backends)
        env:
          COVERAGE_FILE: reports/coverage/.coverage.${{ matrix.group }}
        run: >-
          uv run pytest --splits ${{ strategy.job-total }} --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --cov=exactdocs --cov=exactdocs_kernel --cov-report=
          --junitxml=reports/pytest-${{ matrix.group }}.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: pytest-${{ matrix.group }}
          path: reports/
          include-hidden-files: true # the coverage data file
          retention-days: 3

  # The scenarios that need no service (the @integration ones are left out: features/environment.py),
  # the feature files in groups of about the same time (deploy/behave_shards.py, by the times in
  # .behave_durations; refresh them with `just bdd-durations`).
  behave:
    name: behave (${{ matrix.group }}/${{ strategy.job-total }})
    runs-on: ${{ (vars.RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    # About 7 minutes each of three on GitHub-hosted runners; about 18 each of two on the GCP runners.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON((vars.RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && '[1, 2]' || '[1, 2, 3]') }}
    env:
      EXACTDOCS_TEST_POSTGRES_URL: postgresql://exactdocs:unused@127.0.0.1:9/exactdocs
      EXACTDOCS_TEST_PG_SEARCH: "1"
      EXACTDOCS_TEST_PGBOUNCER_URL: postgresql://exactdocs:unused@127.0.0.1:9/exactdocs
      EXACTDOCS_TEST_SUPABASE_URL: postgresql://postgres:unused@127.0.0.1:9/postgres
      EXACTDOCS_TEST_LIBSQL_DATABASE_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_LIBSQL_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_QDRANT_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_ELASTICSEARCH_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_OPENSEARCH_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_CHROMA_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_REDIS_URL: redis://127.0.0.1:9
      EXACTDOCS_TEST_MILVUS_URL: http://127.0.0.1:9
      EXACTDOCS_TEST_MONGODB_URL: mongodb://127.0.0.1:9/?directConnection=true
      EXACTDOCS_TEST_PINECONE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: behave (acceptance)
        run: |
          mapfile -t features < <(python3 deploy/behave_shards.py --splits ${{ strategy.job-total }} --group ${{ matrix.group }})
          [ "${#features[@]}" -gt 0 ] || { echo "::error::no feature file in this group"; exit 1; }
          echo "${#features[@]} feature files"
          uv run behave --format=progress --junit --junit-directory=reports/behave "${features[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: behave-${{ matrix.group }}
          path: reports/
          retention-days: 3

  # The version-pinned coding tasks (#496, docs/evals/coding-tasks.md): every task's
  # reference solution passes its hidden tests on the version the task pins, and every solution
  # written for the other version fails and names an API the pinned version lacks. No model. The
  # pinned environments are installed from their lockfiles (uv with hashes, npm ci) into a cache
  # keyed by the lockfiles; the tests run in the process sandbox (no network where the runner can
  # make a network namespace, CPU, memory and time limits).
  coding-tasks:
    name: Coding tasks (references pass, other versions fail)
    runs-on: ${{ (vars.RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/exactdocs/coding-tasks/environments
          key: coding-tasks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/exactdocs/evals/coding/environments/**') }}
      - name: Check the coding tasks (just coding-tasks check)
        run: uv run python packages/exactdocs/evals/run_coding_tasks.py check --concurrency 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coding-tasks-check
          path: reports/evals/coding-tasks-check.*
          retention-days: 14

  # The required check (branch protection): waits for the Python jobs, fails unless every one
  # passed, and combines the shards' coverage into one report.
  python:
    name: Python (ruff, ty, pytest, behave)
    needs: [lint, pytest, behave, coding-tasks]
    if: ${{ !cancelled() }}
    runs-on: ${{ (vars.RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      # The sources the coverage report names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pytest-*
          path: reports
          merge-multiple: true
      # coverage at the version uv.lock pins, on the project's Python (it parses the sources),
      # without installing the project.
      - name: Coverage, all shards combined
        if: ${{ needs.pytest.result == 'success' }}
        env:
          COVERAGE_FILE: reports/coverage/.coverage
        run: |
          version=$(uv export --frozen --all-groups --no-hashes | sed -n 's/^coverage==\([^ ;]*\).*/\1/p')
          coverage=(uvx --python "$(cat .python-version)" "coverage==$version")
          "${coverage[@]}" combine --keep reports/coverage
          "${coverage[@]}" report --show-missing --skip-covered
          "${coverage[@]}" report --format=total | xargs printf 'Total coverage: %s%%\n' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: python-reports
          path: reports/
          include-hidden-files: true
          retention-days: 14
      - name: Every Python job passed
        if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null \
            || { echo "::error::a Python job did not pass (above)"; exit 1; }

  web:
    name: Web (biome, fallow, react-doctor, vitest, build)
    runs-on: ${{ (vars.RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date with web/openapi.json
        run: |
          pnpm gen:api
          git diff --exit-code -- src/shared/lib/api-schema.d.ts \
            || { echo "::error::run 'just api' and commit web/openapi.json and the types"; exit 1; }
      - name: Biome (CI mode, GitHub annotations)
        run: pnpm exec biome ci .
      - run: pnpm lint:arch
      - run: pnpm lint:dead
      - run: pnpm lint:react
      - run: pnpm test
      - run: pnpm build

  # A manual run with the input `integration`: the integration and end-to-end jobs too. Never on a
  # pull request or a push.
  integration:
    name: Integration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.integration }}
    uses: ./.github/workflows/integration.yml
