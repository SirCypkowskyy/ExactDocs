name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  python:
    name: Python (ruff, ty, pytest, behave)
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ty
        run: uv run ty check --output-format=github
      - name: pytest (unit, integration, architecture)
        run: uv run pytest --cov=exactdocs --cov=exactdocs_kernel --cov-report=term-missing --junitxml=reports/pytest.xml
      - name: behave (acceptance)
        run: uv run behave --format=progress --junit --junit-directory=reports/behave
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: python-reports
          path: reports/
          retention-days: 14

  web:
    name: Web (biome, fallow, react-doctor, vitest, build)
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date with web/openapi.json
        run: |
          pnpm gen:api
          git diff --exit-code -- src/shared/lib/api-schema.d.ts \
            || { echo "::error::run 'just api' and commit web/openapi.json and the types"; exit 1; }
      - name: Biome (CI mode, GitHub annotations)
        run: pnpm exec biome ci .
      - run: pnpm lint:arch
      - run: pnpm lint:dead
      - run: pnpm lint:react
      - run: pnpm test
      - run: pnpm build

  image:
    name: Docker image (lint, build, scan, smoke test)
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: hadolint
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" \
            hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e \
            < deploy/Dockerfile
      # The runners are persistent VMs, so the daemon's own BuildKit (driver "docker") keeps layers
      # and cache mounts between jobs: no remote cache to export or restore. (The default
      # docker-container driver is deleted at the end of every job.) Each VM has its own cache.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - id: created
        run: |
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: exactdocs:ci
          build-args: |
            VERSION=0.0.0.dev0
            REVISION=${{ github.sha }}
            CREATED=${{ steps.created.outputs.at }}
            DEBIAN_REFRESH=${{ steps.created.outputs.week }}
      # Fails on a fixable CRITICAL/HIGH finding; accepted ones are in .trivyignore (docs/releasing.md).
      - name: Trivy scan
        uses: ./.github/actions/trivy-gate
        with:
          image: exactdocs:ci
      # RUN-02: size budgets and no model weights (budgets and reasoning: docs/releasing.md).
      - name: Image size budget and no model files
        run: python3 deploy/check_artifacts.py image exactdocs:ci
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
      - name: Wheel size budget, no model files, no ML dependencies
        run: |
          docker create --name exactdocs-wheel exactdocs:ci >/dev/null
          docker cp exactdocs-wheel:/app/.venv/lib/python3.14/site-packages/exactdocs/_web packages/exactdocs/src/exactdocs/_web
          docker rm exactdocs-wheel >/dev/null
          UV_DYNAMIC_VERSIONING_BYPASS=0.0.0.dev0 uv build --wheel --package exactdocs --out-dir "$RUNNER_TEMP/dist"
          python3 deploy/check_artifacts.py wheel "$RUNNER_TEMP"/dist/exactdocs-*.whl
      # Only the runtime-tools stage runs a command for the other architecture (apt, under QEMU);
      # build just that and prove the tools run there. No Python: it crashes under QEMU.
      - name: amd64 runtime-tools stage (QEMU) builds and runs git, ssh, tini
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          target: runtime-tools
          load: true
          tags: exactdocs:ci-amd64
          build-args: |
            VERSION=0.0.0.dev0
            REVISION=${{ github.sha }}
            CREATED=${{ steps.created.outputs.at }}
            DEBIAN_REFRESH=${{ steps.created.outputs.week }}
      - run: |
          for tool in "git --version" "ssh -V" "tini --version"; do
            docker run --rm --platform linux/amd64 --entrypoint ${tool%% *} exactdocs:ci-amd64 ${tool#* }
          done
      - name: Build a fixture docs repository
        run: python3 packages/exactdocs/tests/fixtures/fixture_repo.py "$RUNNER_TEMP/fixture-repo"
      - name: Smoke test (read-only rootfs, no capabilities)
        run: |
          flags=(--read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges)
          docker run -d --rm --name exactdocs-ci "${flags[@]}" -p 127.0.0.1::3000 exactdocs:ci
          trap 'docker logs exactdocs-ci; docker stop exactdocs-ci' EXIT
          port=$(docker port exactdocs-ci 3000/tcp | head -n1 | cut -d: -f2)
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:${port}/api/health" && break; sleep 1; done
          # a fresh instance offers only the setup: everything else is refused until it is done
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/api/v1/libraries")" = 403
          creds='{"username":"ci","password":"ci smoke test password"}'
          curl -fsS -H 'content-type: application/json' -d "$creds" "http://127.0.0.1:${port}/api/v1/setup"
          # setup does not sign in: the API refuses an anonymous caller, a signed-in one gets through
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/api/v1/libraries")" = 401
          curl -fsS -c jar.txt -H 'content-type: application/json' -d "$creds" "http://127.0.0.1:${port}/api/v1/session"
          curl -fsS -b jar.txt "http://127.0.0.1:${port}/api/v1/libraries"
          curl -fsS "http://127.0.0.1:${port}/" | grep -qi '<div id="root"'
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          mcp=(-H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$init")
          # MCP wants an API token; a revoked one is refused again
          test "$(curl -s -o /dev/null -w '%{http_code}' "${mcp[@]}" "http://127.0.0.1:${port}/mcp")" = 401
          created=$(curl -fsS -b jar.txt -H 'content-type: application/json' -d '{"name":"ci"}' "http://127.0.0.1:${port}/api/v1/tokens")
          token=$(echo "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          id=$(echo "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          auth=(-H "authorization: Bearer ${token}")
          test "$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "http://127.0.0.1:${port}/api/v1/libraries")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "${mcp[@]}" "http://127.0.0.1:${port}/mcp")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "${mcp[@]}" "http://127.0.0.1:${port}/mcp/")" = 200
          curl -fsS -b jar.txt -X DELETE "http://127.0.0.1:${port}/api/v1/tokens/${id}"
          test "$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "${mcp[@]}" "http://127.0.0.1:${port}/mcp")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' "${mcp[@]}" "http://127.0.0.1:${port}/mcp")" = 400
          # Hardening as built: unprivileged, tini is PID 1, no pip, no setuid files.
          test "$(docker exec exactdocs-ci id -u)" = 10001
          test "$(docker exec exactdocs-ci cat /proc/1/comm)" = tini
          docker exec exactdocs-ci sh -c '! command -v pip && test -z "$(find / -xdev -perm /6000 -type f 2>/dev/null)"'
          # What the importer needs: ssh, and git reading a repository over file://. The fixture is
          # owned by the runner user, so git needs safe.directory (the importer issue decides how).
          docker exec exactdocs-ci ssh -V
          docker run --rm "${flags[@]}" -v "$RUNNER_TEMP/fixture-repo:/fixture:ro" --entrypoint sh exactdocs:ci \
            -c 'git config --global safe.directory "*" && git ls-remote file:///fixture | grep -q refs/heads/'
