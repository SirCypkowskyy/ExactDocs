# Builds the Zensical site from docs/ and publishes it to GitHub Pages.
#
# Runners (docs/releasing.md "CI/CD and runners"), switched by the repository variable RUNNER_MODE
# (Settings -> Secrets and variables -> Actions -> Variables): GitHub-hosted ubuntu-24.04 in
# `hybrid` (the default, also when unset), the self-hosted ARM64 runner [self-hosted, linux, ARM64,
# exactdocs] in `self-hosted` (when the GitHub-hosted minutes ran out).
#   A pull request from a fork always runs on GitHub-hosted runners, whatever RUNNER_MODE says: a
#   fork's code never reaches the self-hosted machines through these jobs. (A fork can still edit
#   runs-on in its own copy, so approval for outside contributors stays on in the settings.)
name: Docs

on:
  # Deploys: a push to main that changes the published site, every stable release tag (a release
  # merges develop into main and tags it there, so the site always matches the latest release), and
  # a manual run (Actions -> Docs -> Run workflow) to retry a deploy that Pages did not finish.
  # Tag pushes ignore `paths`. Dev tags (v1.2.3.dev1) do not match the pattern, so develop's docs
  # are never published. A tag push (not `release: published`) is used because the release workflow
  # creates the GitHub Release with GITHUB_TOKEN, and such events start no other workflow.
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  # Pull requests also run for any Markdown file, so the Mermaid check covers README and the rest;
  # they only build, never deploy.
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "**/*.md"
      - "deploy/mermaid-check/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a PR cancels the PR's older build. Deploys share one group and never cancel each
# other: cancelling deploy-pages mid-flight can leave a Pages deployment stuck in `updating_pages`.
# A deploy that arrives while one runs waits for it (GitHub keeps the newest one waiting).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'docs-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ${{ (vars.RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","linux","ARM64","exactdocs"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: deploy/mermaid-check/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: deploy/mermaid-check/pnpm-lock.yaml
      - name: Every Mermaid diagram parses and no ASCII art is left (README, docs/, web/README.md, ...)
        run: |
          pnpm --dir deploy/mermaid-check install --frozen-lockfile
          pnpm --dir deploy/mermaid-check check
      - name: Build (strict mode, warnings and broken links fail)
        run: uv run --only-group docs zensical build --clean --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ (vars.RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted","linux","ARM64","exactdocs"]') || 'ubuntu-24.04' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # The v0.2.0 deploy (run 41889841633) built fine, then Pages stayed in `updating_pages`
          # past the default 10-minute timeout. Wait up to 30 minutes and tolerate a few failed
          # status polls before giving up; a timed-out deploy can be retried with workflow_dispatch.
          timeout: 1800000
          error_count: 10
          reporting_interval: 10000
