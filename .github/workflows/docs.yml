# Builds the Zensical site from docs/ and publishes it to GitHub Pages.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  # Pull requests also run for any Markdown file, so the Mermaid check covers README and the rest;
  # pushes to main only redeploy Pages when the published site changes.
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "**/*.md"
      - "deploy/mermaid-check/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: deploy/mermaid-check/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: deploy/mermaid-check/pnpm-lock.yaml
      - name: Every Mermaid diagram parses and no ASCII art is left (README, docs/, web/README.md, ...)
        run: |
          pnpm --dir deploy/mermaid-check install --frozen-lockfile
          pnpm --dir deploy/mermaid-check check
      - name: Build (strict mode, warnings and broken links fail)
        run: uv run --only-group docs zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
