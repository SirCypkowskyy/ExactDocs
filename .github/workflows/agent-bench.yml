name: Agent benchmark (real providers)

# Manual only: it calls hosted models with the repository's keys, so it never runs on a push or a
# pull request. It runs the agent benchmark (docs/evals/agent-bench.md,
# `just agent-bench run`): each agent model answers the golden set with each documentation arm
# (`none`: no tools; `exactdocs`: only the ExactDocs MCP tools, under each retrieval
# configuration; `context7`: only the official Context7 MCP server's, a pinned npm release;
# `grounded-docs`: only Grounded Docs' read-only tools, a pinned npm release over its own index of
# the pinned versions, built on the first run), and an LLM judge, blind to the arm, grades the
# answers.
#
# Agent and judge models are pydantic-ai model names (`ollama:<model>` for an Ollama server);
# their keys:
#
#   repository secrets     AGENT_BENCH_OPENAI_API_KEY, AGENT_BENCH_ANTHROPIC_API_KEY,
#                          AGENT_BENCH_GOOGLE_API_KEY, AGENT_BENCH_OLLAMA_API_KEY (each optional)
#   repository variables   AGENT_BENCH_OPENAI_BASE_URL (an OpenAI-compatible gateway; optional),
#                          AGENT_BENCH_OLLAMA_BASE_URL (https://ollama.com/v1 for Ollama Cloud)
#
# The server's own models (an embedding model in a retrieval configuration, `eval:<model>`) use
# the profile `eval` of the retrieval workflow (eval-providers.yml): the variables
# EVAL_PROVIDER_KIND, EVAL_PROVIDER_BASE_URL, EVAL_PROVIDER_API_VERSION and the secret
# EVAL_PROVIDER_API_KEY. The `context7` arm needs the repository secret CONTEXT7_API_KEY (the one
# the Context7 run of eval-providers.yml reads); no Context7 number is published until Upstash
# permits it (docs/evals/context7.md#terms-of-service). Blank values count as unset.

on:
  workflow_dispatch:
    inputs:
      agent_models:
        description: Agent models, comma-separated (e.g. openai:gpt-5-mini,anthropic:claude-sonnet-4-5)
        required: true
      judge_model:
        description: Judge model (e.g. openai:gpt-5)
        required: true
      arms:
        description: Documentation arms, comma-separated (none, exactdocs, context7, grounded-docs)
        required: false
        default: "none,exactdocs"
      thinking:
        description: The agents' thinking (on, off, low, medium, high; blank for each model's default)
        required: false
        default: ""
      retrieval:
        description: Retrieval configurations, separated by spaces (name:key=value,...)
        required: false
        default: "bm25:mode=bm25 hybrid:mode=hybrid,embedding.model=eval:text-embedding-3-small"
      args:
        description: Extra arguments (e.g. --projects zod --limit 10, --grounded-docs bge-small-en-v1.5)
        required: false
        default: ""

concurrency:
  group: agent-bench
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PYDANTIC_AI_NO_BANNER: "1"

# Runner: GitHub-hosted ubuntu-24.04 (docs/releasing/runners.md "CI/CD and runners").
jobs:
  bench:
    name: Agent benchmark with real providers
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: eval-providers # its protection rules decide who may spend the keys
    env:
      EXACTDOCS_AI__PROVIDERS__EVAL__KIND: ${{ vars.EVAL_PROVIDER_KIND }}
      EXACTDOCS_AI__PROVIDERS__EVAL__BASE_URL: ${{ vars.EVAL_PROVIDER_BASE_URL }}
      EXACTDOCS_AI__PROVIDERS__EVAL__API_VERSION: ${{ vars.EVAL_PROVIDER_API_VERSION }}
      OPENAI_BASE_URL: ${{ vars.AGENT_BENCH_OPENAI_BASE_URL }}
      OLLAMA_BASE_URL: ${{ vars.AGENT_BENCH_OLLAMA_BASE_URL }}
      AGENT_MODELS: ${{ inputs.agent_models }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
      ARMS: ${{ inputs.arms }}
      THINKING: ${{ inputs.thinking }}
      RETRIEVAL: ${{ inputs.retrieval }}
      EXTRA_ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      # The context7 and grounded-docs arms' servers are Node.js packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: uv sync --locked
      # The keys are given to this step only, not to `uv sync` (third-party build backends) or the
      # other steps.
      - name: Agent benchmark (just agent-bench run)
        env:
          EXACTDOCS_AI__PROVIDERS__EVAL__API_KEY: ${{ secrets.EVAL_PROVIDER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.AGENT_BENCH_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.AGENT_BENCH_ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGENT_BENCH_GOOGLE_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.AGENT_BENCH_OLLAMA_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          # A blank variable is unset: the provider SDKs would take an empty base URL or key.
          for name in OPENAI_BASE_URL OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_API_KEY \
            OLLAMA_BASE_URL OLLAMA_API_KEY CONTEXT7_API_KEY; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          # Grounded Docs and its indexes live in the runner's temporary folder, built per run.
          args=(--judge-model "$JUDGE_MODEL" --arm "${ARMS:-none,exactdocs}"
            --grounded-docs-home "$RUNNER_TEMP/grounded-docs")
          if [ -n "$THINKING" ]; then args+=(--thinking "$THINKING"); fi
          IFS=',' read -ra models <<< "$AGENT_MODELS"
          for model in "${models[@]}"; do args+=(--agent-model "$model"); done
          read -ra configurations <<< "$RETRIEVAL"
          for configuration in "${configurations[@]}"; do args+=(--retrieval "$configuration"); done
          # shellcheck disable=SC2086 # EXTRA_ARGS is a list of arguments
          uv run python packages/exactdocs/evals/run_agent_bench.py run "${args[@]}" $EXTRA_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: agent-bench
          path: reports/evals/
          retention-days: 30
