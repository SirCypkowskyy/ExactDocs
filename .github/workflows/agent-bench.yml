name: Agent benchmark (real providers)

# Manual only: it calls hosted models with the repository's keys, so it never runs on a push or a
# pull request. It runs the agent benchmark (docs/evals.md#the-agent-benchmark,
# `just agent-bench run`): each agent model answers the golden set with only the ExactDocs MCP
# tools, under each retrieval configuration, and an LLM judge grades the answers.
#
# Agent and judge models are pydantic-ai model names; their keys:
#
#   repository secrets     AGENT_BENCH_OPENAI_API_KEY, AGENT_BENCH_ANTHROPIC_API_KEY,
#                          AGENT_BENCH_GOOGLE_API_KEY (each optional)
#   repository variable    AGENT_BENCH_OPENAI_BASE_URL (an OpenAI-compatible gateway; optional)
#
# The server's own models (an embedding model in a retrieval configuration, `eval:<model>`) use
# the profile `eval` of the retrieval workflow (eval-providers.yml): the variables
# EVAL_PROVIDER_KIND, EVAL_PROVIDER_BASE_URL, EVAL_PROVIDER_API_VERSION and the secret
# EVAL_PROVIDER_API_KEY. Blank values count as unset.

on:
  workflow_dispatch:
    inputs:
      agent_models:
        description: Agent models, comma-separated (e.g. openai:gpt-5-mini,anthropic:claude-sonnet-4-5)
        required: true
      judge_model:
        description: Judge model (e.g. openai:gpt-5)
        required: true
      retrieval:
        description: Retrieval configurations, separated by spaces (name:key=value,...)
        required: false
        default: "bm25:mode=bm25 hybrid:mode=hybrid,embedding.model=eval:text-embedding-3-small"
      args:
        description: Extra arguments (e.g. --projects zod --limit 10)
        required: false
        default: ""

concurrency:
  group: agent-bench
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PYDANTIC_AI_NO_BANNER: "1"

jobs:
  bench:
    name: Agent benchmark with real providers
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: eval-providers # its protection rules decide who may spend the keys
    env:
      EXACTDOCS_AI__PROVIDERS__EVAL__KIND: ${{ vars.EVAL_PROVIDER_KIND }}
      EXACTDOCS_AI__PROVIDERS__EVAL__BASE_URL: ${{ vars.EVAL_PROVIDER_BASE_URL }}
      EXACTDOCS_AI__PROVIDERS__EVAL__API_VERSION: ${{ vars.EVAL_PROVIDER_API_VERSION }}
      OPENAI_BASE_URL: ${{ vars.AGENT_BENCH_OPENAI_BASE_URL }}
      AGENT_MODELS: ${{ inputs.agent_models }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
      RETRIEVAL: ${{ inputs.retrieval }}
      EXTRA_ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      # The keys are given to this step only, not to `uv sync` (third-party build backends) or the
      # other steps of the job.
      - name: Agent benchmark (just agent-bench run)
        env:
          EXACTDOCS_AI__PROVIDERS__EVAL__API_KEY: ${{ secrets.EVAL_PROVIDER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.AGENT_BENCH_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.AGENT_BENCH_ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.AGENT_BENCH_GOOGLE_API_KEY }}
        run: |
          # A blank variable is unset: the provider SDKs would take an empty base URL or key.
          for name in OPENAI_BASE_URL OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_API_KEY; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          args=(--judge-model "$JUDGE_MODEL")
          IFS=',' read -ra models <<< "$AGENT_MODELS"
          for model in "${models[@]}"; do args+=(--agent-model "$model"); done
          read -ra configurations <<< "$RETRIEVAL"
          for configuration in "${configurations[@]}"; do args+=(--retrieval "$configuration"); done
          # shellcheck disable=SC2086 # EXTRA_ARGS is a list of arguments
          uv run python packages/exactdocs/evals/run_agent_bench.py run "${args[@]}" $EXTRA_ARGS
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: agent-bench
          path: reports/evals/
          retention-days: 30
