# Publishes PyPI packages (uvx exactdocs) and the ghcr.io image when a version tag is pushed.
# A GitHub Release created in the UI also pushes its tag, so it triggers this workflow too.
#
#   tag on main     vX.Y.Z        -> PyPI X.Y.Z          ghcr X.Y.Z, X.Y, latest
#   tag on develop  vX.Y.Z.devN   -> PyPI X.Y.Z.devN     ghcr X.Y.Z.devN, X.Y.Z.devN-<sha7>, dev
#                                    (pre-release: pip/uvx skip it unless asked with --prerelease)
# Every image tag also comes as -ai and -local (X.Y.Z-ai, latest-local, dev-ai, ...): the three
# variants of deploy/Dockerfile (#246). See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Validate tag
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        name: Derive version and channel from the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          n='(0|[1-9][0-9]*)'
          if [[ "$version" =~ ^$n\.$n\.$n$ ]]; then
            channel=stable; branch=main
          elif [[ "$version" =~ ^$n\.$n\.$n\.dev$n$ ]]; then
            channel=dev; branch=develop
          else
            echo "::error::Tag '$GITHUB_REF_NAME' is neither vX.Y.Z (main) nor vX.Y.Z.devN (develop)."
            exit 1
          fi
          git fetch --no-tags origin "$branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::A $channel tag must point at a commit on '$branch'."
            exit 1
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
          echo "### $channel release $version from $branch" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Build web UI
    needs: meta
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  python:
    name: Build Python distributions
    needs: [meta, web]
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    env:
      UV_DYNAMIC_VERSIONING_BYPASS: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: packages/exactdocs/src/exactdocs/_web
      - run: uv build --all-packages --out-dir dist
      - name: Check versions and bundled UI
        run: |
          set -euo pipefail
          v='${{ needs.meta.outputs.version }}'
          ls dist
          test -f "dist/exactdocs-$v-py3-none-any.whl"
          test -f "dist/exactdocs_kernel-$v-py3-none-any.whl"
          unzip -l "dist/exactdocs-$v-py3-none-any.whl" | grep -q 'exactdocs/_web/index.html'
          uvx twine check --strict dist/*
      - name: Smoke test the wheel like uvx would
        run: |
          uv run --isolated --no-project --find-links dist --with "exactdocs==${{ needs.meta.outputs.version }}" exactdocs --version
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          retention-days: 30

  # One job and one GitHub environment per PyPI project: PyPI allows only one pending trusted
  # publisher per (repository, workflow, environment). The kernel goes first because the app
  # pins exactdocs-kernel==<same version>.
  pypi-kernel:
    name: Publish exactdocs-kernel to PyPI
    needs: [meta, python]
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    environment:
      name: pypi
      url: https://pypi.org/project/exactdocs-kernel/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing, no API token stored anywhere
    steps:
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - run: uv publish --trusted-publishing always dist/exactdocs_kernel-*

  pypi:
    name: Publish exactdocs to PyPI
    needs: [meta, pypi-kernel]
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    environment:
      name: pypi-exactdocs
      url: https://pypi.org/project/exactdocs/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - run: uv publish --trusted-publishing always dist/exactdocs-*

  # The three image variants (#246): base (BM25, model-free), -ai (exactdocs[ai]) and -local
  # (exactdocs[ai,local] with the default models). Every variant is built natively and scanned
  # before any is pushed: `image` needs all three scans.
  image-scan:
    name: Scan image (${{ matrix.variant }})
    needs: meta
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 60
    strategy:
      matrix:
        variant: [base, ai, local]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Debian security updates: a cached apt layer would keep the package set of an older build.
      # (The same date in the push below, so it reuses these layers.)
      - id: refresh
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Built natively (arm64, from the cache) and loaded; the Debian and Python packages are the
      # same for amd64. The gate fails on a fixable CRITICAL/HIGH finding; accepted ones are in
      # .trivyignore (docs/releasing.md).
      - name: Build the image to scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.variant }}
          load: true
          tags: exactdocs:scan-${{ matrix.variant }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            DEBIAN_REFRESH=${{ steps.refresh.outputs.date }}
          cache-from: type=gha,scope=exactdocs-${{ matrix.variant }}
          cache-to: type=gha,scope=exactdocs-${{ matrix.variant }},mode=max
      - name: Size budget, packages and models
        run: python3 deploy/check_artifacts.py image exactdocs:scan-${{ matrix.variant }} ${{ matrix.variant }}
      - name: Trivy scan
        uses: ./.github/actions/trivy-gate
        with:
          image: exactdocs:scan-${{ matrix.variant }}
          report-name: trivy-report-${{ matrix.variant }}
          retention-days: 30

  image:
    name: Publish image to ghcr.io (${{ matrix.variant }})
    needs: [meta, image-scan]
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        include:
          - variant: base
            suffix: ""
            title: ExactDocs
          - variant: ai
            suffix: -ai
            title: ExactDocs (AI)
          - variant: local
            suffix: -local
            title: ExactDocs (local models)
    steps:
      - uses: actions/checkout@v7
      # The Python stages cross-build linux/amd64 natively on the ARM64 runner; only the runtime
      # stage's apt-get runs under the QEMU binfmt that the runner VMs have (deploy/runners).
      # The default models of -local are platform-independent and pulled once, natively.
      - uses: docker/setup-buildx-action@v4
      - id: refresh
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # <v>, <v>-ai, <v>-local; stable also X.Y and latest, dev also <v>-<sha7> and dev, each with
      # the variant's suffix (latest-ai, dev-local, ...).
      - id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.meta.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.version }},suffix=${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'stable' }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'stable' }}
            type=raw,value=${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'dev' }}
            type=raw,value=dev${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'dev' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            DEBIAN_REFRESH=${{ steps.refresh.outputs.date }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          annotations: ${{ steps.tags.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=exactdocs-${{ matrix.variant }}
          cache-to: type=gha,scope=exactdocs-${{ matrix.variant }},mode=max
      - uses: sigstore/cosign-installer@v4.1.2 # upstream has no floating major tag
      - name: Sign image (keyless)
        run: cosign sign --yes "${{ needs.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

  github-release:
    name: GitHub Release
    needs: [meta, python, pypi-kernel, pypi, image]
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--verify-tag --generate-notes)
            [[ '${{ needs.meta.outputs.channel }}' == dev ]] && flags+=(--prerelease) || flags+=(--latest)
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
