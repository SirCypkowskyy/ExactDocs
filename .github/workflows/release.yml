# Publishes PyPI packages (uvx exactdocs) and the ghcr.io image when a version tag is pushed.
# A GitHub Release created in the UI also pushes its tag, so it triggers this workflow too.
#
#   tag on main     vX.Y.Z        -> PyPI X.Y.Z          ghcr X.Y.Z, X.Y, latest
#   tag on develop  vX.Y.Z.devN   -> PyPI X.Y.Z.devN     ghcr X.Y.Z.devN, X.Y.Z.devN-<sha7>, dev
#                                    (pre-release: pip/uvx skip it unless asked with --prerelease)
# Every image tag also comes as -ai and -local (X.Y.Z-ai, latest-local, dev-ai, ...): the three
# variants of deploy/Dockerfile (#246). Nothing is published before the retrieval eval (job `eval`,
# docs/evals/suite.md) passes. The integration and end-to-end jobs (job `integration`, integration.yml:
# #507) run only in a manual run started with the input `integration` (#554): a tag push never
# runs them and no publishing job waits for them. See docs/releasing/release-workflow.md.
#
# Runners (#478, docs/releasing/runners.md "CI/CD and runners"), switched by the repository variable
# RUNNER_MODE (Settings -> Secrets and variables -> Actions -> Variables):
#   hybrid (default, also when unset): the GCP self-hosted ARM64 runners [self-hosted, linux, ARM64,
#     exactdocs, gcp] run the eval, the integration pytest and behave suites (when asked for), the web
#     and Python builds and the arm64 image legs; GitHub-hosted ubuntu-24.04 runs the amd64 image
#     legs (natively), the integration image, uvx and browser jobs (when asked for), and the short
#     jobs that validate the tag, publish and sign (a fresh VM each time).
#   self-hosted (the current setting: docs/decisions/ci-runners.md): every job on the GCP runners.
#     The amd64 legs are cross-built there (QEMU runs only the runtime stage's apt-get, never
#     Python) and checked with `check_artifacts.py --no-python`.
#
# A manual run (workflow_dispatch, from any branch) is a DRY RUN: no tag is checked, the version
# is 0.0.0.dev<run number>, and the eval, the distributions, every image build, size check and
# scan run as in a release, but nothing is published (no PyPI, no ghcr.io push, no signature, no
# GitHub Release). Every publishing job and step is limited to `github.event_name == 'push'`.
# With the input `integration` it also runs the integration and end-to-end jobs.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      integration:
        description: Also run the integration jobs (service containers, Docker images, uvx and the browser test)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Validate tag
    runs-on: ${{ vars.RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image: ${{ steps.meta.outputs.image }}
      refresh: ${{ steps.meta.outputs.refresh }}
      created: ${{ steps.meta.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: meta
        name: Derive version and channel from the tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            # A dry run: any branch, a version no release has, nothing published.
            version="0.0.0.dev$GITHUB_RUN_NUMBER"; channel=dry-run; branch="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::A release runs on a tag push, not on '$GITHUB_REF'."
            exit 1
          else
            version="${GITHUB_REF_NAME#v}"
            n='(0|[1-9][0-9]*)'
            if [[ "$version" =~ ^$n\.$n\.$n$ ]]; then
              channel=stable; branch=main
            elif [[ "$version" =~ ^$n\.$n\.$n\.dev$n$ ]]; then
              channel=dev; branch=develop
            else
              echo "::error::Tag '$GITHUB_REF_NAME' is neither vX.Y.Z (main) nor vX.Y.Z.devN (develop)."
              exit 1
            fi
            git fetch --no-tags origin "$branch"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
              echo "::error::A $channel tag must point at a commit on '$branch'."
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            # DEBIAN_REFRESH of every image build, set once: the push must rebuild the layers that
            # were scanned, even when it starts after midnight UTC.
            echo "refresh=$(date -u +%F)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          if [[ "$channel" == dry-run ]]; then
            echo "### Dry run $version from $branch: nothing is published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### $channel release $version from $branch" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The retrieval eval gate: nothing is published unless it passes (`pypi-kernel` and `image` need
  # it). Only the model-free gates run here: wrong-version rate 0 for every mode, BM25 recall@5
  # within 2 points of the baseline.json committed in this tag's tree (--ratchet), on SQLite with
  # hybrid on the term-hash stand-in, then on ParadeDB's pg_search. The eval suite end to end, the
  # ingestion and retrieval benchmarks and the report-only runs on the default local models are in
  # eval.yml, started by hand.
  eval:
    name: Retrieval eval
    needs: meta
    runs-on: [self-hosted, linux, ARM64, exactdocs, gcp]
    # On the self-hosted runner in both modes: nothing in it needs x86. A few minutes.
    timeout-minutes: 30
    services:
      postgres:
        image: paradedb/paradedb:0.26.3-pg17@sha256:950f68abebc78e28fd2ecfc8ed915aa29d07b5dd8cba25b2f513ca4e211dda70
        env:
          POSTGRES_USER: exactdocs
          POSTGRES_PASSWORD: exactdocs-release
          POSTGRES_DB: exactdocs
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U exactdocs -d exactdocs"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Retrieval eval (BM25 gating, hybrid on term-hash)
        run: >-
          uv run python packages/exactdocs/evals/run_retrieval_eval.py
          --offline-embedding --ratchet --report reports/evals/retrieval.json
      # A database of its own with the extension, so the app chooses pg_search at start as a
      # ParadeDB deployment does; --expect-engine fails the step if it fell back to PostgreSQL
      # full-text search instead.
      - name: Retrieval eval on pg_search (BM25, gating)
        env:
          ADMIN_URL: postgresql://exactdocs:exactdocs-release@127.0.0.1:${{ job.services.postgres.ports['5432'] }}
          EXACTDOCS_SECRET_KEY: eval-only-secret-key-0123456789abcdefgh
        run: |
          uv run python - <<'PY'
          import os
          import psycopg
          admin = os.environ["ADMIN_URL"]
          with psycopg.connect(f"{admin}/exactdocs", autocommit=True) as connection:
              connection.execute("CREATE DATABASE exactdocs_eval")
          with psycopg.connect(f"{admin}/exactdocs_eval", autocommit=True) as connection:
              connection.execute("CREATE EXTENSION IF NOT EXISTS pg_search CASCADE")
          PY
          EXACTDOCS_DATABASE_URL="${ADMIN_URL/postgresql:/postgresql+psycopg:}/exactdocs_eval" \
            uv run python packages/exactdocs/evals/run_retrieval_eval.py \
            --expect-engine pg_search --report reports/evals/retrieval-pg-search.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: retrieval-eval
          path: reports/
          retention-days: 30

  # The integration and end-to-end jobs (#507), as a manual CI run with `integration` runs them:
  # the integration pytest and behave suites on PostgreSQL, Supabase, PgBouncer and every search
  # and vector server; the Docker images' build, scan and smoke tests; uvx, the upgrade from the
  # previous release and the browser end-to-end test. Only in a dry run started with the input
  # `integration` (#554); a tag push skips them. No job needs them: a dry run publishes nothing,
  # so a failure there fails the run and has nothing to hold back, and on a tag push a skipped
  # job in `needs` would skip every job after it. The Python job runs on the self-hosted runner
  # in both modes (input `release`), as the eval does; there Pinecone Local (amd64-only) is not
  # started and its cases skip.
  integration:
    name: Integration
    needs: meta
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.integration }}
    uses: ./.github/workflows/integration.yml
    with:
      release: true

  web:
    name: Build web UI
    needs: meta
    runs-on: [self-hosted, linux, ARM64, exactdocs, gcp]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  python:
    name: Build Python distributions
    needs: [meta, web]
    runs-on: [self-hosted, linux, ARM64, exactdocs, gcp]
    env:
      UV_DYNAMIC_VERSIONING_BYPASS: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: packages/exactdocs/src/exactdocs/_web
      - run: uv build --all-packages --out-dir dist
      - name: Check versions and bundled UI
        run: |
          set -euo pipefail
          v='${{ needs.meta.outputs.version }}'
          ls dist
          test -f "dist/exactdocs-$v-py3-none-any.whl"
          test -f "dist/exactdocs_kernel-$v-py3-none-any.whl"
          # The bundled UI with its third-party notices, the LICENSE, size and requirements.
          python3 deploy/check_artifacts.py wheel "dist/exactdocs-$v-py3-none-any.whl"
          # Every wheel and sdist carries the LICENSE (license-files, #533).
          python3 - dist/*.whl dist/*.tar.gz <<'PY'
          import sys, tarfile, zipfile
          for path in sys.argv[1:]:
              if path.endswith(".whl"):
                  ok = any(n.endswith(".dist-info/licenses/LICENSE") for n in zipfile.ZipFile(path).namelist())
              else:
                  ok = any(n.count("/") == 1 and n.endswith("/LICENSE") for n in tarfile.open(path).getnames())
              if not ok:
                  print(f"::error::{path} has no LICENSE")
                  sys.exit(1)
          PY
          # An exact twine: the release build runs no tool at a version it was not tested with.
          uvx twine==7.0.0 check --strict dist/*
      - name: Smoke test the wheel like uvx would
        run: |
          uv run --isolated --no-project --find-links dist --with "exactdocs==${{ needs.meta.outputs.version }}" exactdocs --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          retention-days: 30

  # One job and one GitHub environment per PyPI project: PyPI allows only one pending trusted
  # publisher per (repository, workflow, environment). The kernel goes first because the app
  # pins exactdocs-kernel==<same version>. Never in a dry run.
  pypi-kernel:
    name: Publish exactdocs-kernel to PyPI
    needs: [meta, python, eval]
    if: github.event_name == 'push'
    runs-on: ${{ vars.RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    environment:
      name: pypi
      url: https://pypi.org/project/exactdocs-kernel/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing, no API token stored anywhere
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - run: uv publish --trusted-publishing always dist/exactdocs_kernel-*

  pypi:
    name: Publish exactdocs to PyPI
    needs: [meta, pypi-kernel]
    if: github.event_name == 'push'
    runs-on: ${{ vars.RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    environment:
      name: pypi-exactdocs
      url: https://pypi.org/project/exactdocs/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - run: uv publish --trusted-publishing always dist/exactdocs-*

  # The three image variants (#246): base (BM25, model-free), -ai (exactdocs[ai]) and -local
  # (exactdocs[ai,local] with the default models), each for linux/amd64 and linux/arm64, checked
  # against its size budget and scanned before anything is pushed: `image` needs all six scans.
  # arm64 is built natively on the self-hosted runner; amd64 natively on ubuntu-24.04 in hybrid
  # mode, or cross-built on the self-hosted runner in self-hosted mode: the Python stages run
  # natively there and cross-install the venv, and only the runtime stage's apt-get runs under
  # QEMU, because Python 3.14 crashes under it (deploy/Dockerfile). So a cross-built image's
  # check runs no Python in it (`--no-python`: size, packages from their .dist-info, model
  # files; the -local default models are checked by the arm64 leg, the same files).
  image-scan:
    name: Scan image (${{ matrix.variant }}, ${{ matrix.arch }})
    needs: meta
    runs-on: ${{ (matrix.arch == 'arm64' || vars.RUNNER_MODE == 'self-hosted') && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false # one variant's finding must not hide another's
      matrix:
        variant: [base, ai, local]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hosted runners start with little free disk; -local, the build cache and the scan's
      # `docker save` copy need several GB. Never on the self-hosted runner.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Debian security updates: a cached apt layer would keep the package set of an older
      # build, so DEBIAN_REFRESH is the release's date (needs.meta.outputs.refresh, the same in
      # `image`, so it reuses these layers).
      # binfmt for the cross-built amd64 leg on the ARM64 runner (self-hosted mode only).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'amd64' && runner.arch == 'ARM64'
        with:
          platforms: amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built and loaded. The gate fails on a fixable CRITICAL/HIGH finding; accepted
      # ones are in .trivyignore (docs/releasing/image-scan.md). The GitHub Actions cache, one scope per
      # variant and architecture, hands these layers to the build in `image`.
      - name: Build the image to scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: exactdocs:scan-${{ matrix.variant }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.meta.outputs.created }}
            DEBIAN_REFRESH=${{ needs.meta.outputs.refresh }}
          cache-from: type=gha,scope=exactdocs-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,scope=exactdocs-${{ matrix.variant }}-${{ matrix.arch }},mode=max
      - name: Size budget, packages and models
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          NO_PYTHON: ${{ matrix.arch == 'amd64' && runner.arch == 'ARM64' && '--no-python' || '' }}
        run: >-
          python3 deploy/check_artifacts.py image exactdocs:scan-${{ matrix.variant }}-${{ matrix.arch }}
          ${{ matrix.variant }} ${NO_PYTHON:+"$NO_PYTHON"}
      # Trivy reads the saved image's files and runs nothing in it, so emulation does not matter.
      - name: Trivy scan
        uses: ./.github/actions/trivy-gate
        with:
          image: exactdocs:scan-${{ matrix.variant }}-${{ matrix.arch }}
          report-name: trivy-report-${{ matrix.variant }}-${{ matrix.arch }}
          retention-days: 30
      # The self-hosted runner is persistent: drop the scanned image (the cache keeps the layers).
      - name: Remove the scanned image
        if: always()
        run: docker image rm -f "exactdocs:scan-${{ matrix.variant }}-${{ matrix.arch }}" >/dev/null || true

  # Each variant and architecture again, on the same kind of runner and from the scan's cache (the
  # same build arguments, so the same layers), now with SBOM and provenance attestations, pushed by digest
  # only: no tag until `image-publish`. A dry run builds it and pushes nothing.
  image:
    name: Build image (${{ matrix.variant }}, ${{ matrix.arch }})
    needs: [meta, image-scan, eval]
    runs-on: ${{ (matrix.arch == 'arm64' || vars.RUNNER_MODE == 'self-hosted') && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [base, ai, local]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'amd64' && runner.arch == 'ARM64'
        with:
          platforms: amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image's labels (title, description, licenses, version, revision, created) come from
      # the variant's stage of deploy/Dockerfile and these build arguments.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.meta.outputs.created }}
            DEBIAN_REFRESH=${{ needs.meta.outputs.refresh }}
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=exactdocs-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Record the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::the build reported no digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-arch index per variant from its two pushed images (their attestations come along),
  # tagged, annotated and keyless-signed with cosign. Never in a dry run.
  image-publish:
    name: Publish image to ghcr.io (${{ matrix.variant }})
    needs: [meta, image]
    if: github.event_name == 'push'
    runs-on: ${{ vars.RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        include:
          # title, description and licenses as in the variant's stage of deploy/Dockerfile.
          - variant: base
            suffix: ""
            title: ExactDocs
            description: Self-hosted, version-accurate documentation for AI coding agents
            licenses: Apache-2.0
          - variant: ai
            suffix: -ai
            title: ExactDocs (AI)
            description: Self-hosted, version-accurate documentation for AI coding agents, with AI retrieval (exactdocs[ai])
            licenses: Apache-2.0
          - variant: local
            suffix: -local
            title: ExactDocs (local models)
            description: Self-hosted, version-accurate documentation for AI coding agents, with local embedding and reranking models (exactdocs[ai,local])
            licenses: Apache-2.0 AND MIT
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # <v>, <v>-ai, <v>-local; stable also X.Y and latest, dev also <v>-<sha7> and dev, each with
      # the variant's suffix (latest-ai, dev-local, ...). The annotations go on the index.
      - id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ needs.meta.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.version }},suffix=${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'stable' }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'stable' }}
            type=raw,value=${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'dev' }}
            type=raw,value=dev${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'dev' }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
      - id: index
        name: Create, tag and check the multi-arch index
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          TAGS: ${{ steps.tags.outputs.tags }}
          ANNOTATIONS: ${{ steps.tags.outputs.annotations }}
          REF: ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}${{ matrix.suffix }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          while IFS= read -r annotation; do
            if [[ -n "$annotation" ]]; then args+=(--annotation "$annotation"); fi
          done <<< "$ANNOTATIONS"
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do sources+=("$IMAGE@sha256:$(basename "$file")"); done
          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "::error::expected the amd64 and arm64 images, got ${#sources[@]}"
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$REF"
          platforms=$(docker buildx imagetools inspect --raw "$REF" | jq -r \
            '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          if [[ "$platforms" != linux/amd64,linux/arm64 ]]; then
            echo "::error::the index holds '$platforms', not linux/amd64 and linux/arm64"
            exit 1
          fi
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$REF" | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless)
        run: cosign sign --yes "${{ needs.meta.outputs.image }}@${{ steps.index.outputs.digest }}"

  github-release:
    name: GitHub Release
    needs: [meta, python, pypi-kernel, pypi, image-publish]
    if: github.event_name == 'push'
    runs-on: ${{ vars.RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted","linux","ARM64","exactdocs","gcp"]') || 'ubuntu-24.04' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--verify-tag --generate-notes)
            [[ '${{ needs.meta.outputs.channel }}' == dev ]] && flags+=(--prerelease) || flags+=(--latest)
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
