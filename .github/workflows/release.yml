# Publishes PyPI packages (uvx exactdocs) and the ghcr.io image when a version tag is pushed.
# A GitHub Release created in the UI also pushes its tag, so it triggers this workflow too.
#
#   tag on main     vX.Y.Z        -> PyPI X.Y.Z          ghcr X.Y.Z, X.Y, latest
#   tag on develop  vX.Y.Z.devN   -> PyPI X.Y.Z.devN     ghcr X.Y.Z.devN, X.Y.Z.devN-<sha7>, dev
#                                    (pre-release: pip/uvx skip it unless asked with --prerelease)
# Every image tag also comes as -ai and -local (X.Y.Z-ai, latest-local, dev-ai, ...): the three
# variants of deploy/Dockerfile (#246). Nothing is published before the retrieval eval passes
# (job `eval`, docs/evals.md). See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Validate tag
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image: ${{ steps.meta.outputs.image }}
      refresh: ${{ steps.meta.outputs.refresh }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        name: Derive version and channel from the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          n='(0|[1-9][0-9]*)'
          if [[ "$version" =~ ^$n\.$n\.$n$ ]]; then
            channel=stable; branch=main
          elif [[ "$version" =~ ^$n\.$n\.$n\.dev$n$ ]]; then
            channel=dev; branch=develop
          else
            echo "::error::Tag '$GITHUB_REF_NAME' is neither vX.Y.Z (main) nor vX.Y.Z.devN (develop)."
            exit 1
          fi
          git fetch --no-tags origin "$branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::A $channel tag must point at a commit on '$branch'."
            exit 1
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            # DEBIAN_REFRESH of every image build, set once: the push must rebuild the layers that
            # were scanned, even when it starts after midnight UTC.
            echo "refresh=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"
          echo "### $channel release $version from $branch" >> "$GITHUB_STEP_SUMMARY"

  # The retrieval eval (docs/evals.md) runs here, not on pull requests: nothing is published
  # unless it passes (`pypi-kernel` and `image` need it). Model-free gates first: wrong-version
  # rate 0 for every mode, BM25 recall@5 within 2 points of the baseline.json committed in this
  # tag's tree (--ratchet: that file must be recorded for this dataset), on SQLite with hybrid on
  # the term-hash stand-in, then on ParadeDB's pg_search; then the suite's end-to-end tests
  # (pytest -m eval). Last, hybrid and rerank on the real default local models, report-only.
  eval:
    name: Retrieval eval
    needs: meta
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 40
    services:
      postgres:
        image: paradedb/paradedb:0.26.3-pg17@sha256:950f68abebc78e28fd2ecfc8ed915aa29d07b5dd8cba25b2f513ca4e211dda70
        env:
          POSTGRES_USER: exactdocs
          POSTGRES_PASSWORD: exactdocs-release
          POSTGRES_DB: exactdocs
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U exactdocs -d exactdocs"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Retrieval eval (BM25 gating, hybrid on term-hash)
        run: >-
          uv run python packages/exactdocs/evals/run_retrieval_eval.py
          --offline-embedding --ratchet --report reports/evals/retrieval.json
      # A database of its own with the extension, so the app chooses pg_search at start as a
      # ParadeDB deployment does; --expect-engine fails the step if it fell back to PostgreSQL
      # full-text search instead.
      - name: Retrieval eval on pg_search (BM25, gating)
        env:
          ADMIN_URL: postgresql://exactdocs:exactdocs-release@127.0.0.1:${{ job.services.postgres.ports['5432'] }}
          EXACTDOCS_SECRET_KEY: eval-only-secret-key-0123456789abcdefgh
        run: |
          uv run python - <<'PY'
          import os
          import psycopg
          admin = os.environ["ADMIN_URL"]
          with psycopg.connect(f"{admin}/exactdocs", autocommit=True) as connection:
              connection.execute("CREATE DATABASE exactdocs_eval")
          with psycopg.connect(f"{admin}/exactdocs_eval", autocommit=True) as connection:
              connection.execute("CREATE EXTENSION IF NOT EXISTS pg_search CASCADE")
          PY
          EXACTDOCS_DATABASE_URL="${ADMIN_URL/postgresql:/postgresql+psycopg:}/exactdocs_eval" \
            uv run python packages/exactdocs/evals/run_retrieval_eval.py \
            --expect-engine pg_search --report reports/evals/retrieval-pg-search.json
      - name: The suite end to end (pytest -m eval)
        run: uv run pytest -m eval packages/exactdocs/tests/evals --junitxml=reports/pytest-eval.xml
      # Report-only from here (continue-on-error): a failed pull or a model's numbers never stop
      # the release; a wrong version (rate above 0) still shows as a failed step. The models are
      # cached between releases under a key named after the pinned revisions, so a new pin gets a
      # new cache and a warm run contacts no Hub. A mode becomes a default only when it beats
      # BM25's recall@5 by 5 points with no wrong version (`default-eligible` in the summary).
      - name: Use the default local models from here on
        run: |
          {
            echo "EXACTDOCS_MODELS_DIR=$GITHUB_WORKSPACE/.models"
            echo "EXACTDOCS_TEST_MODELS_DIR=$GITHUB_WORKSPACE/.models"
            echo "EXACTDOCS_AI__PROVIDERS__LOCAL__KIND=local"
            echo "EXACTDOCS_AI__EMBEDDING__MODEL=local:BAAI/bge-small-en-v1.5"
          } >> "$GITHUB_ENV"
      - name: Name the models cache after the pinned revisions
        id: models-key
        run: >-
          uv run python -c "from exactdocs.bootstrap.constants import PINNED_MODEL_REVISIONS as p;
          print('key=local-models-' + '-'.join(m.replace('/', '_') + '@' + r[:12] for m, r in
          sorted(p.items())))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .models
          key: ${{ steps.models-key.outputs.key }}
      - name: Pull the default models (skipped when the cache has them)
        continue-on-error: true
        run: uv run exactdocs models pull
      - name: The default models embed and rerank with sockets blocked
        continue-on-error: true
        run: uv run pytest -p no:cacheprovider packages/exactdocs/tests/bootstrap/test_local_models_real.py
      - name: Retrieval eval, hybrid on bge-small (local embedding, report-only)
        continue-on-error: true
        run: >-
          uv run python packages/exactdocs/evals/run_retrieval_eval.py
          --configured-models --local-roles embedding --modes bm25,hybrid
          --report reports/evals/local-hybrid.json
      # On a runner's CPU 32 long candidates can take more than the 2 s default, so the timeout is
      # raised: a reranker that timed out would not be measured (`rerank_fallbacks` must be 0).
      - name: Retrieval eval, reranked by MiniLM (local reranker, report-only)
        continue-on-error: true
        env:
          EXACTDOCS_AI__RERANKER__MODEL: local:Xenova/ms-marco-MiniLM-L-6-v2
          EXACTDOCS_AI__RERANKER__TIMEOUT: "30"
        run: >-
          uv run python packages/exactdocs/evals/run_retrieval_eval.py
          --configured-models --local-roles embedding,reranker --modes bm25,hybrid
          --report reports/evals/local-rerank.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: retrieval-eval
          path: reports/
          retention-days: 30

  web:
    name: Build web UI
    needs: meta
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  python:
    name: Build Python distributions
    needs: [meta, web]
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    env:
      UV_DYNAMIC_VERSIONING_BYPASS: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: packages/exactdocs/src/exactdocs/_web
      - run: uv build --all-packages --out-dir dist
      - name: Check versions and bundled UI
        run: |
          set -euo pipefail
          v='${{ needs.meta.outputs.version }}'
          ls dist
          test -f "dist/exactdocs-$v-py3-none-any.whl"
          test -f "dist/exactdocs_kernel-$v-py3-none-any.whl"
          unzip -l "dist/exactdocs-$v-py3-none-any.whl" | grep -q 'exactdocs/_web/index.html'
          uvx twine check --strict dist/*
      - name: Smoke test the wheel like uvx would
        run: |
          uv run --isolated --no-project --find-links dist --with "exactdocs==${{ needs.meta.outputs.version }}" exactdocs --version
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          retention-days: 30

  # One job and one GitHub environment per PyPI project: PyPI allows only one pending trusted
  # publisher per (repository, workflow, environment). The kernel goes first because the app
  # pins exactdocs-kernel==<same version>.
  pypi-kernel:
    name: Publish exactdocs-kernel to PyPI
    needs: [meta, python, eval]
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    environment:
      name: pypi
      url: https://pypi.org/project/exactdocs-kernel/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing, no API token stored anywhere
    steps:
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - run: uv publish --trusted-publishing always dist/exactdocs_kernel-*

  pypi:
    name: Publish exactdocs to PyPI
    needs: [meta, pypi-kernel]
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    environment:
      name: pypi-exactdocs
      url: https://pypi.org/project/exactdocs/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - run: uv publish --trusted-publishing always dist/exactdocs-*

  # The three image variants (#246): base (BM25, model-free), -ai (exactdocs[ai]) and -local
  # (exactdocs[ai,local] with the default models). Every variant is built natively and scanned
  # before any is pushed: `image` needs all three scans.
  image-scan:
    name: Scan image (${{ matrix.variant }})
    needs: meta
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 60
    strategy:
      matrix:
        variant: [base, ai, local]
    steps:
      - uses: actions/checkout@v7
      # Debian security updates: a cached apt layer would keep the package set of an older
      # build, so DEBIAN_REFRESH is the release's date (needs.meta.outputs.refresh, the same in
      # the push below, so it reuses these layers).
      - uses: docker/setup-buildx-action@v4
      # Built natively (arm64, from the cache) and loaded; the Debian and Python packages are the
      # same for amd64. The gate fails on a fixable CRITICAL/HIGH finding; accepted ones are in
      # .trivyignore (docs/releasing.md).
      - name: Build the image to scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.variant }}
          load: true
          tags: exactdocs:scan-${{ matrix.variant }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            DEBIAN_REFRESH=${{ needs.meta.outputs.refresh }}
          cache-from: type=gha,scope=exactdocs-${{ matrix.variant }}
          cache-to: type=gha,scope=exactdocs-${{ matrix.variant }},mode=max
      - name: Size budget, packages and models
        run: python3 deploy/check_artifacts.py image exactdocs:scan-${{ matrix.variant }} ${{ matrix.variant }}
      - name: Trivy scan
        uses: ./.github/actions/trivy-gate
        with:
          image: exactdocs:scan-${{ matrix.variant }}
          report-name: trivy-report-${{ matrix.variant }}
          retention-days: 30

  image:
    name: Publish image to ghcr.io (${{ matrix.variant }})
    needs: [meta, image-scan, eval]
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        include:
          # title, description and licenses as in the variant's stage of deploy/Dockerfile:
          # metadata-action's own labels (from the repository) would replace them otherwise.
          - variant: base
            suffix: ""
            title: ExactDocs
            description: Self-hosted, version-accurate documentation for AI coding agents
            licenses: Apache-2.0
          - variant: ai
            suffix: -ai
            title: ExactDocs (AI)
            description: Self-hosted, version-accurate documentation for AI coding agents, with AI retrieval (exactdocs[ai])
            licenses: Apache-2.0
          - variant: local
            suffix: -local
            title: ExactDocs (local models)
            description: Self-hosted, version-accurate documentation for AI coding agents, with local embedding and reranking models (exactdocs[ai,local])
            licenses: Apache-2.0 AND MIT
    steps:
      - uses: actions/checkout@v7
      # The Python stages cross-build linux/amd64 natively on the ARM64 runner; only the runtime
      # stage's apt-get runs under the QEMU binfmt that the runner VMs have (deploy/runners).
      # The default models of -local are platform-independent and pulled once, natively.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # <v>, <v>-ai, <v>-local; stable also X.Y and latest, dev also <v>-<sha7> and dev, each with
      # the variant's suffix (latest-ai, dev-local, ...).
      - id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.meta.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.version }},suffix=${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'stable' }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'stable' }}
            type=raw,value=${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'dev' }}
            type=raw,value=dev${{ matrix.suffix }},enable=${{ needs.meta.outputs.channel == 'dev' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            DEBIAN_REFRESH=${{ needs.meta.outputs.refresh }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          annotations: ${{ steps.tags.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=exactdocs-${{ matrix.variant }}
          cache-to: type=gha,scope=exactdocs-${{ matrix.variant }},mode=max
      - uses: sigstore/cosign-installer@v4.1.3 # upstream has no floating major tag
      - name: Sign image (keyless)
        run: cosign sign --yes "${{ needs.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

  github-release:
    name: GitHub Release
    needs: [meta, python, pypi-kernel, pypi, image]
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--verify-tag --generate-notes)
            [[ '${{ needs.meta.outputs.channel }}' == dev ]] && flags+=(--prerelease) || flags+=(--latest)
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
