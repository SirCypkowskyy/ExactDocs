name: Retrieval eval (real providers)

# Manual only: it calls hosted models with the repository's keys, so it never runs on a push or a
# pull request. It runs the retrieval eval suite (docs/evals.md, `just eval --allow-providers`)
# with one provider profile, `eval`, configured the way an operator configures ExactDocs
# (EXACTDOCS_AI__..., docs/decisions/ai-retrieval.md):
#
#   repository variables   EVAL_PROVIDER_KIND (e.g. openai-compatible, openai, anthropic, azure),
#                          EVAL_PROVIDER_BASE_URL, EVAL_PROVIDER_API_VERSION (azure),
#                          EVAL_EMBEDDING_MODEL, EVAL_RERANKER_MODEL, EVAL_LLM_MODEL,
#                          EVAL_JUDGE_MODEL (model names only; each optional)
#   repository secret      EVAL_PROVIDER_API_KEY
#
# Blank variables count as unset. Roles left empty stay unset, and the modes that need them are
# reported `unavailable`. Needs the eval suite of #90 (`packages/exactdocs/evals/`).

on:
  workflow_dispatch:
    inputs:
      args:
        description: Extra arguments for the eval runner (e.g. --mode hybrid)
        required: false
        default: ""

concurrency:
  group: eval-providers
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  eval:
    name: Retrieval eval with real providers
    runs-on: [self-hosted, linux, ARM64, exactdocs]
    timeout-minutes: 60
    environment: eval-providers # its protection rules decide who may spend the keys
    env:
      EXACTDOCS_AI__PROVIDERS__EVAL__KIND: ${{ vars.EVAL_PROVIDER_KIND }}
      EXACTDOCS_AI__PROVIDERS__EVAL__BASE_URL: ${{ vars.EVAL_PROVIDER_BASE_URL }}
      EXACTDOCS_AI__PROVIDERS__EVAL__API_VERSION: ${{ vars.EVAL_PROVIDER_API_VERSION }}
      EXACTDOCS_AI__PROVIDERS__EVAL__API_KEY: ${{ secrets.EVAL_PROVIDER_API_KEY }}
      EVAL_EMBEDDING_MODEL: ${{ vars.EVAL_EMBEDDING_MODEL }}
      EVAL_RERANKER_MODEL: ${{ vars.EVAL_RERANKER_MODEL }}
      EVAL_LLM_MODEL: ${{ vars.EVAL_LLM_MODEL }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      EXTRA_ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # upstream has no floating major tag
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Configure the roles (<profile>:<model>, profile `eval`)
        run: |
          for role in embedding reranker llm judge; do
            upper=$(echo "$role" | tr '[:lower:]' '[:upper:]')
            model_var="EVAL_${upper}_MODEL"
            if [ -n "${!model_var}" ]; then
              echo "EXACTDOCS_AI__${upper}__MODEL=eval:${!model_var}" >> "$GITHUB_ENV"
            fi
          done
      - name: Check the roles reach the provider (exactdocs ai check)
        run: EXACTDOCS_DATA_DIR="$RUNNER_TEMP/exactdocs-check" uv run exactdocs ai check
      - name: Retrieval eval (just eval --allow-providers)
        run: |
          # shellcheck disable=SC2086 # EXTRA_ARGS is a list of arguments
          uv run python packages/exactdocs/evals/run_retrieval_eval.py --allow-providers $EXTRA_ARGS
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: retrieval-eval-providers
          path: reports/evals/
          retention-days: 30
