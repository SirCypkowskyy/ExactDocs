name: Retrieval eval (real providers)

# Manual only: it calls hosted models with the repository's keys, so it never runs on a push or a
# pull request. It runs the retrieval eval suite (docs/evals/suite.md,
# `just eval --configured-models --allow-providers`)
# with one provider profile, `eval`, configured the way an operator configures ExactDocs
# (EXACTDOCS_AI__..., docs/decisions/ai-retrieval.md):
#
#   repository variables   EVAL_PROVIDER_KIND (e.g. openai-compatible, openai, anthropic, azure),
#                          EVAL_PROVIDER_BASE_URL, EVAL_PROVIDER_API_VERSION (azure),
#                          EVAL_EMBEDDING_MODEL, EVAL_RERANKER_MODEL, EVAL_LLM_MODEL,
#                          EVAL_JUDGE_MODEL (model names only; each optional),
#                          EVAL_RERANK_WITH (`judge` measures the LLM judge as the reranker of
#                          every mode; unset: the cross-encoder, when EVAL_RERANKER_MODEL is set)
#   repository secret      EVAL_PROVIDER_API_KEY
#
# Blank variables count as unset. Roles left empty stay unset, and the modes that need them are
# reported `unavailable`. With the `benchmark` input, the retrieval benchmark's hosted
# configurations also run on the golden set (job `benchmark`, `just retrieval-bench`).
# With the `context7` input, Context7's REST API answers the golden set where it serves the
# pinned versions (job `context7`, `just context7-bench`, repository secret CONTEXT7_API_KEY).

on:
  workflow_dispatch:
    inputs:
      args:
        description: Extra arguments for the eval runner (e.g. --modes hybrid)
        required: false
        default: ""
      benchmark:
        description: >-
          Also run the retrieval benchmark's hosted configurations on the golden set
          (docs/evals/retrieval-benchmark.md)
        type: boolean
        required: false
        default: false
      benchmark_configs:
        description: Benchmark configurations (names or patterns, comma-separated)
        required: false
        default: "bm25,*+judge,*:hosted*"
      benchmark_args:
        description: Extra arguments for the benchmark (e.g. --chunkings default,h2)
        required: false
        default: ""
      context7:
        description: >-
          Also measure Context7 on the golden set (docs/evals/context7.md); needs the
          CONTEXT7_API_KEY secret
        type: boolean
        required: false
        default: false

concurrency:
  group: eval-providers
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  EXACTDOCS_AI__PROVIDERS__EVAL__KIND: ${{ vars.EVAL_PROVIDER_KIND }}
  EXACTDOCS_AI__PROVIDERS__EVAL__BASE_URL: ${{ vars.EVAL_PROVIDER_BASE_URL }}
  EXACTDOCS_AI__PROVIDERS__EVAL__API_VERSION: ${{ vars.EVAL_PROVIDER_API_VERSION }}
  EVAL_EMBEDDING_MODEL: ${{ vars.EVAL_EMBEDDING_MODEL }}
  EVAL_RERANKER_MODEL: ${{ vars.EVAL_RERANKER_MODEL }}
  EVAL_LLM_MODEL: ${{ vars.EVAL_LLM_MODEL }}
  EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}

# Runners (docs/releasing/runners.md "CI/CD and runners"): GitHub-hosted. The eval and Context7 on
# ubuntu-24.04; the benchmark on ubuntu-24.04-arm, the platform of the recorded runs in evals/results/ (Linux
# aarch64, 4 CPUs), so its latencies compare with theirs. A hosted job stops after 6 hours.
jobs:
  eval:
    name: Retrieval eval with real providers
    # Nothing to measure without a provider (a local-models benchmark run leaves it unset).
    if: ${{ vars.EVAL_PROVIDER_KIND != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: eval-providers # its protection rules decide who may spend the keys
    env:
      EXACTDOCS_AI__RERANK_WITH: ${{ vars.EVAL_RERANK_WITH || 'cross_encoder' }}
      EXTRA_ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Configure the roles (<profile>:<model>, profile `eval`)
        run: |
          for role in embedding reranker llm judge; do
            upper=$(echo "$role" | tr '[:lower:]' '[:upper:]')
            model_var="EVAL_${upper}_MODEL"
            if [ -n "${!model_var}" ]; then
              echo "EXACTDOCS_AI__${upper}__MODEL=eval:${!model_var}" >> "$GITHUB_ENV"
            fi
          done
      # The key is given to the two steps that call the provider only, not to `uv sync`
      # (third-party build backends) or the other steps.
      - name: Check the roles reach the provider (exactdocs ai check)
        env:
          EXACTDOCS_AI__PROVIDERS__EVAL__API_KEY: ${{ secrets.EVAL_PROVIDER_API_KEY }}
        run: |
          # A blank EVAL_PROVIDER_KIND means no provider: drop the blank profile, which ExactDocs
          # would otherwise refuse at startup ("unknown kind"); local models still run.
          [ -n "$EXACTDOCS_AI__PROVIDERS__EVAL__KIND" ] || unset "${!EXACTDOCS_AI__PROVIDERS__EVAL__@}"
          EXACTDOCS_DATA_DIR="$RUNNER_TEMP/exactdocs-check" uv run exactdocs ai check
      - name: Retrieval eval (just eval --configured-models --allow-providers)
        env:
          EXACTDOCS_AI__PROVIDERS__EVAL__API_KEY: ${{ secrets.EVAL_PROVIDER_API_KEY }}
        run: |
          # A blank EVAL_PROVIDER_KIND means no provider: drop the blank profile, which ExactDocs
          # would otherwise refuse at startup ("unknown kind"); local models still run.
          [ -n "$EXACTDOCS_AI__PROVIDERS__EVAL__KIND" ] || unset "${!EXACTDOCS_AI__PROVIDERS__EVAL__@}"
          # shellcheck disable=SC2086 # EXTRA_ARGS is a list of arguments
          uv run python packages/exactdocs/evals/run_retrieval_eval.py --configured-models --allow-providers $EXTRA_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: retrieval-eval-providers
          path: reports/evals/
          retention-days: 30

  # The retrieval benchmark's hosted part (#347): hybrid on the hosted embedding model, the LLM
  # judge over every base, HyDE and agentic, at every chunking configuration, next to BM25 so the
  # summary's recommendation compares them. The `+ce` and local `+judge` configurations need the
  # local models too, pulled as in the release's eval job. Several hours on the runner's CPU with
  # every chunking, and a hosted job stops at 6 hours (the timeout below), artifacts lost: narrow
  # it with benchmark_configs or benchmark_args (e.g. --chunkings default) and run it in parts.
  benchmark:
    name: Retrieval benchmark with real providers
    if: ${{ inputs.benchmark }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    environment: eval-providers # its protection rules decide who may spend the keys
    env:
      EXACTDOCS_MODELS_DIR: ${{ github.workspace }}/.models
      BENCH_CONFIGS: ${{ inputs.benchmark_configs }}
      BENCH_ARGS: ${{ inputs.benchmark_args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Configure the roles (<profile>:<model>, profile `eval`)
        run: |
          for role in embedding llm judge; do
            upper=$(echo "$role" | tr '[:lower:]' '[:upper:]')
            model_var="EVAL_${upper}_MODEL"
            if [ -n "${!model_var}" ]; then
              echo "EXACTDOCS_AI__${upper}__MODEL=eval:${!model_var}" >> "$GITHUB_ENV"
            fi
          done
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: retrieval-bench-models-${{ hashFiles('packages/exactdocs/evals/retrieval_eval/retrieval_bench_cli.py') }}
      - name: Pull the local models (skipped when the cache has them)
        run: >-
          uv run exactdocs models pull BAAI/bge-small-en-v1.5 Xenova/ms-marco-MiniLM-L-6-v2
          snowflake/snowflake-arctic-embed-s BAAI/bge-base-en-v1.5
      - name: Retrieval benchmark (just retrieval-bench --allow-providers)
        env:
          EXACTDOCS_AI__PROVIDERS__EVAL__API_KEY: ${{ secrets.EVAL_PROVIDER_API_KEY }}
        run: |
          # A blank EVAL_PROVIDER_KIND means no provider: drop the blank profile, which ExactDocs
          # would otherwise refuse at startup ("unknown kind"); local models still run.
          [ -n "$EXACTDOCS_AI__PROVIDERS__EVAL__KIND" ] || unset "${!EXACTDOCS_AI__PROVIDERS__EVAL__@}"
          # shellcheck disable=SC2086 # BENCH_ARGS is a list of arguments
          uv run python packages/exactdocs/evals/run_retrieval_bench.py --allow-providers \
            --configs "$BENCH_CONFIGS" --out reports/evals/retrieval-bench $BENCH_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: retrieval-bench-providers
          path: reports/evals/
          retention-days: 30

  # Context7 (#493): its hosted REST API, `/v2/context` with each golden question's library and
  # pinned version, scored with the text scorer next to ExactDocs' BM25. Its raw responses are an
  # artifact (`context7-responses`), never committed: `just context7-bench --from-cache` scores
  # them again without calling the service. Context7's index changes, so a run holds for its date.
  context7:
    name: Context7 on the golden set
    if: ${{ inputs.context7 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: eval-providers # its protection rules decide who may spend the keys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Context7 benchmark (just context7-bench)
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: >-
          uv run python packages/exactdocs/evals/run_context7_bench.py
          --responses reports/evals/context7-responses --out reports/evals
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: context7-bench
          path: |
            reports/evals/context7.json
            reports/evals/context7.md
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: context7-responses
          path: reports/evals/context7-responses/
          retention-days: 30
