name: Image vulnerability gate
description: >
  Scans a local Docker image with Trivy and fails on a fixable CRITICAL or HIGH vulnerability.
  Accepted findings are listed in .trivyignore (see docs/releasing/image-scan.md). Trivy runs from its
  official container image, pinned by digest, on a `docker save` copy of the image: no third-party
  action, no Docker socket in the container.
inputs:
  image:
    description: Local image reference to scan
    required: true
  retention-days:
    description: How long the report artifact is kept
    default: "14"
  report-name:
    description: Name of the report artifact (and file); unique per scan in one workflow run
    default: trivy-report
runs:
  using: composite
  steps:
    - name: Trivy scan
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REPORT: ${{ inputs.report-name }}
        # Trivy v0.76.2
        TRIVY: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      run: |
        set -euo pipefail
        cache="$HOME/.cache/trivy"; mkdir -p "$cache"
        docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
        trap 'rm -f "$RUNNER_TEMP/image.tar"' EXIT
        docker run --rm --user "$(id -u):$(id -g)" \
          -e TRIVY_CACHE_DIR=/cache -v "$cache:/cache" \
          -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
          -v "$PWD/.trivyignore:/.trivyignore:ro" \
          -v "$PWD:/out" \
          "$TRIVY" image --input /image.tar --scanners vuln \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore --format table --output "/out/$REPORT.txt"
    - name: Show the scan report
      if: ${{ !cancelled() }}
      shell: bash
      env:
        REPORT: ${{ inputs.report-name }}
      run: cat "$REPORT.txt" || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.report-name }}.txt
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ignore
