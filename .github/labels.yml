# Source of truth for repository labels. Apply with:
#   .agents/skills/working-on-issues/scripts/sync-labels.sh
- { name: "type: feature", color: "1d76db", description: "New capability or use case" }
- { name: "type: bug", color: "d73a4a", description: "Something that should work is broken" }
- { name: "type: chore", color: "c5def5", description: "Tooling, CI, dependencies, refactoring" }
- { name: "type: docs", color: "0075ca", description: "Documentation only" }
- { name: "type: epic", color: "3e4b9e", description: "Tracking issue for a group of features" }
- { name: "status: triage", color: "fbca04", description: "New; needs review before work starts" }
- { name: "status: ready", color: "0e8a16", description: "Clear and accepted; anyone may claim it" }
- { name: "status: in progress", color: "5319e7", description: "Claimed; someone (human or agent) is working on it" }
- { name: "status: in review", color: "006b75", description: "PR open, waiting for review" }
- { name: "status: blocked", color: "b60205", description: "Cannot proceed; the reason is in a comment" }
- { name: "agent", color: "8a63d2", description: "Being worked on by an AI agent" }
- { name: "area: backend", color: "bfdadc", description: "Python app or kernel" }
- { name: "area: web", color: "bfd4f2", description: "React client" }
- { name: "area: infra", color: "d4c5f9", description: "CI, release, Docker, runners" }
- { name: "good first issue", color: "7057ff", description: "Small and well-scoped" }
