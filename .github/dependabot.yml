version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 4 }
    target-branch: develop
    # pydantic-ai-harness and pydantic-evals pin pydantic-ai-slim exactly, so the stack moves in
    # one PR or not at all. A dependency joins the first group it matches, so this one stays first.
    groups:
      pydantic-ai:
        patterns: [pydantic-ai-slim, pydantic-ai-harness, pydantic-evals, pydantic-monty]
      python: { patterns: ["*"] }
    # The 9.x elasticsearch client refuses Elasticsearch 8 servers, which we support, so the extra
    # stays on 8.x (see the comment on it in packages/exactdocs/pyproject.toml). Moving to 9.x
    # means dropping Elasticsearch 8 support first. With target-branch set, this ignore holds for
    # version updates only; security updates still come.
    ignore:
      - { dependency-name: elasticsearch, update-types: ["version-update:semver-major"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    target-branch: develop
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /deploy/mermaid-check
    schedule: { interval: weekly }
    target-branch: develop
    groups:
      mermaid-check: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    target-branch: develop
  # The coding tasks' environments pin one old library version each on purpose (the evals check
  # version-accurate docs), so no update, not even a security one, may move them. No
  # target-branch here: Dependabot applies an entry to security updates only without one.
  - package-ecosystem: npm
    directories: ["/packages/exactdocs/evals/coding/environments/*"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    ignore: [{ dependency-name: "*" }]
  - package-ecosystem: pip
    directories: ["/packages/exactdocs/evals/coding/environments/*"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    ignore: [{ dependency-name: "*" }]
