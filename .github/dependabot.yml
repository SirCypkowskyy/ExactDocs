version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    target-branch: develop
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /deploy/mermaid-check
    schedule: { interval: weekly }
    target-branch: develop
    groups:
      mermaid-check: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    target-branch: develop
