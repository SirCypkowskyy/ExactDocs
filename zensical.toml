# Documentation site (https://zensical.org). Sources live in docs/.
#   just docs        live preview on http://localhost:8000
#   just docs-build  static site in site/
# Published to GitHub Pages by .github/workflows/docs.yml on changes to docs/.

[project]
site_name = "ExactDocs"
site_description = "Self-hosted, version-accurate documentation for AI coding agents."
site_url = "https://sircypkowskyy.github.io/ExactDocs/"
repo_url = "https://github.com/SirCypkowskyy/ExactDocs"
repo_name = "SirCypkowskyy/ExactDocs"
edit_uri = "edit/develop/docs/"
extra_javascript = ["https://unpkg.com/mermaid@12.3.0/dist/mermaid.min.js"]
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Product" = [
    { "User stories" = "user-stories.md" },
    { "Delivery plan" = "plan.md" },
  ] },
  { "Engineering" = [
    { "Architecture" = "architecture.md" },
    { "Flows" = "flows.md" },
    { "REST API" = "rest-api.md" },
    { "Branching and releases" = "releasing.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tasklist.custom_checkbox = true
pymdownx.tabbed.alternate_style = true
