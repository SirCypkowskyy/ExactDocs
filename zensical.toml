# Documentation site (https://zensical.org). Sources live in docs/.
#   just docs        live preview on http://localhost:8000
#   just docs-build  static site in site/
# Published to GitHub Pages by .github/workflows/docs.yml on changes to docs/.

[project]
site_name = "ExactDocs"
site_description = "Self-hosted, version-accurate documentation for AI coding agents."
site_url = "https://sircypkowskyy.github.io/ExactDocs/"
repo_url = "https://github.com/SirCypkowskyy/ExactDocs"
repo_name = "SirCypkowskyy/ExactDocs"
edit_uri = "edit/develop/docs/"
extra_javascript = ["https://unpkg.com/mermaid@12.3.0/dist/mermaid.min.js"]
# The web UI's colours (web/DESIGN.md, "The Headlamp"), the logo swap for the dark scheme, and the
# home page's hero and grid.
extra_css = ["stylesheets/extra.css"]
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Getting started" = "getting-started.md" },
    { "MCP" = "mcp.md" },
    { "Sources file" = "sources.md" },
    { "Configuration" = "configuration.md" },
    { "Search and AI models" = "search.md" },
    { "Deployment" = "deployment.md" },
  ] },
  { "Product" = [
    { "User stories" = "user-stories.md" },
    { "Delivery plan" = "plan.md" },
    { "AI retrieval decisions" = "decisions/ai-retrieval.md" },
  ] },
  { "Engineering" = [
    { "Architecture" = [
      "architecture/index.md",
      { "Domains and boundaries" = "architecture/domains.md" },
      { "Persistence" = "architecture/persistence.md" },
      { "Version storage" = "architecture/versions.md" },
      { "Vectors, embedding and budgets" = "architecture/embeddings.md" },
      { "Data model" = "architecture/data-model.md" },
      { "Identity" = "architecture/identity.md" },
      { "Usage counts" = "architecture/usage.md" },
      { "Background jobs" = "architecture/jobs.md" },
      { "The import" = "architecture/import.md" },
      { "Telemetry" = "architecture/telemetry.md" },
      { "External index backends" = "architecture/index-backends.md" },
      { "AI retrieval" = "architecture/ai-retrieval.md" },
      { "Agentic search" = "architecture/agentic.md" },
      { "Python conventions" = "architecture/conventions.md" },
      { "Web client" = "architecture/web-client.md" },
    ] },
    { "Flows" = [
      "flows/index.md",
      { "Importing a version" = "flows/import.md" },
      { "Answering a query" = "flows/query.md" },
      { "Retrieval modes" = "flows/retrieval-modes.md" },
      { "Authentication" = "flows/authentication.md" },
    ] },
    { "REST API" = "rest-api.md" },
    { "Retrieval evals" = [
      "evals/index.md",
      { "Retrieval eval suite" = "evals/suite.md" },
      { "Gates and the baseline" = "evals/gates.md" },
      { "Golden set" = "evals/golden-set.md" },
      { "Ingestion benchmark" = "evals/ingestion.md" },
      { "Retrieval benchmark" = "evals/retrieval-benchmark.md" },
      { "Recommendation and statistics" = "evals/statistics.md" },
      { "Retrieval benchmark runs" = "evals/retrieval-runs.md" },
      { "Retrieval grid" = "evals/retrieval-grid.md" },
      { "Scoring text results" = "evals/text-scoring.md" },
      { "Grounded Docs" = "evals/grounded-docs.md" },
      { "Context7" = "evals/context7.md" },
      { "Agent benchmark" = "evals/agent-bench.md" },
      { "Running the agent benchmark" = "evals/agent-bench-running.md" },
    ] },
    { "Branching and releases" = [
      "releasing/index.md",
      { "Branches" = "releasing/branching.md" },
      { "Versions and tags" = "releasing/versions.md" },
