# Documentation site (https://zensical.org). Sources live in docs/.
#   just docs        live preview on http://localhost:8000
#   just docs-build  static site in site/
# Published to GitHub Pages by .github/workflows/docs.yml on changes to docs/.

[project]
site_name = "ExactDocs"
site_description = "Self-hosted, version-accurate documentation for AI coding agents."
site_url = "https://sircypkowskyy.github.io/ExactDocs/"
repo_url = "https://github.com/SirCypkowskyy/ExactDocs"
repo_name = "SirCypkowskyy/ExactDocs"
edit_uri = "edit/develop/docs/"
extra_javascript = ["https://unpkg.com/mermaid@12.3.0/dist/mermaid.min.js"]
# The web UI's colours (web/DESIGN.md, "The Headlamp"), the logo swap for the dark scheme, and the
# home page's hero and grid.
extra_css = ["stylesheets/extra.css"]
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Getting started" = "getting-started.md" },
    { "MCP" = "mcp.md" },
    { "Sources file" = "sources.md" },
    { "Configuration" = "configuration.md" },
    { "Search and AI models" = "search.md" },
    { "Deployment" = "deployment.md" },
  ] },
  { "Product" = [
    { "User stories" = "user-stories.md" },
    { "Delivery plan" = "plan.md" },
    { "AI retrieval decisions" = "decisions/ai-retrieval.md" },
  ] },
  { "Engineering" = [
    { "Architecture" = "architecture.md" },
    { "Flows" = "flows.md" },
    { "REST API" = "rest-api.md" },
    { "Retrieval evals" = "evals.md" },
    { "Branching and releases" = "releasing.md" },
  ] },
  { "Benchmark" = [
    "benchmark/index.md",
    { "Golden set" = "benchmark/golden-set.md" },
    { "Method" = "benchmark/method.md" },
    { "Ingestion results" = "benchmark/ingestion.md" },
    { "Retrieval results" = "benchmark/retrieval.md" },
    { "Agent results" = "benchmark/agent.md" },
    { "Recommended defaults" = "benchmark/defaults.md" },
  ] },
]

[project.theme]
language = "en"
# The mole of the web UI's band (web/src/shared/ui/wordmark.tsx, `Mark`): the small-size cut from
# web/public/brand/, copied to docs/assets/logo/. extra.css swaps it for the on-dark cut in the dark
# scheme. The favicon is the web UI's favicon.svg.
logo = "assets/logo/exactdocs-mark-small.svg"
favicon = "assets/logo/favicon.svg"
# The web UI's faces (web/DESIGN.md, "Typography").
font.text = "Schibsted Grotesk"
font.code = "JetBrains Mono"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tasklist.custom_checkbox = true
pymdownx.tabbed.alternate_style = true
