[project.theme]
language = "en"
# The lockup of the web UI's band (web/src/shared/ui/wordmark.tsx, `Wordmark`), copied from
# web/public/brand/ to docs/assets/logo/. extra.css swaps it for the dark cut in the dark scheme.
# The favicon is the web UI's favicon.svg.
logo = "assets/logo/exactdocs-lockup-light.svg"
favicon = "assets/logo/favicon.svg"
# The web UI's faces (web/DESIGN.md, "Typography"), self-hosted like the UI's: no Google Fonts.
# docs/stylesheets/fonts.css loads them from docs/assets/fonts/ and extra.css names them.
font = false
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tasklist.custom_checkbox = true
pymdownx.tabbed.alternate_style = true
