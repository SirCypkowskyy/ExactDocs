    ] },
  ] },
  { "Benchmark" = [
    "benchmark/index.md",
    { "Golden set" = "benchmark/golden-set.md" },
    { "Method" = "benchmark/method.md" },
    { "Ingestion results" = "benchmark/ingestion.md" },
    { "Retrieval results" = "benchmark/retrieval.md" },
    { "Agent results" = "benchmark/agent.md" },
    { "Comparison with other tools" = "benchmark/comparison.md" },
