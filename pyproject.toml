[project]
name = "exactdocs-workspace"
version = "0"
description = "uv workspace root for ExactDocs (not published)"
requires-python = ">=3.14"
dependencies = ["exactdocs", "exactdocs-kernel"]

[dependency-groups]
dev = [
    "archunitpython>=1.8.1",
    "behave>=1.3",
    # The AI extra is installed for development and CI, so the tests prove it stays unimported
    # while no model is configured (RUN-02), and later AI tests can use pydantic-ai's test models.
    "exactdocs[ai]",
    # The local-models extra too (#245): its tests run tiny ONNX models through fastembed, and the
    # model-free tests prove it stays unimported until a `local` profile's role is configured.
    "exactdocs[local]",
    # The external index backends' clients (#351), so their adapters are type-checked and their
    # contract tests run wherever a server is given (EXACTDOCS_TEST_<NAME>_URL) or, for an
    # embedded backend, everywhere; the architecture tests prove nothing but their adapter
    # imports them.
    "exactdocs[azure-search]",
    "exactdocs[chroma-local]",
    "exactdocs[duckdb]",
    "exactdocs[elasticsearch]",
    "exactdocs[lancedb]",
    "exactdocs[milvus-lite]",
    "exactdocs[mongodb]",
    "exactdocs[opensearch]",
    "exactdocs[pinecone]",
    "exactdocs[qdrant]",
    "exactdocs[redis]",
    # libSQL's driver (#358) is only needed for a local file and has a Python 3.14 wheel for
    # Linux x86_64 only.
    "exactdocs[libsql] ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # ExactDocs' own database on a libSQL server (#474): pure Python, every platform.
    "exactdocs[libsql-database]",
    "httpx>=0.28",
    # The retrieval eval suite (packages/exactdocs/evals, docs/decisions/ai-retrieval.md):
    # exact pin, it moves with pydantic-ai-slim in the `ai` extra.
    "pydantic-evals==2.60.0",
    "pytest>=9",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7",
    # CI shards the fast suite by recorded durations (.test_durations; #507).
    "pytest-split>=0.11",
    "ruff>=0.14",
    "ty>=0.0.1",
]
docs = ["zensical>=0.0.74"]

[tool.uv]
package = false
default-groups = ["dev"]
# `chroma` (the HTTP-only client) and `chroma-local` (the full package) both install the
# `chromadb` module: never both (#361).
conflicts = [
    [{ package = "exactdocs", extra = "chroma" }, { package = "exactdocs", extra = "chroma-local" }],
]
# A new dependency release must be at least 4 days old (Dependabot's cooldown enforces it for
# its own updates).

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
exactdocs = { workspace = true }
exactdocs-kernel = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py314"
line-length = 100
src = [
    "packages/*/src",
    "packages/*/tests",
    "packages/*/tests/fixtures",
    "packages/*/features",
    "packages/*/evals",
]
# The fixture docs repository is content under test (byte-exact, incl. invalid UTF-8), not code.
extend-exclude = [
    "web",
    "packages/exactdocs/src/exactdocs/_web",
    "packages/exactdocs/tests/fixtures/docs-repo",
    "packages/exactdocs/tests/fixtures/sphinx-docs",
    # Code that breaks the Python conventions on purpose, read (never imported) by test_conventions.py.
    "packages/exactdocs/tests/architecture/fixtures",
]

[tool.ruff.lint]
# Everything, including preview rules; opt out only of what conflicts or adds no value here.
preview = true
explicit-preview-rules = false
select = ["ALL"]
ignore = [
    # no per-file copyright headers: the license lives in LICENSE
    "CPY",
    # docstrings for modules, packages, magic methods and __init__ add noise, not information
    "undocumented-public-module",
    "undocumented-public-package",
    "undocumented-magic-method",
    "undocumented-public-init",
    # mutually exclusive with D211 / D212, which we keep
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # conflict with the ruff formatter
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
    # Python 3.14 evaluates annotations lazily (PEP 649); TYPE_CHECKING blocks are not needed
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
    # keyword-only wiring of modules legitimately takes many arguments
    "too-many-arguments",
    "too-many-positional-arguments",
    # TODOs need neither an author nor an issue link
    "line-contains-todo",
    "missing-todo-author",
    "missing-todo-link",
    # structural Protocol implementations: methods/coroutines that ignore self or never await
    "no-self-use",
    "unused-async",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "assert",
    "D",
    "DOC",
    "ANN",
    "magic-value-comparison",
    "FBT",
    "hardcoded-password-string",  # fake secrets in tests
    "hardcoded-password-func-arg",
    "import-private-name",
    "implicit-namespace-package",
]
"e2e/**" = ["D", "implicit-namespace-package", "suspicious-subprocess-import"]
# The eval runner script sits beside its package, outside any package, like e2e/run.py.
"packages/exactdocs/evals/run_retrieval_eval.py" = ["implicit-namespace-package"]
"packages/exactdocs/evals/run_golden.py" = ["implicit-namespace-package"]
"packages/exactdocs/evals/run_ingestion_bench.py" = ["implicit-namespace-package"]
"packages/exactdocs/evals/run_retrieval_bench.py" = ["implicit-namespace-package"]
"packages/exactdocs/evals/run_agent_bench.py" = ["implicit-namespace-package"]
"packages/exactdocs/evals/run_bench_pages.py" = ["implicit-namespace-package"]
"**/features/**" = ["assert", "D", "DOC", "ANN", "FBT", "implicit-namespace-package"]
# Alembic revisions are generated from migrations/script.py.mako: no per-function docstrings.
"**/migrations/versions/**" = ["D"]
# Every test must start in its own empty data directory (see packages/exactdocs/tests/conftest.py).
"**/conftest.py" = ["pytest-fixture-autouse"]
# The fixture builder runs git (a fixed binary, test-controlled arguments) on purpose.
"**/tests/fixtures/fixture_repo.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# The CI artifact guard is a standalone stdlib script that runs docker and reports on stdout.
"deploy/check_artifacts.py" = ["implicit-namespace-package", "suspicious-subprocess-import", "subprocess-without-shell-equals-true", "start-process-with-partial-path", "unspecified-encoding", "builtin-open", "regex-flag-alias", "manual-list-comprehension"]
# The vector benchmark wants reproducible Gaussian data, not secrets.
"**/tests/retrieval/bench_vector_index.py" = ["suspicious-non-cryptographic-random-usage"]
# Runs inside the built image (python - < file) to prove sqlite-vec loads there.
"deploy/check_sqlite_vec.py" = ["implicit-namespace-package"]
# Runs inside the `-local` image (python - < file) to prove it searches with no network (#246).
"deploy/smoke_local.py" = ["implicit-namespace-package"]
# The CI upgrade test is a standalone stdlib script that runs two releases and reports on stdout.
"deploy/upgrade_check.py" = ["implicit-namespace-package", "suspicious-subprocess-import", "subprocess-without-shell-equals-true", "start-process-with-partial-path", "print", "undocumented-public-function", "undocumented-public-method"]
# Runs the app in a fresh interpreter to see which modules it imports.
"**/tests/bootstrap/test_model_free.py" = ["suspicious-subprocess-import", "subprocess-run-without-check", "subprocess-without-shell-equals-true"]
# The browser CI regression runs a fixed repository script and local fake executables.
"**/tests/ci/test_playwright_setup.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# Collects the suite in a fresh interpreter, as `uv run pytest` does (#507).
"**/tests/ci/test_integration_tests.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# Runs its span test in a fresh interpreter: a process's tracer provider is set once.
"**/tests/retrieval/test_agentic_search.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# Runs the app behind a socket guard in a fresh interpreter, with the SDKs' variables set.
"**/tests/fixtures/socket_guard.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]

[tool.ruff.lint.pydocstyle]
# Google style: `Args:`, `Returns:`, `Raises:`. ruff skips private functions and has no rules for
# constants, attribute docstrings or dataclass flags: tests/architecture/test_conventions.py does.
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"abc.ABC".msg = "Use typing.Protocol for ports; no nominal inheritance (see docs/architecture.md)."
"abc.ABCMeta".msg = "Use typing.Protocol for ports; no nominal inheritance (see docs/architecture.md)."

[tool.ruff.lint.isort]
known-first-party = ["exactdocs", "exactdocs_kernel"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- ty
[tool.ty.environment]
python-version = "3.14"
extra-paths = ["packages/exactdocs/tests/fixtures", "packages/exactdocs/evals"]

[tool.ty.src]
include = ["packages"]
exclude = [
    "packages/exactdocs/src/exactdocs/_web",
    "packages/exactdocs/tests/architecture/fixtures",
    "packages/exactdocs/tests/fixtures/sphinx-docs",
]

[tool.ty.rules]
possibly-unresolved-reference = "error"

[[tool.ty.overrides]]
# behave's bundled type hints declare its step decorators as non-callable objects.
include = ["packages/*/features/**"]
rules = { not-callable = "ignore" }

# ---------------------------------------------------------------- pytest
[tool.pytest]
minversion = "9.0"
testpaths = ["packages/exactdocs-kernel/tests", "packages/exactdocs/tests"]
pythonpath = [
    "packages/exactdocs/tests/fixtures",  # fixture_repo.py
    "packages/exactdocs/evals",  # retrieval_eval, the retrieval eval suite
]
addopts = [
    "-ra", "--strict-markers", "--strict-config", "--import-mode=importlib",
    "-m", "not eval",  # docs/evals.md: the release runs them; `uv run pytest -m eval` locally
    # The `integration` tests are deselected too, by tests/fixtures/integration.py (#507), unless
    # `--integration` or EXACTDOCS_INTEGRATION=1 asks for them: the summary says how many.
]
markers = [
    "eval: runs the retrieval eval suite end to end on the imported fixture (slow); skipped by default",
    "integration(*variables): needs a container, a service, the network or a download, named by the variables (#507); deselected unless --integration or EXACTDOCS_INTEGRATION=1, skipped then while a variable is unset",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = [
    "error",
    # google-genai 2.33 (the [ai] extra) touches typing's private _UnionGenericAlias on import,
    # deprecated in Python 3.14; third-party, harmless until 3.17.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types",
    # chromadb 1.5.9 (the [chroma] extras, #361) calls asyncio.iscoroutinefunction on import,
    # deprecated in Python 3.14; third-party, harmless until 3.16.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb.telemetry.opentelemetry",
]

# ---------------------------------------------------------------- behave (BDD acceptance)
[tool.behave]
paths = ["packages/exactdocs/features"]
show_skipped = false
